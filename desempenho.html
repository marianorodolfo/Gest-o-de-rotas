<!DOCTYPE html>
<html lang="pt">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Desempenho</title>

    <link rel="stylesheet" href="layout-global.css">

    <style>
        :root {
            --azul-primo: #2A3B5D;
            --azul-primo-hover: #0d2f50;
            --fundo-painel: #f4f6f8;
            --branco: #ffffff;
            --borda: #e1e6eb;
            --texto: #1f2933;
            --texto-secundario: #667085;
            --sucesso: #2f8f5b;
        }

        .barra-meta {
            width: 100%;
            height: 10px;
            background: var(--borda);
            border-radius: 10px;
            overflow: hidden;
            margin-top: 10px;
        }

        .progresso-meta {
            height: 100%;
            width: 0%;
            background: var(--azul-primo);
            border-radius: 10px;
            transition: width 0.3s ease;
        }

        .cartao-distribuidor {
            background: var(--branco);
            border: 1px solid var(--borda);
            border-radius: 14px;
            padding: 22px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(16, 24, 40, 0.06);
        }

        .cartao-distribuidor h2 {
            margin-top: 0;
            margin-bottom: 12px;
            color: var(--texto);
            font-size: 20px;
        }

        .indicadores-distribuidor {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-top: 18px;
        }

        .indicador {
            background: var(--fundo-painel);
            border: 1px solid var(--borda);
            border-radius: 10px;
            padding: 14px;
            box-shadow: 0 1px 3px rgba(16, 24, 40, 0.04);
        }

        .indicador strong {
            display: block;
            color: var(--azul-primo);
            font-size: 19px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .indicador span {
            color: var(--texto-secundario);
            font-size: 12px;
        }

        .resumo-dia {
            background: var(--branco);
            border: 1px solid var(--borda);
            border-radius: 14px;
            padding: 24px;
            margin-bottom: 25px;
            box-shadow: 0 2px 8px rgba(16, 24, 40, 0.06);
        }

        .resumo-dia h2 {
            margin-top: 0;
            margin-bottom: 4px;
            color: var(--texto);
            font-size: 22px;
        }

        .indicadores-dia {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
            margin-top: 20px;
        }

        .indicador-dia {
            background: var(--fundo-painel);
            border: 1px solid var(--borda);
            border-radius: 12px;
            padding: 18px;
            box-shadow: 0 1px 3px rgba(16, 24, 40, 0.04);
        }

        .indicador-dia strong {
            display: block;
            color: var(--azul-primo);
            font-size: 28px;
            font-weight: 700;
            line-height: 1.1;
            margin-bottom: 7px;
        }

        .indicador-dia span {
            color: var(--texto-secundario);
            font-size: 13px;
        }

        .veiculos-resumo {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 15px;
        }

        .veiculo-resumo {
            background: var(--fundo-painel);
            border: 1px solid var(--borda);
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 1px 3px rgba(16, 24, 40, 0.04);
        }

        .veiculo-resumo strong {
            display: block;
            font-size: 18px;
            margin-bottom: 5px;
        }

        .grafico-container {
            background: var(--branco);
            border: 1px solid var(--borda);
            border-radius: 14px;
            padding: 24px;
            margin-bottom: 25px;
            box-shadow: 0 2px 8px rgba(16, 24, 40, 0.06);
        }

        .grafico-container h2 {
            margin-top: 0;
            margin-bottom: 18px;
            color: var(--texto);
            font-size: 22px;
            font-weight: 700;
        }

        .grafico-barras {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            height: 220px;
            overflow-x: auto;
            padding: 20px 10px 10px;
            background: white;
            border-radius: 8px;
        }

        .barra-dia {
            min-width: 35px;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
        }

        .barra-valor {
            width: 30px;
            background: var(--azul-primo);
            border-radius: 6px 6px 2px 2px;
            min-height: 2px;
            transition: height 0.3s ease, opacity 0.2s ease;
        }

        .barra-label {
            color: var(--texto-secundario);
            font-size: 11px;
            margin-top: 7px;
            white-space: nowrap;
        }

        .barra-numero {
            color: var(--texto);
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        #graficoSaidas {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            height: 220px;
            padding: 20px 10px 10px;
            background: white;
            border-radius: 8px;
        }

        @media (max-width: 700px) {

            .grafico-container {
                padding: 14px;
            }

            .grafico-barras {
                max-width: 100%;
            }

            .cartao-distribuidor {
                max-width: 100%;
                box-sizing: border-box;
            }

            body>h1 {
                font-size: 24px;
                margin-bottom: 16px;
            }

            .filtros-dashboard {
                grid-template-columns: 1fr;
                padding: 14px;
            }

            .filtro-item {
                min-width: 0;
            }

            .filtro-item input,
            .filtro-item select {
                width: 100%;
                min-width: 0;
                font-size: 14px;
                padding: 10px;
            }

            .indicadores-dia {
                grid-template-columns: 1fr 1fr;
            }

            .indicadores-distribuidor {
                grid-template-columns: 1fr 1fr;
            }

            .veiculos-resumo {
                grid-template-columns: 1fr;
            }

            .cartao-distribuidor {
                padding: 16px;
            }

            .resumo-dia {
                padding: 16px;
            }

            #distribuidorFiltro {
                font-size: 13px;
            }

        }

        .indicador-saidas {
            border-top: 4px solid var(--azul-primo);
        }

        .indicador-clientes {
            border-top: 4px solid #2f8f5b;
        }

        .indicador-entregas {
            border-top: 4px solid #e59a23;
        }

        .indicador-tempo {
            border-top: 4px solid #7b61a8;
        }

        .indicador-dia {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .indicador-dia:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(16, 24, 40, 0.10);
        }

        .veiculo-carros {
            border-left: 4px solid var(--azul-primo);
        }

        .veiculo-motos {
            border-left: 4px solid #2f8f5b;
        }

        .veiculo-resumo strong {
            color: var(--texto);
        }

        .barra-valor:hover {
            opacity: 0.8;
        }

        .veiculo-resumo {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .veiculo-resumo:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(16, 24, 40, 0.10);
        }

        .filtros-dashboard {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
            background: var(--branco);
            border: 1px solid var(--borda);
            border-radius: 14px;
            padding: 18px;
            margin-bottom: 25px;
            box-shadow: 0 2px 8px rgba(16, 24, 40, 0.06);
        }

        .filtro-item {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .filtro-item label {
            color: var(--texto-secundario);
            font-size: 13px;
            font-weight: 600;
        }

        .filtro-item input,
        .filtro-item select {
            width: 100%;
            box-sizing: border-box;
            background: var(--branco);
            border: 1px solid var(--borda);
            border-radius: 8px;
            padding: 10px 12px;
            color: var(--texto);
            font-size: 14px;
            outline: none;
        }

        .filtro-item input:focus,
        .filtro-item select:focus {
            border-color: var(--azul-primo);
            box-shadow: 0 0 0 3px rgba(18, 59, 99, 0.10);
        }

        .linha-ranking {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--fundo-painel);
            border: 1px solid var(--borda);
            border-radius: 10px;
            padding: 13px 15px;
            margin: 8px 0;
            color: var(--texto-secundario);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .linha-ranking:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(16, 24, 40, 0.08);
        }

        .linha-ranking strong {
            color: var(--texto);
            font-weight: 700;
        }

        .linha-ranking:nth-of-type(1) {
            border-left: 4px solid #d4a72c;
        }

        .linha-ranking:nth-of-type(2) {
            border-left: 4px solid #9aa0a6;
        }

        .linha-ranking:nth-of-type(3) {
            border-left: 4px solid #b87333;
        }

        .posicao-ranking {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 30px;
            height: 30px;
            margin-right: 6px;
            border-radius: 50%;
            background: var(--azul-primo);
            color: white;
            font-size: 12px;
            font-weight: 700;
        }

        .linha-ranking:nth-of-type(1) .posicao-ranking {
            background: #d4a72c;
        }

        .linha-ranking:nth-of-type(2) .posicao-ranking {
            background: #9aa0a6;
        }

        .linha-ranking:nth-of-type(3) .posicao-ranking {
            background: #b87333;
        }

        body>h1 {
            color: var(--texto);
            font-size: 28px;
            font-weight: 700;
            margin: 0 0 20px 0;
            line-height: 1.2;
        }

        #resumoDia {
            margin-bottom: 25px;
        }

        #graficoSaidas {
            margin-top: 5px;
        }

        #resumoDistribuidores {
            margin-top: 25px;
        }

        html,
        body {
            max-width: 100%;
            overflow-x: hidden;
        }

        body {
            margin: 0;
            padding: 74px 16px 16px;
            background: #f3f6fa;
            font-family: Arial, Helvetica, sans-serif;
        }

        @media (min-width: 769px) {
            body {
                padding-left: 201px;
            }
        }

        .filtros-dashboard {
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 12px;

            padding: 14px 16px;
            margin-bottom: 16px;

            background: #ffffff;
            border: 1px solid #dce5ef;
            border-radius: 10px;

            box-shadow: 0 3px 12px rgba(18, 59, 99, 0.04);
        }

        .filtro-item {
            min-width: 0;
            gap: 5px;
        }

        .filtro-item label {
            color: #64748b;
            font-size: 10px;
            font-weight: 800;
        }

        .filtro-item input,
        .filtro-item select {
            min-height: 36px;
            padding: 8px 10px;

            background: #f8fafc;
            border: 1px solid #dce5ef;
            border-radius: 7px;

            color: #2A3B5D;
            font-family: inherit;
            font-size: 12px;
        }

        @media (max-width: 700px) {
            .filtros-dashboard {
                grid-template-columns: 1fr;
            }
        }

        .grafico-container {
            padding: 16px 18px;
            margin-bottom: 16px;

            background: #ffffff;
            border: 1px solid #dce5ef;
            border-radius: 10px;

            box-shadow: 0 3px 12px rgba(18, 59, 99, 0.04);
        }

        .grafico-container h2 {
            margin: 0 0 14px;

            color: #2A3B5D;
            font-size: 15px;
            font-weight: 800;
            line-height: 1.4;
        }

        .resumo-dia {
            padding: 16px 18px;
            margin-bottom: 16px;

            border: 1px solid #dce5ef;
            border-radius: 10px;

            box-shadow: 0 3px 12px rgba(18, 59, 99, 0.04);
        }

        .resumo-dia h2 {
            margin: 0 0 12px;
            color: #2A3B5D;
            font-size: 15px;
            font-weight: 800;
        }

        .indicadores-dia {
            gap: 10px;
            margin-top: 12px;
        }

        .indicador-dia {
            padding: 12px 14px;
            background: #f8fafc;
            border-radius: 8px;
        }

        .indicador-dia strong {
            font-size: 24px;
            font-weight: 800;
        }

        .indicador-dia span {
            font-size: 11px;
            line-height: 1.4;
        }

        .resumo-dia>p {
            margin: 12px 0 0;
            color: #64748b;
            font-size: 11px;
        }

        .linha-filtros-resumo {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 220px;
            align-items: start;
            gap: 12px;
            margin-bottom: 16px;
        }

        .linha-filtros-resumo #resumoDia {
            grid-column: 1;
            grid-row: 1;
            min-width: 0;
            margin-bottom: 0;
        }

        .linha-filtros-resumo .resumo-dia {
            margin-bottom: 0;
        }

        .linha-filtros-resumo .filtros-dashboard {
            grid-column: 2;
            grid-row: 1;
            grid-template-columns: 1fr;

            gap: 7px;
            padding: 10px;
            margin-bottom: 0;
        }

        .linha-filtros-resumo .filtro-item {
            gap: 3px;
        }

        .linha-filtros-resumo .filtro-item label {
            font-size: 9px;
        }

        .linha-filtros-resumo .filtro-item input,
        .linha-filtros-resumo .filtro-item select {
            min-height: 30px;
            padding: 5px 8px;
            font-size: 11px;
        }

        @media (max-width: 900px) {
            .linha-filtros-resumo {
                grid-template-columns: 1fr;
            }

            .linha-filtros-resumo .filtros-dashboard {
                grid-column: 1;
                grid-row: 2;
            }
        }

        /* Filtros e resumo mais compactos */
        .linha-filtros-resumo {
            grid-template-columns: minmax(0, 1fr) 180px;
            gap: 10px;
        }

        .linha-filtros-resumo .filtros-dashboard {
            padding: 8px;
            gap: 5px;
        }

        .linha-filtros-resumo .filtro-item {
            gap: 2px;
        }

        .linha-filtros-resumo .filtro-item input,
        .linha-filtros-resumo .filtro-item select {
            min-height: 26px;
            padding: 4px 6px;
            font-size: 10px;
        }

        .linha-filtros-resumo .resumo-dia {
            padding: 12px;
        }

        .linha-filtros-resumo .resumo-dia h2 {
            margin-bottom: 8px;
            font-size: 13px;
        }

        .linha-filtros-resumo .indicadores-dia {
            grid-template-columns: repeat(4, minmax(0, 1fr));
            max-width: 640px;
            gap: 7px;
            margin-top: 8px;
        }

        .linha-filtros-resumo .indicador-dia {
            min-width: 0;
            padding: 9px 10px;
            border-radius: 7px;
        }

        .linha-filtros-resumo .indicador-dia strong {
            margin-bottom: 4px;
            font-size: 21px;
        }

        .linha-filtros-resumo .indicador-dia span {
            font-size: 10px;
            line-height: 1.3;
        }

        .linha-filtros-resumo .resumo-dia>p {
            margin-top: 8px;
            font-size: 10px;
        }

        @media (max-width: 900px) {
            .linha-filtros-resumo {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 600px) {
            .linha-filtros-resumo .indicadores-dia {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        .cabecalho-resumo-periodo {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 6px 12px;
            margin-bottom: 8px;
        }

        .linha-filtros-resumo .cabecalho-resumo-periodo h2 {
            margin: 0;
        }

        .tempo-medio-resumo {
            color: #64748b;
            font-size: 10px;
        }

        .tempo-medio-resumo strong {
            margin-left: 4px;
            color: #2A3B5D;
            font-weight: 800;
        }

        @media (min-width: 901px) {

            .linha-filtros-resumo .resumo-dia,
            .linha-filtros-resumo .filtros-dashboard {
                box-sizing: border-box;
                height: 140px;
            }

            .linha-filtros-resumo .filtros-dashboard {
                gap: 4px;
                padding: 8px;
                align-content: center;
            }
        }

        .resumo-dia .indicador-saidas {
            --cor-indicador: #2A3B5D;
            --fundo-hover: #eef4fb;
        }

        .resumo-dia .indicador-clientes {
            --cor-indicador: #2f8f5b;
            --fundo-hover: #edf8f1;
        }

        .resumo-dia .indicador-entregas {
            --cor-indicador: #e59a23;
            --fundo-hover: #fff7e8;
        }

        .resumo-dia .indicador-tempo {
            --cor-indicador: #7b61a8;
            --fundo-hover: #f4effa;
        }

        .resumo-dia .indicador-dia {
            transition:
                background 0.18s ease,
                border-color 0.18s ease,
                box-shadow 0.18s ease,
                transform 0.18s ease;
        }

        .resumo-dia .indicador-dia:hover {
            background: var(--fundo-hover);
            border-color: var(--cor-indicador);
            box-shadow: 0 3px 10px rgba(18, 59, 99, 0.08);
            transform: translateY(-2px);
        }

        .resumo-dia .indicador-dia:hover strong {
            color: var(--cor-indicador);
        }

        .filtros-dashboard select {
            cursor: pointer;
            transition:
                border-color 0.18s ease,
                background 0.18s ease,
                box-shadow 0.18s ease;
        }

        .filtros-dashboard select:hover {
            background: #eef4fb;
            border-color: #93b4d6;
        }

        .filtros-dashboard select:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .filtros-dashboard select option {
            background: #f8fafc;
            color: #2A3B5D;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 12px;
        }

        .filtros-dashboard select option:checked {
            background: #dbeafe;
            color: #2A3B5D;
            font-weight: 700;
        }

        #graficoSaidas {
            display: block;
            height: auto;
            padding: 0;
            margin-top: 8px;
            background: transparent;
        }

        #graficoSaidas .grafico-barras {
            height: 220px;
            gap: 14px;
            padding: 24px 12px 12px;

            border: 1px solid #e2e8f0;
            border-radius: 8px;

            background:
                repeating-linear-gradient(to top,
                    transparent 0,
                    transparent 43px,
                    #e8eef5 43px,
                    #e8eef5 44px),
                #f8fafc;
        }

        #graficoSaidas .barra-valor {
            width: 28px;
            background: linear-gradient(to top, #2A3B5D, #3b82f6);
            border-radius: 5px 5px 2px 2px;
        }

        #graficoSaidas .barra-valor:hover {
            opacity: 0.85;
        }

        #graficoSaidas .barra-numero {
            color: #2A3B5D;
            font-size: 11px;
            font-weight: 800;
        }

        #graficoSaidas .barra-label {
            color: #64748b;
            font-size: 10px;
        }

        #graficoSaidas>p {
            margin: 0;
            padding: 24px 12px;
            border: 1px dashed #dce5ef;
            border-radius: 8px;

            background: #f8fafc;
            color: #64748b;
            font-size: 12px;
            text-align: center;
        }

        .titulo-comparativo-operadores {
            display: flex;
            align-items: center;
            gap: 7px;

            margin: 14px 0 8px;
            padding-bottom: 8px;
            border-bottom: 1px solid #dce5ef;

            color: #2A3B5D;
            font-size: 13px;
            font-weight: 800;
        }

        .titulo-comparativo-operadores svg {
            flex-shrink: 0;
        }

        #resumoDistribuidores {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            align-items: start;
            gap: 12px;
            margin-top: 16px;
        }

        #resumoDistribuidores>hr {
            display: none;
        }

        #resumoDistribuidores .cartao-distribuidor {
            min-width: 0;
            margin: 0;
            padding: 14px;

            background: #ffffff;
            border: 1px solid #dce5ef;
            border-left: 3px solid #2563eb;
            border-radius: 10px;

            box-shadow: 0 3px 12px rgba(18, 59, 99, 0.04);
        }

        #resumoDistribuidores .cartao-distribuidor h2 {
            margin: 0 0 8px;
            color: #2A3B5D;
            font-size: 14px;
            font-weight: 800;
        }

        #resumoDistribuidores .cartao-distribuidor>p {
            margin: 7px 0;
            color: #64748b;
            font-size: 10px;
        }

        #resumoDistribuidores .barra-meta {
            height: 5px;
            margin-top: 8px;
            background: #e8eef5;
        }

        #resumoDistribuidores .progresso-meta {
            background: #2563eb;
        }

        #resumoDistribuidores .indicadores-distribuidor {
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 6px;
            margin-top: 10px;
        }

    <script>

        fetch("menu.html")
            .then(function (resposta) {
                return resposta.text();
            })
            .then(function (htmlMenu) {
                document.getElementById("menu-container").innerHTML =
                    htmlMenu;

                document.querySelectorAll("#menu-container .menu a")
                    .forEach(function (link) {
                        link.classList.toggle(

                        );
                    });
            })
            .catch(function (erro) {
                console.error("Erro ao carregar menu:", erro);
            });

        /* =====================================================
           DISTRIBUIDORES
        ===================================================== */

        /* Operadores iniciais para o primeiro acesso */
        if (localStorage.getItem("distribuidores") === null) {
            const operadoresIniciais = [
                { nome: "Aníbal", codigo: "OP-001", tipo: "carro" },
                { nome: "João Palha", codigo: "OP-002", tipo: "carro" },
                { nome: "Victor Hugo", codigo: "OP-017", tipo: "carro" },
                { nome: "André", codigo: "OP-004", tipo: "carro" },
                { nome: "Lopes", codigo: "OP-018", tipo: "carro" },
                { nome: "Fernando", codigo: "OP-019", tipo: "carro" },
                { nome: "Ianyck", codigo: "OP-020", tipo: "moto" },
                { nome: "Dione", codigo: "OP-021", tipo: "moto" },
                { nome: "Charles", codigo: "OP-022", tipo: "moto" },
                { nome: "Francisco", codigo: "OP-023", tipo: "moto" },
                { nome: "Vitor", codigo: "OP-024", tipo: "moto" },
                { nome: "Mauro", codigo: "OP-025", tipo: "moto" },
                { nome: "Leonardo", codigo: "OP-026", tipo: "moto" },
                { nome: "Juan", codigo: "OP-027", tipo: "moto" },
                { nome: "Gustavo", codigo: "OP-028", tipo: "moto" }
            ];

            localStorage.setItem(
                "distribuidores",
                JSON.stringify(operadoresIniciais)
            );
        }

        const distribuidoresSalvos =
            JSON.parse(
                localStorage.getItem("distribuidores")
            ) || [];


        const distribuidores =
            distribuidoresSalvos.map(function (distribuidor) {

                return typeof distribuidor === "object"
                    ? distribuidor.nome
                    : distribuidor;

            });


        const distribuidorFiltro =
            document.getElementById("distribuidorFiltro");


        distribuidores.forEach(function (nome) {

            distribuidorFiltro.innerHTML += `

            <option value="${nome}">
                ${nome}
            </option>

        `;

        });


        /* =====================================================
           ELEMENTOS
        ===================================================== */

        const resumo =
            document.getElementById(
                "resumoDistribuidores"
            );


        const resumoDia =
            document.getElementById(
                "resumoDia"
            );


        const dataFiltro =
            document.getElementById(
                "dataFiltro"
            );


        /* =====================================================
           DATA INICIAL
        ===================================================== */

        const hoje =
            new Date();


        dataFiltro.value =
            hoje.toISOString().split("T")[0];


        /* =====================================================
           CONVERTER DATA DD/MM/AAAA
        ===================================================== */

        function converterData(dataTexto) {

            if (!dataTexto) {
                return null;
            }


            const partes =
                dataTexto.split("/");


            if (partes.length !== 3) {
                return null;
            }


            const dia =
                Number(partes[0]);


            const mes =
                Number(partes[1]) - 1;


            const ano =
                Number(partes[2]);


            return new Date(
                ano,
                mes,
                dia
            );

        }


        /* =====================================================
           VERIFICAR DATA / PERÍODO
        ===================================================== */

        function mesmaDataOuPeriodo(
            distribuicao,
            dataSelecionada,
            periodo
        ) {

            const dataDistribuicao =
                converterData(
                    distribuicao.data
                );


            if (!dataDistribuicao) {
                return false;
            }


            dataDistribuicao.setHours(
                0,
                0,
                0,
                0
            );


            const dataEscolhida =
                new Date(
                    dataSelecionada + "T00:00:00"
                );


            dataEscolhida.setHours(
                0,
                0,
                0,
                0
            );


            /* =================================================
               DIA
            ================================================= */

            if (periodo === "dia") {

                return (
                    dataDistribuicao.getFullYear() ===
                    dataEscolhida.getFullYear() &&

                    dataDistribuicao.getMonth() ===
                    dataEscolhida.getMonth() &&

                    dataDistribuicao.getDate() ===
                    dataEscolhida.getDate()
                );

            }


            /* =================================================
               MÊS
            ================================================= */

            if (periodo === "mes") {

                return (
                    dataDistribuicao.getFullYear() ===
                    dataEscolhida.getFullYear() &&

                    dataDistribuicao.getMonth() ===
                    dataEscolhida.getMonth()
                );

            }


            /* =================================================
               SEMANA
            ================================================= */

            const inicioSemana =
                new Date(
                    dataEscolhida
                );


            const diaSemana =
                inicioSemana.getDay();


            const diferenca =
                diaSemana === 0
                    ? 6
                    : diaSemana - 1;


            inicioSemana.setDate(
                inicioSemana.getDate() -
                diferenca
            );


            inicioSemana.setHours(
                0,
                0,
                0,
                0
            );


            const fimSemana =
                new Date(
                    inicioSemana
                );


            fimSemana.setDate(
                fimSemana.getDate() + 7
            );


            fimSemana.setHours(
                0,
                0,
                0,
                0
            );


            return (
                dataDistribuicao >=
                inicioSemana &&

                dataDistribuicao <
                fimSemana
            );

        }


        /* =====================================================
           CÓDIGO DO CLIENTE
        ===================================================== */

        function obterCodigoCliente(cliente) {

            if (
                cliente &&
                typeof cliente === "object"
            ) {

                return String(
                    cliente.codigo
                );

            }


            return String(
                cliente
            );

        }


        /* =====================================================
           FORMATAR TEMPO
        ===================================================== */

        function formatarTempo(segundos) {

            segundos =
                Number(segundos) || 0;


            const horas =
                Math.floor(
                    segundos / 3600
                );


            const minutos =
                Math.floor(
                    (segundos % 3600) / 60
                );


            const segundosRestantes =
                segundos % 60;


            if (horas > 0) {

                return (
                    horas +
                    "h " +
                    minutos +
                    "min"
                );

            }


            if (minutos > 0) {

                return (
                    minutos +
                    "min " +
                    segundosRestantes +
                    "s"
                );

            }


            return (
                segundosRestantes +
                "s"
            );

        }


        /* =====================================================
           MOSTRAR DESEMPENHO
        ===================================================== */

        function mostrarDesempenho() {

            resumoDia.innerHTML = "";

            resumo.innerHTML = "";


            /* =================================================
               CARREGAR DADOS SEMPRE ATUALIZADOS
            ================================================= */

            const distribuicoes =
                JSON.parse(
                    localStorage.getItem(
                        "distribuicoes"
                    )
                ) || [];


            const dataSelecionada =
                dataFiltro.value;


            const periodo =
                document.getElementById(
                    "periodoFiltro"
                ).value;


            const distribuidorSelecionado =
                document.getElementById(
                    "distribuidorFiltro"
                ).value;


            /* =================================================
               DISTRIBUIÇÕES CONCLUÍDAS DO PERÍODO
            ================================================= */

            const distribuicoesDoPeriodo =
                distribuicoes.filter(
                    function (distribuicao) {

                        return (
                            distribuicao.status ===
                            "Concluída" &&

                            (
                                distribuidorSelecionado === "" ||

                                distribuicao.distribuidor ===
                                distribuidorSelecionado
                            ) &&

                            mesmaDataOuPeriodo(
                                distribuicao,
                                dataSelecionada,
                                periodo
                            )
                        );

                    }
                );


            /* =================================================
               TOTAL DE SAÍDAS
            ================================================= */

            const totalDistribuicoes =
                distribuicoesDoPeriodo.length;

            const missoesPorRota = {};

            distribuicoesDoPeriodo.forEach(function (missao) {
                const rotasDaMissao = [
                    ...(Array.isArray(missao.rotas)
                        ? missao.rotas
                        : []),

                    ...(Array.isArray(missao.clientes)
                        ? missao.clientes
                            .filter(function (cliente) {
                                return cliente &&
                                    typeof cliente === "object" &&
                                    cliente.rota != null;
                            })
                            .map(function (cliente) {
                                return cliente.rota;
                            })
                        : [])
                ];

                const rotasUnicas = new Set(
                    rotasDaMissao
                        .map(function (rota) {
                            return String(rota).trim();
                        })
                        .filter(function (rota) {
                            return rota !== "";
                        })
                );

                rotasUnicas.forEach(function (codigoRota) {
                    missoesPorRota[codigoRota] =
                        (missoesPorRota[codigoRota] || 0) + 1;
                });
            });

            const comparativoRotas =
                document.getElementById("comparativoRotas");

            const nomesRotasAnalise = {
                1: "Adaúfe",
                2: "Braga Este",
                3: "Braga Estádio",
                4: "Braga 1",
                5: "Braga 2",
                6: "Vieira do Minho",
                7: "Póvoa de Lanhoso 1",
                8: "Póvoa de Lanhoso 2",
                9: "Amares",
                10: "Terras de Bouro",
                11: "Caldelas",
                12: "Vila Verde 1",
                13: "Vila Verde 2",
                14: "Vila Verde 3",
                15: "Vila Verde 4",
                16: "Ponte de Lima"
            };

            const coresRotasAnalise = {
                1: "#9f365c",
                2: "#c8102e",
                3: "#e53920",
                4: "#7c3aed",
                5: "#c1272d",
                6: "#a16207",
                7: "#b59b16",
                8: "#ffd600",
                9: "#EF7F1A",
                10: "#8b4513",
                11: "#2563eb",
                12: "#228b22",
                13: "#32a832",
                14: "#65c936",
                15: "#9bea45",
                16: "#27272a"
            };

            const rotasOrdenadas = Object.entries(missoesPorRota)
                .sort(function (a, b) {
                    return b[1] - a[1] || Number(a[0]) - Number(b[0]);
                });

            if (comparativoRotas) {
                if (rotasOrdenadas.length === 0) {
                    comparativoRotas.innerHTML = `
            <p style="margin:0;color:#64748b;font-size:11px;">
                Sem rotas registadas nas missões concluídas deste período.
            </p>
        `;
                } else {
                    comparativoRotas.innerHTML = rotasOrdenadas
                        .map(function ([codigo, quantidade]) {
                            const numeroRota = Number(codigo);

                            if (!Number.isInteger(numeroRota) ||
                                numeroRota < 1 || numeroRota > 16) {
                                return "";
                            }

                            return `
<div class="linha-comparativo-rota"
     style="border-right:4px solid ${coresRotasAnalise[numeroRota]};">                        <strong>
    <svg viewBox="0 0 24 24" aria-hidden="true"
         style="width:16px;height:16px;display:inline-block;vertical-align:middle;margin-right:5px;fill:none;stroke:${coresRotasAnalise[numeroRota]};stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;">
        <path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3V6Z"></path>
        <path d="M9 3v15M15 6v15"></path>
    </svg>
    Rota ${String(numeroRota).padStart(2, "0")} · ${nomesRotasAnalise[numeroRota]}
</strong>

                        <span>
                            ${quantidade}
                            ${quantidade === 1
                                    ? "missão concluída"
                                    : "missões concluídas"}
                        </span>
                    </div>
                `;
                        })
                        .join("");
                }
            }




            /* =================================================
               TOTAL DE ENTREGAS
            ================================================= */

            const totalEntregas =
                distribuicoesDoPeriodo.reduce(
                    function (
                        total,
                        distribuicao
                    ) {

                        return total +
                            (
                                Array.isArray(
                                    distribuicao.clientes
                                )
                                    ? distribuicao.clientes.length
                                    : 0
                            );

                    },
                    0
                );


            /* =================================================
               CLIENTES ÚNICOS
            ================================================= */

            const clientesUnicos =
                new Set();


            distribuicoesDoPeriodo.forEach(
                function (distribuicao) {

                    if (
                        !Array.isArray(
                            distribuicao.clientes
                        )
                    ) {

                        return;

                    }


                    distribuicao.clientes.forEach(
                        function (cliente) {

                            clientesUnicos.add(
                                obterCodigoCliente(
                                    cliente
                                )
                            );

                        }
                    );

                }
            );


            const totalClientes =
                clientesUnicos.size;


            /* =================================================
               TEMPO TOTAL
            ================================================= */

            const tempoTotalDia =
                distribuicoesDoPeriodo.reduce(
                    function (
                        total,
                        distribuicao
                    ) {

                        return total +
                            (
                                Number(
                                    distribuicao.duracao
                                ) || 0
                            );

                    },
                    0
                );


            /* =================================================
               TEMPO MÉDIO
            ================================================= */

            const tempoMedioDia =
                totalDistribuicoes > 0
                    ? Math.round(
                        tempoTotalDia /
                        totalDistribuicoes
                    )
                    : 0;


            /* =================================================
               CARROS
            ================================================= */

            const distribuicoesCarros =
                distribuicoesDoPeriodo.filter(
                    function (distribuicao) {

                        return (
                            distribuicao.veiculo &&
                            distribuicao.veiculo
                                .toLowerCase()
                                .startsWith("carro")
                        );

                    }
                );


            /* =================================================
               MOTOS
            ================================================= */

            const distribuicoesMotos =
                distribuicoesDoPeriodo.filter(
                    function (distribuicao) {

                        return (
                            distribuicao.veiculo &&
                            distribuicao.veiculo
                                .toLowerCase()
                                .startsWith("moto")
                        );

                    }
                );


            /* =================================================
               ENTREGAS CARROS
            ================================================= */

            const entregasCarros =
                distribuicoesCarros.reduce(
                    function (
                        total,
                        distribuicao
                    ) {

                        return total +
                            (
                                Array.isArray(
                                    distribuicao.clientes
                                )
                                    ? distribuicao.clientes.length
                                    : 0
                            );

                    },
                    0
                );


            /* =================================================
               ENTREGAS MOTOS
            ================================================= */

            const entregasMotos =
                distribuicoesMotos.reduce(
                    function (
                        total,
                        distribuicao
                    ) {

                        return total +
                            (
                                Array.isArray(
                                    distribuicao.clientes
                                )
                                    ? distribuicao.clientes.length
                                    : 0
                            );

                    },
                    0
                );


            /* =================================================
               RESUMO
            ================================================= */

            resumoDia.innerHTML = `

            <div class="resumo-dia">

                <div class="cabecalho-resumo-periodo">
    <h2>
    <svg viewBox="0 0 24 24" aria-hidden="true"
         style="width:18px;height:18px;display:inline-block;vertical-align:middle;margin-right:5px;fill:none;stroke:#2563eb;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;">
        <rect x="3" y="5" width="18" height="16" rx="2"></rect>
        <path d="M7 3v4M17 3v4M3 11h18"></path>
        <path d="M7 15h2M13 15h2M7 18h2M13 18h2"></path>
    </svg>
    Resumo do período
</h2>

    <span class="tempo-medio-resumo">
        Tempo médio por missão:
        <strong>${formatarTempo(tempoMedioDia)}</strong>
    </span>
</div>


                <div class="indicadores-dia">


                    <div class="indicador-dia indicador-saidas">

                        <strong>
                            ${totalDistribuicoes}
                        </strong>

                        <span>
                            Missões concluídas
                        </span>

                    </div>


                    <div class="indicador-dia indicador-clientes">

                        <strong>
                            ${totalClientes}
                        </strong>

                        <span>
    Pontos de entrega distintos
</span>

                    </div>


                    <div class="indicador-dia indicador-entregas">

                        <strong>
                            ${totalEntregas}
                        </strong>

                        <span>
                            Entregas
                        </span>

                    </div>


                    <div class="indicador-dia indicador-tempo">

                        <strong>
                            ${formatarTempo(
                tempoTotalDia
            )}
                        </strong>

                        <span>
                            Tempo total
                        </span>

                    </div>


                </div>


            </div>

        `;


            /* =================================================
               RANKING
            ================================================= */

            const ranking =
                distribuidores
                    .filter(function (nome) {

                        return (
                            distribuidorSelecionado === "" ||
                            nome === distribuidorSelecionado
                        );

                    })
                    .map(function (nome) {

                        const minhasDistribuicoes =
                            distribuicoesDoPeriodo.filter(
                                function (
                                    distribuicao
                                ) {

                                    return (
                                        distribuicao.distribuidor ===
                                        nome
                                    );

                                }
                            );


                        const entregas =
                            minhasDistribuicoes.reduce(
                                function (
                                    total,
                                    distribuicao
                                ) {

                                    return total +
                                        (
                                            Array.isArray(
                                                distribuicao.clientes
                                            )
                                                ? distribuicao.clientes.length
                                                : 0
                                        );

                                },
                                0
                            );


                        const clientesUnicos =
                            new Set();


                        minhasDistribuicoes.forEach(
                            function (
                                distribuicao
                            ) {

                                if (
                                    !Array.isArray(
                                        distribuicao.clientes
                                    )
                                ) {

                                    return;

                                }


                                distribuicao.clientes.forEach(
                                    function (
                                        cliente
                                    ) {

                                        clientesUnicos.add(
                                            obterCodigoCliente(
                                                cliente
                                            )
                                        );

                                    }
                                );

                            }
                        );


                        return {

                            nome: nome,

                            quantidade:
                                minhasDistribuicoes.length,

                            clientes:
                                clientesUnicos.size,

                            entregas:
                                entregas

                        };

                    });


            /* =================================================
               ORDENAR RANKING
            ================================================= */

            ranking.sort(
                function (a, b) {

                    if (
                        b.quantidade !==
                        a.quantidade
                    ) {

                        return (
                            b.quantidade -
                            a.quantidade
                        );

                    }


                    return (
                        b.entregas -
                        a.entregas
                    );

                }
            );


            resumoDia.innerHTML += `

            <div class="card-comparativo-operadores">

            <h2 class="titulo-comparativo-operadores">
    <svg viewBox="0 0 24 24" aria-hidden="true"
         style="width:18px;height:18px;fill:none;stroke:#2563eb;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;">
        <path d="M3 3v18h18"></path>
        <path d="M7 17v-5M12 17V8M17 17V5"></path>
    </svg>
    Comparativo por operador
</h2>

        `;


            let posicao =
                0;


            ranking.forEach(
                function (
                    item
                ) {

                    if (
                        item.quantidade === 0
                    ) {

                        return;

                    }


                    posicao++;


                    resumoDia.innerHTML += `

                    <p class="linha-ranking">

                        <strong>

                            <span class="posicao-ranking">
                                ${posicao}º
                            </span>

                            ${item.nome}

                        </strong>

                        —

                        ${item.quantidade}

                        ${item.quantidade === 1
                            ? "missão"
                            : "missões"
                        }

                        ·

                        ${item.clientes}

                        ${item.clientes === 1
                            ? "ponto"
                            : "pontos"
                        }

                        ·

                        ${item.entregas}

                        ${item.entregas === 1
                            ? "entrega"
                            : "entregas"
                        }

                    </p>

                `;

                }
            );

            const cardComparativo =
                resumoDia.querySelector(".card-comparativo-operadores");

            if (cardComparativo) {
                resumoDia.querySelectorAll(".linha-ranking")
                    .forEach(function (linha) {
                        cardComparativo.appendChild(linha);
                    });

                if (!cardComparativo.querySelector(".linha-ranking")) {
                    const mensagem = document.createElement("p");

                    mensagem.textContent =
                        "Sem missões concluídas para comparar neste período.";

                    mensagem.style.cssText =
                        "margin:0;padding:12px 0;color:#64748b;font-size:11px;";

                    cardComparativo.appendChild(mensagem);
                }
            }

            /* =================================================
               CARTÕES DOS DISTRIBUIDORES
            ================================================= */

            distribuidores.forEach(
                function (nome) {

                    if (
                        distribuidorSelecionado !== "" &&
                        nome !==
                        distribuidorSelecionado
                    ) {

                        return;

                    }


                    const minhasDistribuicoes =
                        distribuicoesDoPeriodo.filter(
                            function (
                                distribuicao
                            ) {

                                return (
                                    distribuicao.distribuidor ===
                                    nome
                                );

                            }
                        );


                    const quantidade =
                        minhasDistribuicoes.length;


                    const tempoTotal =
                        minhasDistribuicoes.reduce(
                            function (
                                total,
                                distribuicao
                            ) {

                                return total +
                                    (
                                        Number(
                                            distribuicao.duracao
                                        ) || 0
                                    );

                            },
                            0
                        );


                    const tempoMedio =
                        quantidade > 0
                            ? Math.round(
                                tempoTotal /
                                quantidade
                            )
                            : 0;


                    const entregas =
                        minhasDistribuicoes.reduce(
                            function (
                                total,
                                distribuicao
                            ) {

                                return total +
                                    (
                                        Array.isArray(
                                            distribuicao.clientes
                                        )
                                            ? distribuicao.clientes.length
                                            : 0
                                    );

                            },
                            0
                        );


                    /* =============================================
                       CLIENTES ÚNICOS DO DISTRIBUIDOR
                    ============================================= */

                    const clientesUnicos =
                        new Set();


                    minhasDistribuicoes.forEach(
                        function (
                            distribuicao
                        ) {

                            if (
                                !Array.isArray(
                                    distribuicao.clientes
                                )
                            ) {

                                return;

                            }


                            distribuicao.clientes.forEach(
                                function (
                                    cliente
                                ) {

                                    clientesUnicos.add(
                                        obterCodigoCliente(
                                            cliente
                                        )
                                    );

                                }
                            );

                        }
                    );


                    const clientes =
                        clientesUnicos.size;


                    /* =============================================
                       PERCENTAGEM DA META
                    ============================================= */

                    const percentagem =
                        totalDistribuicoes > 0
                            ? (quantidade / totalDistribuicoes) * 100
                            : 0;

                    resumo.innerHTML += `

                    <div class="cartao-distribuidor">

                        <h2>
    <svg viewBox="0 0 24 24" aria-hidden="true"
         style="width:18px;height:18px;display:inline-block;vertical-align:middle;margin-right:5px;fill:none;stroke:#2563eb;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;">
        <circle cx="12" cy="7" r="4"></circle>
        <path d="M4 21v-2a8 8 0 0 1 16 0v2"></path>
    </svg>
    ${nome}
</h2>


                       <p>
    <strong>${quantidade}</strong>
    ${quantidade === 1 ? "missão concluída" : "missões concluídas"}
</p>


                        <div class="barra-meta">

                            <div
                                class="progresso-meta"
                                style="
                                    width: ${percentagem}%;
                                "
                            ></div>

                        </div>


                        <p>
    <strong>${Math.round(percentagem)}%</strong>
    das missões do período filtrado
</p>


                        <div class="indicadores-distribuidor">


                            <div class="indicador">

                                <strong>
                                    ${clientes}
                                </strong>

                                <span>
    Pontos distintos
</span>

                            </div>


                            <div class="indicador">

                                <strong>
                                    ${entregas}
                                </strong>

                                <span>
                                    Entregas
                                </span>

                            </div>


                            <div class="indicador">

                                <strong>
                                    ${formatarTempo(
                        tempoTotal
                    )}
                                </strong>

                                <span>
                                    Tempo total
                                </span>

                            </div>


                            <div class="indicador">

                                <strong>
                                    ${formatarTempo(
                        tempoMedio
                    )}
                                </strong>

                                <span>
                                    Tempo médio
                                </span>

                            </div>


                        </div>


                    </div>


                    <hr>

                `;

                }
            );


            /* =================================================
               GRÁFICO DE SAÍDAS
            ================================================= */

            const graficoSaidas =
                document.getElementById(
                    "graficoSaidas"
                );


            graficoSaidas.innerHTML = "";


            const diasGrafico = {};


            distribuicoesDoPeriodo.forEach(
                function (
                    distribuicao
                ) {

                    const partes =
                        distribuicao.data.split("/");


                    const chave =
                        partes[0] +
                        "/" +
                        partes[1];


                    if (
                        !diasGrafico[chave]
                    ) {

                        diasGrafico[chave] = 0;

                    }


                    diasGrafico[chave]++;

                }
            );


            const diasOrdenados =
                Object.keys(
                    diasGrafico
                ).sort(
                    function (
                        a,
                        b
                    ) {

                        const partesA =
                            a.split("/");


                        const partesB =
                            b.split("/");


                        const ano =
                            dataSelecionada
                                .split("-")[0];


                        const dataA =
                            new Date(
                                Number(ano),
                                Number(partesA[1]) - 1,
                                Number(partesA[0])
                            );


                        const dataB =
                            new Date(
                                Number(ano),
                                Number(partesB[1]) - 1,
                                Number(partesB[0])
                            );


                        return (
                            dataA -
                            dataB
                        );

                    }
                );


            if (
                diasOrdenados.length === 0
            ) {

                graficoSaidas.innerHTML = `

                <p>
    <strong style="display:block;margin-bottom:5px;color:#2A3B5D;">
        Nenhuma missão concluída neste período
    </strong>
    Selecione outra data, período ou operador para consultar a evolução.
</p>

            `;

                return;

            }


            const maiorValor =
                Math.max(
                    ...diasOrdenados.map(
                        function (
                            dia
                        ) {

                            return diasGrafico[dia];

                        }
                    ),
                    1
                );


            graficoSaidas.innerHTML =
                `<div class="grafico-barras"></div>`;


            const grafico =
                graficoSaidas.querySelector(
                    ".grafico-barras"
                );


            diasOrdenados.forEach(
                function (
                    dia
                ) {

                    const quantidade =
                        diasGrafico[dia];


                    const altura =
                        (
                            quantidade /
                            maiorValor
                        ) * 180;


                    grafico.innerHTML += `

                    <div class="barra-dia">

                        <div class="barra-numero">
                            ${quantidade}
                        </div>


                        <div
                            class="barra-valor"
                            style="
                                height: ${altura}px;
                            "
                        ></div>


                        <div class="barra-label">
                            ${dia}
                        </div>

                    </div>

                `;

                }
            );

        }


        /* =====================================================
           FILTROS
        ===================================================== */

        dataFiltro.addEventListener(
            "change",
            mostrarDesempenho
        );


        document
            .getElementById(
                "periodoFiltro"
            )
            .addEventListener(
                "change",
                mostrarDesempenho
            );


        distribuidorFiltro.addEventListener(
            "change",
            mostrarDesempenho
        );


        /* =====================================================
           INICIAR
        ===================================================== */

        mostrarDesempenho();

    </script>

</body>

</html>
