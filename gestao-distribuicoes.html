<!DOCTYPE html>
<html lang="pt">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gestão de Distribuições</title>


    <style>
        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #f3f6fa;

            color: #1f2937;

        }

        /* ================================
   TOPO INSTITUCIONAL
================================= */

        .topo-gestao {
            position: fixed;

            top: 0;
            left: 0;
            right: 0;

            height: 58px;

            display: flex;
            align-items: center;

            padding: 0 25px;

            background: #123b63;

            box-shadow:
                0 2px 8px rgba(15, 23, 42, 0.12);

            z-index: 200;
        }

        .identidade-topo-gestao {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .imagem-logo-gestao {
            height: 38px;
            width: auto;
            display: block;
            object-fit: contain;
        }

        .titulo-topo-gestao {
            padding-left: 16px;

            border-left:
                1px solid rgba(255, 255, 255, 0.35);
        }

        .titulo-topo-gestao span {
            display: block;

            margin-bottom: 1px;

            color:
                rgba(255, 255, 255, 0.70);

            font-size: 9px;
            font-weight: 800;

            letter-spacing: 0.7px;

            text-transform: uppercase;
        }

        .titulo-topo-gestao h1 {
            margin: 0;

            color: #ffffff;

            font-size: 17px;
            font-weight: 800;
        }

        .titulo-topo-gestao p {
            margin: 1px 0 0;

            color:
                rgba(255, 255, 255, 0.72);

            font-size: 10px;
            font-weight: 500;
        }

        /* ================================
   MENU LATERAL
================================= */

        .menu {
            position: fixed;

            top: 58px;
            left: 0;
            bottom: 0;

            width: 185px;

            padding: 14px 10px;

            background: #ffffff;

            border-right:
                1px solid #dbe4ee;

            z-index: 100;
        }

        .menu a {
            display: block;

            margin-bottom: 5px;
            padding: 10px 11px;

            border-radius: 7px;

            color: #475569;

            font-size: 12px;
            font-weight: 700;

            text-decoration: none;

            transition:
                background 0.18s ease,
                color 0.18s ease;
        }

        .menu a:hover {
            background: #eff6ff;
            color: #2563eb;
        }

        .menu a.ativo {
            background: #123b63;
            color: #ffffff;
        }


        /* ================================
   MENU MOBILE
================================= */

        .menu-mobile {
            display: none;
        }

        .botao-menu {
            border: none;

            background: #123b63;
            color: #ffffff;

            font-size: 20px;

            cursor: pointer;
        }

        #conteudo {
            max-width: 1200px;

            margin-left: 185px;
            margin-right: auto;

            padding: 82px 25px 60px;
        }


        /* ================================
           TÍTULO PRINCIPAL
        ================================= */

        h1 {

            margin: 0 0 35px;

            font-size: 32px;

            font-weight: 700;

            color: #172033;

        }


        /* ================================
           TÍTULOS DAS SECÇÕES
        ================================= */

        h2 {

            margin: 35px 0 18px;

            font-size: 22px;

            color: #172033;

        }


        /* ================================
           LISTA DE ITENS
        ================================= */

        /* ================================
   GRELHA DE DISTRIBUIDORES E VEÍCULOS
================================ */

        #listaDistribuidoresCarro,
        #listaDistribuidoresMoto,
        #listaVeiculos {

            display: grid !important;

            grid-template-columns:
                repeat(3, minmax(0, 1fr)) !important;

            gap: 10px;

            width: 100%;

        }


        /* ================================
           CARTÃO
        ================================= */

        .item-gestao {

            background: white;

            border: 1px solid #e1e7ef;

            border-radius: 10px;

            padding: 10px 12px;

            display: flex;

            align-items: center;

            gap: 8px;

            min-height: 52px;

            box-shadow:
                0 2px 5px rgba(0, 0, 0, 0.04);

            transition:
                transform 0.15s ease,
                box-shadow 0.15s ease;

        }


        .item-gestao:hover {

            transform: translateY(-2px);

            box-shadow:
                0 5px 14px rgba(0, 0, 0, 0.09);

        }


        /* ================================
           NOME
        ================================= */

        .item-gestao span {

            flex: 1;

            font-size: 14px;

            font-weight: 600;

            color: #263247;

            line-height: 1.3;

        }


        /* ================================
           BOTÕES
        ================================= */

        .item-gestao button {

            border: none;

            border-radius: 6px;

            padding: px 8px;

            font-size: 12px;

            font-weight: 600;

            cursor: pointer;

            transition:
                background 0.15s ease,
                transform 0.1s ease;

        }


        .item-gestao button:active {

            transform: scale(0.96);

        }


        /* EDITAR */

        .item-gestao button:first-of-type {

            background: #e8f0ff;

            color: #2563eb;

        }


        .item-gestao button:first-of-type:hover {

            background: #dbe7ff;

        }


        /* EXCLUIR */

        .item-gestao button:last-of-type {

            background: #feecec;

            color: #dc2626;

        }


        .item-gestao button:last-of-type:hover {

            background: #fde0e0;

        }


        /* ================================
           FORMULÁRIO
        ================================= */

        .formulario-gestao {

            margin-top: 15px;

            background: white;

            border: 1px solid #e1e7ef;

            border-radius: 12px;

            padding: 12px;

            display: flex;

            align-items: center;

            gap: 10px;

            width: fit-content;

        }


        .formulario-gestao input {

            width: 260px;

            padding: 10px 12px;

            border: 1px solid #cfd7e3;

            border-radius: 8px;

            font-size: 14px;

            outline: none;

        }


        .formulario-gestao input:focus {

            border-color: #2563eb;

            box-shadow:
                0 0 0 3px rgba(37, 99, 235, 0.10);

        }


        .formulario-gestao button {

            border: none;

            border-radius: 8px;

            padding: 10px 14px;

            background: #2563eb;

            color: white;

            font-size: 13px;

            font-weight: 600;

            cursor: pointer;

            white-space: nowrap;

        }


        .formulario-gestao button:hover {

            background: #1d4ed8;

        }


        /* ================================
           SEPARAÇÃO ENTRE SECÇÕES
        ================================= */

        #listaVeiculos {

            margin-bottom: 5px;

        }

        /* ================================
   CABEÇALHO DA GESTÃO
================================= */

        .cabecalho-gestao {
            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 20px;

            margin-bottom: 18px;
            padding: 18px 20px;

            background: #ffffff;

            border: 1px solid #dbe4ee;
            border-radius: 14px;

            box-shadow:
                0 3px 12px rgba(15, 23, 42, 0.06);
        }

        .rotulo-gestao {
            display: block;

            margin-bottom: 4px;

            color: #64748b;

            font-size: 10px;
            font-weight: 800;

            letter-spacing: 0.8px;
        }

        .cabecalho-gestao h1 {
            margin: 0;

            color: #123b63;

            font-size: 24px;
            font-weight: 800;
        }

        .cabecalho-gestao p {
            margin: 4px 0 0;

            color: #64748b;

            font-size: 12px;
        }

        .botao-voltar-gestao {
            height: 34px;

            padding: 0 14px;

            border: none;
            border-radius: 7px;

            background: #123b63;
            color: #ffffff;

            font-size: 11px;
            font-weight: 800;

            cursor: pointer;
        }

        .botao-voltar-gestao:hover {
            background: #09243d;
        }


        /* ================================
   ABAS DA GESTÃO
================================= */

        .abas-gestao {
            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 10px;

            margin-bottom: 14px;

            padding: 8px;

            background: #ffffff;

            border: 1px solid #dbe4ee;
            border-radius: 12px;

            box-shadow:
                0 2px 8px rgba(15, 23, 42, 0.05);
        }

        .aba-gestao {
            min-height: 42px;

            border: 1px solid #dbe4ee;
            border-radius: 8px;

            background: #f8fafc;
            color: #475569;

            font-size: 12px;
            font-weight: 800;

            cursor: pointer;
        }

        .aba-gestao:hover {
            background: #eff6ff;
            color: #2563eb;
        }

        .aba-gestao.ativa {
            background: #2563eb;
            color: #ffffff;

            border-color: #2563eb;
        }


        /* ================================
   SECÇÕES DA GESTÃO
================================= */

        .secao-gestao {
            padding: 16px 18px;

            background: #ffffff;

            border: 1px solid #dbe4ee;
            border-radius: 12px;

            box-shadow:
                0 2px 8px rgba(15, 23, 42, 0.05);
        }

        .cabecalho-secao-gestao {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-bottom: 12px;
        }

        .cabecalho-secao-gestao span {
            display: block;

            margin-bottom: 2px;

            color: #94a3b8;

            font-size: 9px;
            font-weight: 800;

            letter-spacing: 0.7px;
        }

        .cabecalho-secao-gestao h2 {
            margin: 0;

            color: #123b63;

            font-size: 18px;
            font-weight: 800;
        }

        .dados-aeronave-gestao {
            flex: 1;

            display: flex;
            flex-direction: column;

            gap: 3px;

            min-width: 0;
        }

        .dados-aeronave-gestao span {
            font-size: 14px;
            font-weight: 700;

            color: #263247;
        }

        .estado-aeronave-gestao {
            width: fit-content;

            padding: 2px 7px;

            border-radius: 999px;

            font-size: 9px;
            font-weight: 800;
        }

        .estado-aeronave-disponivel {
            background: #dcfce7;
            color: #15803d;
        }

        .estado-aeronave-missao {
            background: #fee2e2;
            color: #b91c1c;
        }

        .estado-aeronave-retornando {
            background: #ffedd5;
            color: #c2410c;
        }


        /* ================================
           TABLET
        ================================= */

        @media (max-width: 900px) {

            #listaDistribuidoresCarro,
            #listaDistribuidoresMoto,
            #listaVeiculos {

                grid-template-columns:
                    repeat(2, minmax(0, 1fr));

            }

        }


        /* ================================
   TELEMÓVEL
================================= */

        @media (max-width: 600px) {

            #conteudo {

                padding: 25px 15px 40px;

            }


            h1 {

                font-size: 27px;

                margin-bottom: 25px;

            }


            h2 {

                font-size: 20px;

            }


            /* ================================
       1 CARTÃO POR LINHA
    ================================= */

            #listaDistribuidoresCarro,
            #listaDistribuidoresMoto,
            #listaVeiculos {

                display: grid !important;

                grid-template-columns: 1fr !important;

                width: 100% !important;

                gap: 10px;

            }


            /* ================================
       CARTÃO
    ================================= */

            .item-gestao {

                width: 100%;

                padding: 14px;

            }


            /* ================================
       FORMULÁRIO
    ================================= */

            .formulario-gestao {

                width: 100%;

                flex-direction: row;

                align-items: center;

                gap: 8px;

            }


            .formulario-gestao input {

                width: auto;

                flex: 1;

                min-width: 0;

            }


            .formulario-gestao button {

                width: auto;

                flex-shrink: 0;

                padding: 10px 12px;

            }

        }
    </style>

</head>

    <script>

        /* ================================
           DISTRIBUIDORES INICIAIS
        ================================= */

        const distribuidoresCarroIniciais = [
            "Aníbal",
            "João Palha",
            "Victor Hugo",
            "André",
            "Lopes",
            "Fernando"
        ];


        const distribuidoresMotoIniciais = [
            "Ianyck",
            "Dione",
            "Charles",
            "Francisco",
            "Vitor",
            "Mauro",
            "Leonardo",
            "Juan",
            "Gustavo"
        ];


        /* ================================
           VEÍCULOS INICIAIS
        ================================= */

        const veiculosIniciais = [
            "DRN-001",
            "DRN-002",
            "DRN-003",
            "DRN-004",
            "DRN-005",
            "DRN-006",
            "DRN-007",
            "DRN-008",
            "DRN-009",
            "DRN-010"
        ];


        /* ================================
           MIGRAÇÃO DOS DISTRIBUIDORES
        ================================= */

        function prepararDistribuidores() {

            const existentes =
                JSON.parse(
                    localStorage.getItem("distribuidores")
                );


            /*
             * Se já estiverem no novo formato,
             * não fazemos nada.
             */

            if (
                Array.isArray(existentes) &&
                existentes.length > 0 &&
                typeof existentes[0] === "object"
            ) {

                return;

            }


            /*
             * Se existirem os distribuidores antigos
             * como strings, fazemos a conversão.
             */

            const distribuidores = [];


            if (Array.isArray(existentes)) {

                existentes.forEach(function (nome) {

                    if (
                        distribuidoresCarroIniciais
                            .includes(nome)
                    ) {

                        distribuidores.push({
                            nome: nome,
                            tipo: "carro"
                        });

                    }
                    else if (
                        distribuidoresMotoIniciais
                            .includes(nome)
                    ) {

                        distribuidores.push({
                            nome: nome,
                            tipo: "moto"
                        });

                    }

                });

            }
            else {

                distribuidoresCarroIniciais
                    .forEach(function (nome) {

                        distribuidores.push({
                            nome: nome,
                            tipo: "carro"
                        });

                    });


                distribuidoresMotoIniciais
                    .forEach(function (nome) {

                        distribuidores.push({
                            nome: nome,
                            tipo: "moto"
                        });

                    });

            }


            localStorage.setItem(
                "distribuidores",
                JSON.stringify(distribuidores)
            );

        }


        prepararDistribuidores();


        /* ================================
           VEÍCULOS
        ================================= */

        if (!localStorage.getItem("veiculos")) {

            localStorage.setItem(
                "veiculos",
                JSON.stringify(veiculosIniciais)
            );

        }

        /* ================================
   MIGRAÇÃO DA FROTA PARA DRONES
================================= */

        const veiculosAtuais =
            JSON.parse(
                localStorage.getItem(
                    "veiculos"
                )
            ) || [];


        const possuiFrotaAntiga =
            veiculosAtuais.some(
                function (veiculo) {

                    return (
                        veiculo.startsWith("Carro ") ||
                        veiculo.startsWith("Moto ")
                    );

                }
            );


        if (possuiFrotaAntiga) {

            localStorage.setItem(
                "veiculos",
                JSON.stringify(
                    veiculosIniciais
                )
            );

        }

        const frotaAtual =
            JSON.parse(
                localStorage.getItem(
                    "veiculos"
                )
            ) || [];


        veiculosIniciais.forEach(
            function (drone) {

                if (
                    !frotaAtual.includes(
                        drone
                    )
                ) {

                    frotaAtual.push(
                        drone
                    );

                }

            }
        );


        localStorage.setItem(
            "veiculos",
            JSON.stringify(
                frotaAtual
            )
        );


        /* ================================
           MOSTRAR DISTRIBUIDORES
        ================================= */

        function mostrarDistribuidores() {

            const lista =
                JSON.parse(
                    localStorage.getItem(
                        "distribuidores"
                    )
                ) || [];


            const carros =
                lista.filter(function (distribuidor) {

                    return distribuidor.tipo === "carro";

                });


            const motos =
                lista.filter(function (distribuidor) {

                    return distribuidor.tipo === "moto";

                });


            const areaCarro =
                document.getElementById(
                    "listaDistribuidoresCarro"
                );


            const areaMoto =
                document.getElementById(
                    "listaDistribuidoresMoto"
                );


            areaCarro.innerHTML = "";


            areaMoto.innerHTML = "";


            carros.forEach(
                function (distribuidor, indice) {

                    areaCarro.innerHTML += `

                    <div class="item-gestao">

                        <span>

                            ${String(
                        indice + 1
                    ).padStart(2, "0")}

                            ·

                            ${distribuidor.nome}

                        </span>


                        <button
                            onclick="editarDistribuidor(${lista.indexOf(distribuidor)})"
                        >
                            Editar
                        </button>


                        <button
                            onclick="excluirDistribuidor(${lista.indexOf(distribuidor)})"
                        >
                            Excluir
                        </button>

                    </div>

                `;

                }
            );


            motos.forEach(
                function (distribuidor, indice) {

                    areaMoto.innerHTML += `

                    <div class="item-gestao">

                        <span>

                            ${String(
                        indice + 1
                    ).padStart(2, "0")}

                            ·

                            ${distribuidor.nome}

                        </span>


                        <button
                            onclick="editarDistribuidor(${lista.indexOf(distribuidor)})"
                        >
                            Editar
                        </button>


                        <button
                            onclick="excluirDistribuidor(${lista.indexOf(distribuidor)})"
                        >
                            Excluir
                        </button>

                    </div>

                `;

                }
            );

        }


        /* ================================
           ADICIONAR DISTRIBUIDOR
        ================================= */

        function adicionarDistribuidor(tipo) {

            const idCampo =
                tipo === "carro"
                    ? "novoDistribuidorCarro"
                    : "novoDistribuidorMoto";


            const campo =
                document.getElementById(idCampo);


            const nome =
                campo.value.trim();


            if (!nome) {

                alert(
                    "Digite o nome do distribuidor."
                );

                return;

            }


            const lista =
                JSON.parse(
                    localStorage.getItem(
                        "distribuidores"
                    )
                ) || [];


            const existe =
                lista.some(
                    function (distribuidor) {

                        return (
                            distribuidor.nome
                                .toLowerCase() ===
                            nome.toLowerCase()
                        );

                    }
                );


            if (existe) {

                alert(
                    "Esse distribuidor já existe."
                );

                return;

            }


            lista.push({

                nome: nome,

                tipo: tipo

            });


            localStorage.setItem(
                "distribuidores",
                JSON.stringify(lista)
            );


            campo.value = "";


            mostrarDistribuidores();

        }


        /* ================================
           EDITAR DISTRIBUIDOR
        ================================= */

        function editarDistribuidor(indice) {

            const lista =
                JSON.parse(
                    localStorage.getItem(
                        "distribuidores"
                    )
                ) || [];


            const distribuidor =
                lista[indice];


            if (!distribuidor) {

                return;

            }


            const novoNome =
                prompt(
                    "Novo nome do distribuidor:",
                    distribuidor.nome
                );


            if (novoNome === null) {

                return;

            }


            const nome =
                novoNome.trim();


            if (!nome) {

                alert(
                    "O nome não pode ficar vazio."
                );

                return;

            }


            const existe =
                lista.some(
                    function (item, i) {

                        return (
                            i !== indice &&
                            item.nome.toLowerCase() ===
                            nome.toLowerCase()
                        );

                    }
                );


            if (existe) {

                alert(
                    "Esse distribuidor já existe."
                );

                return;

            }


            lista[indice].nome = nome;


            localStorage.setItem(
                "distribuidores",
                JSON.stringify(lista)
            );


            mostrarDistribuidores();

        }


        /* ================================
           EXCLUIR DISTRIBUIDOR
        ================================= */

        function excluirDistribuidor(indice) {

            const lista =
                JSON.parse(
                    localStorage.getItem(
                        "distribuidores"
                    )
                ) || [];


            const distribuidor =
                lista[indice];


            if (!distribuidor) {

                return;

            }


            const confirmar =
                confirm(
                    'Tem a certeza que pretende excluir "' +
                    distribuidor.nome +
                    '"?'
                );


            if (!confirmar) {

                return;

            }


            lista.splice(
                indice,
                1
            );


            localStorage.setItem(
                "distribuidores",
                JSON.stringify(lista)
            );


            mostrarDistribuidores();

        }

        /* ================================
   ABAS DA GESTÃO
================================= */

        const abaAeronaves =
            document.getElementById(
                "abaAeronaves"
            );

        const abaOperadores =
            document.getElementById(
                "abaOperadores"
            );

        const secaoAeronaves =
            document.getElementById(
                "secaoAeronaves"
            );

        const secaoOperadores =
            document.getElementById(
                "secaoOperadores"
            );


        abaAeronaves.addEventListener(
            "click",
            function () {

                abaAeronaves
                    .classList
                    .add("ativa");

                abaOperadores
                    .classList
                    .remove("ativa");


                secaoAeronaves.style.display =
                    "block";

                secaoOperadores.style.display =
                    "none";

            }
        );


        abaOperadores.addEventListener(
            "click",
            function () {

                abaOperadores
                    .classList
                    .add("ativa");

                abaAeronaves
                    .classList
                    .remove("ativa");


                secaoOperadores.style.display =
                    "block";

                secaoAeronaves.style.display =
                    "none";

            }
        );


        /* ================================
           MOSTRAR VEÍCULOS
        ================================= */

        function mostrarVeiculos() {

            const lista =
                JSON.parse(
                    localStorage.getItem(
                        "veiculos"
                    )
                ) || [];

            const distribuicoes =
                JSON.parse(
                    localStorage.getItem(
                        "distribuicoes"
                    )
                ) || [];


            const area =
                document.getElementById(
                    "listaVeiculos"
                );


            area.innerHTML = "";


            lista.forEach(
                function (
                    veiculo,
                    indice
                ) {

                    const missaoAtiva =
                        distribuicoes.find(
                            function (distribuicao) {

                                return (
                                    distribuicao.veiculo === veiculo &&
                                    distribuicao.status === "Em andamento"
                                );

                            }
                        );


                    let estadoAeronave =
                        "Disponível";


                    let classeEstado =
                        "estado-aeronave-disponivel";


                    if (missaoAtiva) {

                        if (
                            missaoAtiva.retornoBase ===
                            "Em andamento"
                        ) {

                            estadoAeronave =
                                "Retornando";

                            classeEstado =
                                "estado-aeronave-retornando";

                        } else {

                            estadoAeronave =
                                "Em missão";

                            classeEstado =
                                "estado-aeronave-missao";

                        }

                    }

                    area.innerHTML += `

                    <div class="item-gestao">

                        <div class="dados-aeronave-gestao">

    <span>

        ${String(
                        indice + 1
                    ).padStart(2, "0")}

        ·

        ${veiculo}

    </span>

    <small
        class="
            estado-aeronave-gestao
            ${classeEstado}
        "
    >
        ${estadoAeronave}
    </small>

</div>


                        <button
                            onclick="editarVeiculo(${indice})"
                        >
                            Editar
                        </button>


                        <button
                            onclick="excluirVeiculo(${indice})"
                        >
                            Excluir
                        </button>

                    </div>

                `;

                }
            );

        }


        /* ================================
           ADICIONAR VEÍCULO
        ================================= */

        function adicionarVeiculo() {

            const campo =
                document.getElementById(
                    "novoVeiculo"
                );


            const nome =
                campo.value.trim();


            if (!nome) {

                alert(
                    "Digite a identificação da aeronave."
                );

                return;

            }


            const lista =
                JSON.parse(
                    localStorage.getItem(
                        "veiculos"
                    )
                ) || [];


            const existe =
                lista.some(
                    function (veiculo) {

                        return (
                            veiculo.toLowerCase() ===
                            nome.toLowerCase()
                        );

                    }
                );


            if (existe) {

                alert(
                    "Essa aeronave já existe."
                );

                return;

            }


            lista.push(nome);


            localStorage.setItem(
                "veiculos",
                JSON.stringify(lista)
            );


            campo.value = "";


            mostrarVeiculos();

        }


        /* ================================
           EDITAR VEÍCULO
        ================================= */

        function editarVeiculo(indice) {

            const lista =
                JSON.parse(
                    localStorage.getItem(
                        "veiculos"
                    )
                ) || [];


            const nomeAtual =
                lista[indice];


            const novoNome =
                prompt(
                    "Nova identificação da aeronave:",
                    nomeAtual
                );


            if (novoNome === null) {

                return;

            }


            const nome =
                novoNome.trim();


            if (!nome) {

                alert(
                    "O nome não pode ficar vazio."
                );

                return;

            }


            const existe =
                lista.some(
                    function (
                        veiculo,
                        i
                    ) {

                        return (
                            i !== indice &&
                            veiculo.toLowerCase() ===
                            nome.toLowerCase()
                        );

                    }
                );


            if (existe) {

                alert(
                    "Essa aeronave já existe."
                );

                return;

            }


            lista[indice] = nome;


            localStorage.setItem(
                "veiculos",
                JSON.stringify(lista)
            );


            mostrarVeiculos();

        }


        /* ================================
           EXCLUIR VEÍCULO
        ================================= */

        function excluirVeiculo(indice) {

            const lista =
                JSON.parse(
                    localStorage.getItem(
                        "veiculos"
                    )
                ) || [];


            const nome =
                lista[indice];


            const confirmar =
                confirm(
                    'Tem a certeza que pretende excluir a aeronave "' +
                    nome +
                    '"?'
                );


            if (!confirmar) {

                return;

            }


            lista.splice(
                indice,
                1
            );


            localStorage.setItem(
                "veiculos",
                JSON.stringify(lista)
            );


            mostrarVeiculos();

        }


        /* ================================
           INICIAR
        ================================= */

        mostrarVeiculos();

    </script>

</body>
