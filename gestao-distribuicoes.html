<!DOCTYPE html>
<html lang="pt">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gestão - PRIMO PEÇAS</title>


    <style>
        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #f3f6fa;

            color: #1f2937;

        }


        /* ================================
   MENU MOBILE
================================= */

        .menu-mobile {
            display: none;
        }

        .botao-menu {
            border: none;

            background: #123b63;
            color: #ffffff;

            font-size: 20px;

            cursor: pointer;
        }

        #conteudo {
            max-width: 1200px;

            margin-left: 185px;
            margin-right: auto;

            padding: 82px 25px 60px;
        }


        /* ================================
           TÍTULO PRINCIPAL
        ================================= */

        h1 {

            margin: 0 0 35px;

            font-size: 32px;

            font-weight: 700;

            color: #172033;

        }


        /* ================================
           TÍTULOS DAS SECÇÕES
        ================================= */

        h2 {

            margin: 35px 0 18px;

            font-size: 22px;

            color: #172033;

        }


        /* ================================
           LISTA DE ITENS
        ================================= */

        /* ================================
   GRELHA DE DISTRIBUIDORES E VEÍCULOS
================================ */

        #listaDistribuidoresCarro,
        #listaDistribuidoresMoto,
        #listaVeiculos {

            display: grid !important;

            grid-template-columns:
                repeat(3, minmax(0, 1fr)) !important;

            gap: 10px;

            width: 100%;

        }


        /* ================================
           CARTÃO
        ================================= */

        .item-gestao {

            background: white;

            border: 1px solid #e1e7ef;

            border-radius: 10px;

            padding: 10px 12px;

            display: flex;

            align-items: center;

            gap: 8px;

            min-height: 52px;

            box-shadow:
                0 2px 5px rgba(0, 0, 0, 0.04);

            transition:
                transform 0.15s ease,
                box-shadow 0.15s ease;

        }


        .item-gestao:hover {

            transform: translateY(-2px);

            box-shadow:
                0 5px 14px rgba(0, 0, 0, 0.09);

        }


        /* ================================
           NOME
        ================================= */

        .item-gestao span {

            flex: 1;

            font-size: 14px;

            font-weight: 600;

            color: #263247;

            line-height: 1.3;

        }


        /* ================================
           BOTÕES
        ================================= */

        .item-gestao button {

            border: none;

            border-radius: 6px;

            padding: px 8px;

            font-size: 12px;

            font-weight: 600;

            cursor: pointer;

            transition:
                background 0.15s ease,
                transform 0.1s ease;

        }


        .item-gestao button:active {

            transform: scale(0.96);

        }


        /* EDITAR */

        .item-gestao button:first-of-type {

            background: #e8f0ff;

            color: #2563eb;

        }


        .item-gestao button:first-of-type:hover {

            background: #dbe7ff;

        }


        /* EXCLUIR */

        .item-gestao button:last-of-type {

            background: #feecec;

            color: #dc2626;

        }


        .item-gestao button:last-of-type:hover {

            background: #fde0e0;

        }


        /* ================================
           FORMULÁRIO
        ================================= */

        .formulario-gestao {

            margin-top: 15px;

            background: white;

            border: 1px solid #e1e7ef;

            border-radius: 12px;

            padding: 12px;

            display: flex;

            align-items: center;

            gap: 10px;

            width: fit-content;

        }


        .formulario-gestao input {

            width: 260px;

            padding: 10px 12px;

            border: 1px solid #cfd7e3;

            border-radius: 8px;

            font-size: 14px;

            outline: none;

        }


        .formulario-gestao input:focus {

            border-color: #2563eb;

            box-shadow:
                0 0 0 3px rgba(37, 99, 235, 0.10);

        }


        .formulario-gestao button {

            border: none;

            border-radius: 8px;

            padding: 10px 14px;

            background: #2563eb;

            color: white;

            font-size: 13px;

            font-weight: 600;

            cursor: pointer;

            white-space: nowrap;

        }


        .formulario-gestao button:hover {

            background: #1d4ed8;

        }


        /* ================================
           SEPARAÇÃO ENTRE SECÇÕES
        ================================= */

        #listaVeiculos {

            margin-bottom: 5px;

        }

        /* ================================
   CABEÇALHO DA GESTÃO
================================= */

        .cabecalho-gestao {
            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 20px;

            margin-bottom: 18px;
            padding: 18px 20px;

            background: #ffffff;

            border: 1px solid #dbe4ee;
            border-radius: 14px;

            box-shadow:
                0 3px 12px rgba(15, 23, 42, 0.06);
        }

        .rotulo-gestao {
            display: block;

            margin-bottom: 4px;

            color: #64748b;

            font-size: 10px;
            font-weight: 800;

            letter-spacing: 0.8px;
        }

        .cabecalho-gestao h1 {
            margin: 0;

            color: #123b63;

            font-size: 24px;
            font-weight: 800;
        }

        .cabecalho-gestao p {
            margin: 4px 0 0;

            color: #64748b;

            font-size: 12px;
        }

        .botao-voltar-gestao {
            height: 34px;

            padding: 0 14px;

            border: none;
            border-radius: 7px;

            background: #123b63;
            color: #ffffff;

            font-size: 11px;
            font-weight: 800;

            cursor: pointer;
        }

        .botao-voltar-gestao:hover {
            background: #09243d;
        }


        /* ================================
   ABAS DA GESTÃO
================================= */

        .abas-gestao {
            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 10px;

            margin-bottom: 14px;

            padding: 8px;

            background: #ffffff;

            border: 1px solid #dbe4ee;
            border-radius: 12px;

            box-shadow:
                0 2px 8px rgba(15, 23, 42, 0.05);
        }

        .aba-gestao {
            min-height: 42px;

            border: 1px solid #dbe4ee;
            border-radius: 8px;

            background: #f8fafc;
            color: #475569;

            font-size: 12px;
            font-weight: 800;

            cursor: pointer;
        }

        .aba-gestao:hover {
            background: #eff6ff;
            color: #2563eb;
        }

        .aba-gestao.ativa {
            background: #2563eb;
            color: #ffffff;

            border-color: #2563eb;
        }


        /* ================================
   SECÇÕES DA GESTÃO
================================= */

        .secao-gestao {
            padding: 16px 18px;

            background: #ffffff;

            border: 1px solid #dbe4ee;
            border-radius: 12px;

            box-shadow:
                0 2px 8px rgba(15, 23, 42, 0.05);
        }

        .cabecalho-secao-gestao {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-bottom: 12px;
        }

        .cabecalho-secao-gestao span {
            display: block;

            margin-bottom: 2px;

            color: #94a3b8;

            font-size: 9px;
            font-weight: 800;

            letter-spacing: 0.7px;
        }

        .cabecalho-secao-gestao h2 {
            margin: 0;

            color: #123b63;

            font-size: 18px;
            font-weight: 800;
        }

        .dados-aeronave-gestao {
            flex: 1;

            display: flex;
            flex-direction: column;

            gap: 3px;

            min-width: 0;
        }

        .dados-aeronave-gestao span {
            font-size: 14px;
            font-weight: 700;

            color: #263247;
        }

        .estado-aeronave-gestao {

            font-size: 9px;
            font-weight: 800;

            background: #dcfce7;
            color: #15803d;
        }

        .estado-aeronave-missao {
            background: #fee2e2;
            color: #b91c1c;
        }

        .estado-aeronave-retornando {
            background: #ffedd5;
            color: #c2410c;
        }

        .modal-ficha-tecnica {

            display: none;
            align-items: center;
            justify-content: center;

            padding: 0 9px;

            font-weight: 700;

        .grade-modal-ficha input:focus {

        }


        .acoes-modal-ficha button {

            font-size: 10px;
            font-weight: 800;

            cursor: pointer;
        }


        .botao-cancelar-ficha {

            background: #ffffff;
            color: #475569;
        }


        .botao-guardar-ficha {
            border: 1px solid #2563eb;

            background: #2563eb;

        }

        /* =========================================
   AERONAVES - LAYOUT COMPACTO DEFINITIVO
========================================= */

        #listaVeiculos {
            display: grid !important;

            grid-template-columns:
                repeat(4, minmax(0, 1fr)) !important;

            gap: 9px !important;

            width: 100% !important;
        }


        #listaVeiculos .item-aeronave-gestao {
            display: flex !important;

            flex-direction: column !important;

            align-items: stretch !important;

            justify-content: center !important;

        #listaVeiculos .topo-aeronave-gestao {

            justify-content: space-between !important;

            width: 100% !important;

            gap: 8px !important;
        }


        #listaVeiculos .topo-aeronave-gestao strong {
            margin: 0 !important;

            color: #123b63;

            font-size: 12px;
            font-weight: 800;

            white-space: nowrap;

        #listaVeiculos .estado-aeronave-gestao {
            margin: 0 !important;

            flex: 0 0 auto !important;

            white-space: nowrap;
        }


        #listaVeiculos .acoes-aeronave-gestao {
            display: grid !important;

            grid-template-columns:
                1.35fr .8fr .8fr !important;

            gap: 5px !important;

            width: 100% !important;
        }


        #listaVeiculos .acoes-aeronave-gestao button {
            width: 100% !important;

            margin: 0 !important;

            padding: 5px 4px !important;

            font-size: 9px !important;

            white-space: nowrap !important;
        }

        #listaVeiculos .botao-ficha-aeronave:hover {
            background: #123b63 !important;
            color: #ffffff !important;
        }


        #listaVeiculos .botao-editar-aeronave:hover {
            background: #2563eb !important;
            color: #ffffff !important;
        }


        #listaVeiculos .botao-excluir-aeronave:hover {
            background: #dc2626 !important;
            color: #ffffff !important;
        }

        #listaVeiculos .item-aeronave-gestao {
            transition:

                box-shadow .18s ease,
                transform .18s ease;
        }


        #listaVeiculos .item-aeronave-gestao:hover {

            box-shadow:
                0 6px 16px rgba(37, 99, 235, .08) !important;

        .linha-abas-gestao {

            align-items: center;
            justify-content: space-between;

            width: 100%;

            transition:

        .aba-gestao:hover {
            border-color: #93c5fd;

            background: #eef4fb;

            color: #123b63;
        }


        .aba-gestao.ativa {
            border-color: #2563eb;

            background: #2563eb;

            color: #ffffff;
        }


        .botao-voltar-drones:hover {
            border-color: #123b63;

        .linha-abas-gestao .aba-gestao {
            width: 200px !important;

            padding: 6px 12px !important;

        #abaAeronaves,

            width: 250px !important;
            min-width: 250px !important;
            max-width: 250px !important;

            flex: 0 0 200px !important;

            padding: 6px 12px !important;

            text-align: center !important;
        }


        /* ================================
           TABLET
        ================================= */

        @media (max-width: 900px) {

            #listaDistribuidoresCarro,
            #listaDistribuidoresMoto,

                grid-template-columns:

            }

        }


        /* ================================
   TELEMÓVEL
================================= */

        @media (max-width: 600px) {

            #conteudo {

                padding: 25px 15px 40px;

            }

            h2 {

                font-size: 20px;

            }


            /* ================================
       1 CARTÃO POR LINHA
    ================================= */

            #listaDistribuidoresCarro,
            #listaDistribuidoresMoto,
            #listaVeiculos {

                display: grid !important;

                grid-template-columns: 1fr !important;

                width: 100% !important;

                gap: 10px;

            }


            /* ================================
       CARTÃO
    ================================= */

            .item-gestao {

                width: 100%;

                padding: 14px;

            }

            /* =================================
   CARDS DAS AERONAVES
================================= */

            #listaVeiculos {
                grid-template-columns:
                    repeat(4, minmax(0, 1fr)) !important;

                gap: 9px;
            }


            #listaVeiculos .item-aeronave-gestao {
                display: flex;

                flex-direction: column;
                align-items: stretch;

                gap: 8px;

                padding: 9px 10px;
            }

                display: flex;

                align-items: center;
                justify-content: space-between;

                gap: 8px;
            }


            .topo-aeronave-gestao strong {

            }


            .topo-aeronave-gestao .estado-aeronave-gestao {

            #listaVeiculos .acoes-aeronave-gestao button {

            }


            .botao-ficha-aeronave {

            .botao-ficha-aeronave:hover {

            /* ================================

            .formulario-gestao {

    </style>

    <script>

        /* ================================
           DISTRIBUIDORES INICIAIS
        ================================= */

        const distribuidoresCarroIniciais = [
            "Aníbal",
            "João Palha",
            "Victor Hugo",
            "André",
            "Lopes",
            "Fernando"
        ];


        const distribuidoresMotoIniciais = [
            "Ianyck",
            "Dione",
            "Charles",
            "Francisco",
            "Vitor",
            "Mauro",
            "Leonardo",
            "Juan",
            "Gustavo"
        ];


        /* ================================
           VEÍCULOS INICIAIS
        ================================= */

        const veiculosIniciais = [
            "DRN-001",
            "DRN-002",
            "DRN-003",
            "DRN-004",
            "DRN-005",
            "DRN-006",
            "DRN-007",
            "DRN-008",
            "DRN-009",
            "DRN-010"
        ];


        /* ================================
           MIGRAÇÃO DOS DISTRIBUIDORES
        ================================= */

        function prepararDistribuidores() {

            const existentes =
                JSON.parse(
                    localStorage.getItem("distribuidores")
                );


            /*
             * Se já estiverem no novo formato,
             * não fazemos nada.
             */

            if (
                Array.isArray(existentes) &&
                existentes.length > 0 &&
                typeof existentes[0] === "object"
            ) {

                return;

            }


            /*
             * Se existirem os distribuidores antigos
             * como strings, fazemos a conversão.
             */

        function adicionarDistribuidor(tipo) {

            const idCampo =
                tipo === "carro"
                    ? "novoDistribuidorCarro"
                    : "novoDistribuidorMoto";


            const campo =
                document.getElementById(idCampo);


            const nome =
                campo.value.trim();


            if (!nome) {

                alert(
                    "Digite o nome do distribuidor."
                );

                return;

            }


            const lista =
                JSON.parse(
                    localStorage.getItem(
                        "distribuidores"
                    )
                ) || [];


            const existe =
                lista.some(
                    function (distribuidor) {

                        return (
                            distribuidor.nome
                                .toLowerCase() ===
                            nome.toLowerCase()
                        );

                    }
                );


            if (existe) {

                alert(
                    "Esse distribuidor já existe."
                );

                return;

            }


            lista.push({

                nome: nome,

                tipo: tipo

            });


            localStorage.setItem(
                "distribuidores",
                JSON.stringify(lista)
            );


            campo.value = "";


            mostrarDistribuidores();

        function editarDistribuidor(indice) {

            const lista =
                JSON.parse(
                    localStorage.getItem(
                        "distribuidores"
                    )
                ) || [];


            const distribuidor =
                lista[indice];


            if (!distribuidor) {

                return;

            }


            const novoNome =
                prompt(
                    "Novo nome do distribuidor:",
                    distribuidor.nome
                );


            if (novoNome === null) {

                return;

            }


            const nome =
                novoNome.trim();


            if (!nome) {

                alert(
                    "O nome não pode ficar vazio."
                );

                return;

            }


            const existe =
                lista.some(
                    function (item, i) {

                        return (
                            i !== indice &&
                            item.nome.toLowerCase() ===
                            nome.toLowerCase()
                        );

                    }
                );


            if (existe) {

                alert(
                    "Esse distribuidor já existe."
                );

                return;

            }


            lista[indice].nome = nome;


            localStorage.setItem(
                "distribuidores",
                JSON.stringify(lista)

            mostrarDistribuidores();

        function editarFichaTecnica(

                    )
                ) || {};

                fichasTecnicas[

                codigoDrone
                ] || {};


            const fichaAtual = {

                    String(
                        fichaGuardada.modelo || ""
                    ).trim()
                        ? fichaGuardada.modelo
                        : fichaPadrao.modelo || "",

                serie:
                    String(
                        fichaGuardada.serie || ""

                        : fichaPadrao.serie || "",

                    ).trim()
                        ? fichaGuardada.entrada
                        : fichaPadrao.entrada || "",

                        ? fichaGuardada.carga
                        : fichaPadrao.carga || ""

            };

        }


        function guardarFichaTecnica() {

            if (
                !droneFichaTecnicaAtual
            ) {
                return;
            }


            const fichasTecnicas =
                JSON.parse(
                    localStorage.getItem(
                        "fichasTecnicasDrones"
                    )
                ) || {};

            const fichaAnterior =
                fichasTecnicas[
                droneFichaTecnicaAtual
                ] || {};

            const novoModelo =
                document
                    .getElementById(
                        "campoFichaModelo"
                    )
                    .value
                    .trim();


            const novaSerie =
                document
                    .getElementById(
                        "campoFichaSerie"
                    )
                    .value
                    .trim();


            const novaEntrada =
                document
                    .getElementById(
                        "campoFichaEntrada"
                    )
                    .value
                    .trim();


            const novaCarga =
                document
                    .getElementById(
                        "campoFichaCarga"
                    )
                    .value
                    .trim();


            fichasTecnicas[
                droneFichaTecnicaAtual
            ] = {

                modelo:
                    novoModelo,

                serie:
                    novaSerie,

                entrada:
                    novaEntrada,

                carga:
                    novaCarga

            };


            localStorage.setItem(
                "fichasTecnicasDrones",
                JSON.stringify(
                    fichasTecnicas
                )
            );


            /* ================================
               HISTÓRICO TÉCNICO
            ================================ */

            const historicoTecnico =
                JSON.parse(
                    localStorage.getItem(
                        "historicoTecnicoDrones"
                    )
                ) || {};


            if (
                !Array.isArray(
                    historicoTecnico[
                    droneFichaTecnicaAtual
                    ]
                )
            ) {

                historicoTecnico[
                    droneFichaTecnicaAtual
                ] = [];

            }

            const alteracoes = [];


            if (
                String(
                    fichaAnterior.modelo || ""
                ) !== novoModelo
            ) {

                alteracoes.push(
                    "Modelo: " +
                    (fichaAnterior.modelo || "--") +
                    " → " +
                    (novoModelo || "--")
                );

            }


            if (
                String(
                    fichaAnterior.serie || ""
                ) !== novaSerie
            ) {

                alteracoes.push(
                    "Nº de série: " +
                    (fichaAnterior.serie || "--") +
                    " → " +
                    (novaSerie || "--")
                );

            }


            if (
                String(
                    fichaAnterior.entrada || ""
                ) !== novaEntrada
            ) {

                alteracoes.push(
                    "Entrada em serviço: " +
                    (fichaAnterior.entrada || "--") +
                    " → " +
                    (novaEntrada || "--")
                );

            }


            if (
                String(
                    fichaAnterior.carga || ""
                ) !== novaCarga
            ) {

                alteracoes.push(
                    "Carga útil: " +
                    (fichaAnterior.carga || "--") +
                    " → " +
                    (novaCarga || "--")
                );

            }


            historicoTecnico[
                droneFichaTecnicaAtual
            ].push({

                tipo:
                    alteracoes.length > 0
                        ? "Atualização da ficha técnica · " +
                        alteracoes.join(" · ")
                        : "Atualização da ficha técnica",

                data:
                    new Date().toISOString()

            });


            localStorage.setItem(
                "historicoTecnicoDrones",
                JSON.stringify(
                    historicoTecnico
                )
            );


            fecharModalFichaTecnica();

        }

                return;

            }


            lista.splice(
                indice,
                1
            );


            localStorage.setItem(
                "veiculos",
                JSON.stringify(lista)
            );


            mostrarVeiculos();

        }


        /* ================================
           INICIAR
        ================================= */

        mostrarVeiculos();

    </script>

                </label>

                <label>
                    <span>Entrada em serviço</span>
                    <input type="text" id="campoFichaEntrada" placeholder="dd/mm/aaaa">
                </label>

                <label>
                    <span>Carga útil</span>
