<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <link rel="stylesheet" href="menu.css">
    <link rel="stylesheet" href="layout-global.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>

    <title>Gestão de Rotas - Clientes</title>

    <style>
        :root {
            --azul-primo: #123b63;
            --azul-primo-hover: #0d2f50;
            --fundo-painel: #f4f6f8;
            --branco: #ffffff;
            --borda: #e1e6eb;
            --texto: #1f2933;
            --texto-secundario: #667085;
            --sucesso: #2f8f5b;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: var(--fundo-painel);
            color: var(--texto);
        }

        h1 {
            margin-bottom: 25px;
            font-size: 28px;
            font-weight: 700;
            color: var(--texto);
        }

        .formulario {
            background: var(--branco);
            padding: 16px 18px;
            border-radius: 10px;
            border: 1px solid var(--borda);
            margin-bottom: 18px;
            box-shadow: 0 2px 7px rgba(16, 24, 40, 0.05);
            transition:
                border-color 0.18s ease,
                box-shadow 0.18s ease,
                transform 0.18s ease;
        }

        .formulario:hover {
            transform: translateY(-2px);

            border-color: #93c5fd;

            box-shadow:
                0 7px 18px rgba(37, 99, 235, 0.10);
        }

        .campo {
            margin-bottom: 11px;
        }

        label {
            display: block;
            margin-bottom: 5px;

            color: #475569;

            font-size: 10px;
            font-weight: 800;

            text-transform: uppercase;
            letter-spacing: 0.035em;
        }

        input,
        select {
            width: 100%;
            height: 38px;

            padding: 8px 11px;

            box-sizing: border-box;

            border: 1px solid #d7dee7;
            border-radius: 7px;

            background: #fbfcfe;
            color: #1f2937;

            font-size: 12px;
            font-weight: 500;

            outline: none;

            transition:
                background 0.18s ease,
                border-color 0.18s ease,
                box-shadow 0.18s ease;
        }

        input:hover,
        select:hover {
            border-color: #b6c4d4;
            background: #ffffff;
        }

        input:focus,
        select:focus {
            background: #ffffff;
            border-color: #2563eb;

            box-shadow:
                0 0 0 3px rgba(37, 99, 235, 0.10),
                0 2px 6px rgba(15, 23, 42, 0.04);
        }

        input::placeholder {
            color: #94a3b8;
            font-size: 11px;
            font-weight: 500;
            opacity: 1;
        }

        button {
            padding: 11px 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: var(--azul-primo);
            color: white;
            font-size: 15px;
            font-weight: 600;
            transition: background 0.2s ease, transform 0.2s ease;
        }

        button:hover {
            background: var(--azul-primo-hover);
            transform: translateY(-2px);
        }

        #botaoFormulario {
            min-width: 155px;
            padding: 9px 16px;

            border: 1px solid #123b63;
            border-radius: 7px;

            background: linear-gradient(135deg,
                    #123b63 0%,
                    #1d4f7a 100%);

            color: #ffffff;

            font-size: 11px;
            font-weight: 800;

            box-shadow:
                0 3px 8px rgba(18, 59, 99, 0.16);

            transition:
                transform 0.18s ease,
                box-shadow 0.18s ease;
        }

        #botaoFormulario:hover {
            transform: translateY(-1px);

            box-shadow:
                0 5px 12px rgba(18, 59, 99, 0.22);
        }

        #botaoFormulario {
            min-width: 155px;
            padding: 9px 16px;

            border: 1px solid #123b63;
            border-radius: 7px;

            background:
                linear-gradient(135deg,
                    #123b63 0%,
                    #1d4f7a 100%);

            color: #ffffff;

            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.02em;

            box-shadow:
                0 3px 8px rgba(18, 59, 99, 0.16);

            transition:
                transform 0.18s ease,
                box-shadow 0.18s ease,
                background 0.18s ease;
        }

        #botaoFormulario:hover {
            background:
                linear-gradient(135deg,
                    #0d2f50 0%,
                    #123b63 100%);

            transform: translateY(-1px);

            box-shadow:
                0 5px 12px rgba(18, 59, 99, 0.22);
        }

        .coordenadas-cliente {
            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 10px;

            margin-bottom: 12px;
            padding: 10px;

            border: 1px solid #dbeafe;
            border-radius: 8px;

            background: #f8fbff;
        }

        @media (max-width: 600px) {

            .coordenadas-cliente {
                grid-template-columns: 1fr;
            }

        }

        .lista {
            margin-top: 4px;

            background:
                linear-gradient(180deg,
                    #ffffff 0%,
                    #fbfcfe 100%);

            padding: 16px 18px;

            border: 1px solid #dbe2ea;
            border-radius: 10px;

            box-shadow:
                0 2px 7px rgba(15, 23, 42, 0.05);

            transition:
                border-color 0.18s ease,
                box-shadow 0.18s ease,
                transform 0.18s ease;
        }

        .lista:hover {
            transform: translateY(-1px);

            border-color: #bbf7d0;

            box-shadow:
                0 6px 16px rgba(34, 197, 94, 0.08);
        }

        .lista h2 {
            position: relative;

            margin: 0 0 14px;
            padding-left: 12px;

            color: #123b63;

            font-size: 16px;
            font-weight: 900;
            line-height: 1.2;
        }

        .lista h2::before {
            content: "";

            position: absolute;
            top: 1px;
            bottom: 1px;
            left: 0;

            width: 4px;

            border-radius: 4px;

            background: #22c55e;
        }

        .cliente {
            position: relative;
            overflow: hidden;

            background:
                linear-gradient(180deg,
                    #ffffff 0%,
                    #f8fafc 100%);

            border: 1px solid #dbe2ea;
            border-radius: 10px;

            padding: 13px 14px 13px 18px;
            margin-bottom: 0px;

            box-shadow:
                0 2px 7px rgba(15, 23, 42, 0.04);

            transition:
                transform 0.18s ease,
                border-color 0.18s ease,
                box-shadow 0.18s ease;
        }

        .cliente::before {
            content: "";

            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;

            width: 4px;

            background: #123b63;
        }

        .cliente:hover {
            transform: translateY(-2px);

            border-color: #93c5fd;

            box-shadow:
                0 6px 16px rgba(37, 99, 235, 0.10);
        }

        .cliente strong {
            color: var(--texto);
            font-size: 16px;
        }

        .pesquisa {
            display: grid;
            grid-template-columns: minmax(0, 2fr) minmax(180px, 0.7fr);

            gap: 8px;

            margin-bottom: 14px;
            padding: 10px;

            border: 1px solid #dbeafe;
            border-radius: 8px;

            background: #f8fbff;
            transition:
                background 0.18s ease,
                border-color 0.18s ease,
                box-shadow 0.18s ease;
        }

        .btn-editar,
        .btn-excluir {
            padding: 7px 11px;

            border-radius: 6px;

            font-size: 10px;
            font-weight: 800;

            box-shadow: none;

            transition:
                background 0.18s ease,
                border-color 0.18s ease,
                color 0.18s ease,
                transform 0.18s ease;
        }

        .btn-editar {
            border: 1px solid #bfdbfe;

            background: #eff6ff;
            color: #1d4ed8;
        }

        .btn-editar:hover {
            border-color: #2563eb;

            background: #2563eb;
            color: #ffffff;

            transform: translateY(-1px);
        }

        .btn-excluir {
            border: 1px solid #fecaca;

            background: #fef2f2;
            color: #b91c1c;
        }

        .btn-excluir:hover {
            border-color: #dc2626;

            background: #dc2626;
            color: #ffffff;

            transform: translateY(-1px);
        }

        .cliente-codigo {
            display: inline-flex;
            align-items: center;

            padding: 4px 8px;

            border: 1px solid #dbeafe;
            border-radius: 6px;

            background: #eff6ff;
            color: #1d4ed8;

            font-size: 9px;
            font-weight: 900;

            letter-spacing: 0.04em;
        }

        .cliente-cabecalho {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .cliente-cabecalho strong {
            color: #123b63;

            font-size: 14px;
            font-weight: 900;
            line-height: 1.2;
        }

        .cliente-cabecalho span {
            color: #1d4ed8;

            font-size: 10px;
            font-weight: 800;

            letter-spacing: 0.03em;
        }

        .cliente-info {
            display: flex;
            flex-direction: column;

            gap: 6px;
            margin-bottom: 11px;
        }

        .cliente-info span {
            color: #64748b;

            font-size: 11px;
            font-weight: 500;
            line-height: 1.35;
        }

        #listaClientes {
            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 10px;

            color: var(--texto-secundario);
            font-size: 14px;
        }

        .mensagem-vazia {
            grid-column: 1 / -1;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            padding: 22px 18px;

            text-align: center;

            border: 1px dashed #bfdbfe;
            border-radius: 9px;

            background:
                linear-gradient(180deg,
                    #f8fbff 0%,
                    #f1f5f9 100%);

            box-shadow:
                inset 0 0 0 1px rgba(37, 99, 235, 0.02);
        }

        .mensagem-vazia strong {
            display: block;

            margin-bottom: 4px;

            color: #123b63;

            font-size: 13px;
            font-weight: 900;
        }

        .mensagem-vazia span {
            color: #64748b;

            font-size: 10px;
            font-weight: 500;
        }

        #conteudo {
            margin-left: 185px;
            padding: 82px 25px 60px;
        }

        .botao-localizar-endereco {
            width: auto;

            margin: 0 0 14px;
            padding: 8px 12px;

            border: 1px solid #bfdbfe;
            border-radius: 7px;

            background: #eff6ff;
            color: #1d4ed8;

            font-size: 10px;
            font-weight: 800;

            cursor: pointer;

            box-shadow:
                0 2px 5px rgba(37, 99, 235, 0.06);

            transition:
                background 0.18s ease,
                border-color 0.18s ease,
                color 0.18s ease,
                transform 0.18s ease,
                box-shadow 0.18s ease;
        }

        .botao-localizar-endereco:hover {
            background: #2563eb;
            border-color: #2563eb;
            color: #ffffff;

            transform: translateY(-1px);

            box-shadow:
                0 4px 9px rgba(37, 99, 235, 0.16);
        }

        .botao-localizar-endereco:disabled {
            cursor: wait;

            background: #f1f5f9;
            border-color: #cbd5e1;
            color: #64748b;

            box-shadow: none;
            transform: none;

            opacity: 0.85;
        }

        /* =========================================
   MAPA DE CONFIRMAÇÃO DO CLIENTE
========================================= */

        .mapa-confirmacao-cliente {
            position: relative;

            width: 100%;
            height: 210px;

            margin-bottom: 16px;

            overflow: hidden;

            border: 1px solid #bfdbfe;
            border-radius: 10px;

            background:
                linear-gradient(135deg,
                    #f8fbff 0%,
                    #eef6ff 100%);

            box-shadow:
                inset 0 0 0 1px rgba(37, 99, 235, 0.03),
                0 2px 7px rgba(15, 23, 42, 0.05);
        }

        .mapa-confirmacao-vazio {
            width: 100%;
            height: 100%;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;

            box-sizing: border-box;

            color: #64748b;

            font-size: 12px;
            text-align: center;
        }

        #mapaConfirmacaoCliente img.leaflet-tile {
            max-width: none !important;
            max-height: none !important;
        }

        #mapaConfirmacaoCliente .leaflet-tile {
            width: 256px !important;
            height: 256px !important;
        }

        @media (max-width: 700px) {

            body {
                padding: 0;
            }

            h1 {
                font-size: 24px;
                margin-bottom: 20px;
            }

            .formulario,
            .lista {
                padding: 18px;
            }

            .pesquisa {
                grid-template-columns: 1fr;
            }

            .cliente-cabecalho {
                display: flex;
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
                gap: 8px;
            }

            .cliente button {
                width: auto;
                padding: 7px 12px;
                margin-top: 8px;
                font-size: 13px;
            }

            #resumoClientes {
                grid-template-columns: 1fr;
                gap: 10px;
            }

            #conteudo {
                margin-left: 0;
                padding: 16px;
            }

            .pesquisa {
                width: 100%;
                box-sizing: border-box;
            }

            .pesquisa input,
            .pesquisa select {
                width: 100%;
                max-width: 100%;
                box-sizing: border-box;
            }

            .pesquisa:focus-within {
                border-color: #93c5fd;

                background: #f4f9ff;

                box-shadow:
                    0 0 0 3px rgba(37, 99, 235, 0.06);
            }

            html,
            body {
                overflow-x: hidden;
            }

            #listaClientes {
                grid-template-columns: 1fr;
            }

        }

        #tituloFormulario {
            position: relative;

            margin: 0 0 4px;
            padding-left: 12px;

            color: #123b63;

            font-size: 17px;
            font-weight: 900;
            line-height: 1.2;
        }

        #tituloFormulario::before {
            content: "";

            position: absolute;
            top: 1px;
            bottom: 1px;
            left: 0;

            width: 4px;

            border-radius: 4px;

            background: #2563eb;
        }

        #tituloFormulario::after {
            content: "＋";

            display: inline-flex;
            align-items: center;
            justify-content: center;

            width: 20px;
            height: 20px;

            margin-left: 8px;

            border-radius: 6px;

            background: #eff6ff;
            color: #2563eb;

            font-size: 13px;
            font-weight: 900;

            vertical-align: middle;
        }

        .formulario.editando #tituloFormulario::after {
            content: "✎";

            background: #fff7ed;
            color: #d97706;
        }

        .subtitulo-formulario {
            margin: 0 0 18px;
            padding-left: 12px;

            color: #64748b;

            font-size: 11px;
            font-weight: 500;
        }

        .formulario.editando {
            border-color: #f59e0b;

            background:
                linear-gradient(180deg,
                    #ffffff 0%,
                    #fffbeb 100%);

            box-shadow:
                0 0 0 3px rgba(245, 158, 11, 0.08),
                0 4px 12px rgba(15, 23, 42, 0.05);
        }

        .formulario.editando #botaoFormulario {
            border-color: #d97706;

            background:
                linear-gradient(135deg,
                    #f59e0b 0%,
                    #d97706 100%);

            color: #ffffff;

            box-shadow:
                0 3px 8px rgba(217, 119, 6, 0.18);
        }

        .formulario.editando #botaoFormulario:hover {
            background:
                linear-gradient(135deg,
                    #d97706 0%,
                    #b45309 100%);

            box-shadow:
                0 5px 12px rgba(217, 119, 6, 0.24);
        }

        .formulario.editando #tituloFormulario::before {
            background: #f59e0b;
        }

        .cliente-rota {
            display: inline-flex;
            align-items: center;

            width: fit-content;

            padding: 4px 8px;

            border: 1px solid #dbeafe;
            border-radius: 6px;

            background: #eff6ff;
            color: #1d4ed8;

            font-size: 9px;
            font-weight: 800;

            letter-spacing: 0.02em;
        }

        #resumoClientes {
            display: grid;
            grid-template-columns: repeat(3, 1fr);

            gap: 10px;
            margin-bottom: 16px;
        }

        .indicador-cliente {
            position: relative;
            overflow: hidden;

            background:
                linear-gradient(180deg,
                    #ffffff 0%,
                    #f8fafc 100%);

            border: 1px solid var(--borda);
            border-radius: 10px;

            padding: 12px 14px 12px 18px;

            box-shadow:
                0 2px 7px rgba(15, 23, 42, 0.05);

            transition:
                transform 0.18s ease,
                background 0.18s ease,
                border-color 0.18s ease,
                box-shadow 0.18s ease;
        }

        .indicador-cliente::before {
            content: "";

            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;

            width: 4px;

            background: #94a3b8;
        }

        .indicador-cliente:nth-child(1)::before {
            background: #1976d2;
        }

        .indicador-cliente:nth-child(2)::before {
            background: #2e7d32;
        }

        .indicador-cliente:nth-child(3)::before {
            background: #ef8f00;
        }

        .indicador-cliente:nth-child(1) {
            border-color: #1976d2;
        }

        .indicador-cliente:nth-child(2) {
            border-color: #2e7d32;
        }

        .indicador-cliente:nth-child(3) {
            border-color: #ef8f00;
        }

        .indicador-cliente:hover {
            transform: translateY(-2px);
        }

        .indicador-cliente:nth-child(1):hover {
            background: #eff6ff;
            border-color: #1976d2;
            box-shadow: 0 4px 12px rgba(25, 118, 210, 0.12);
        }

        .indicador-cliente:nth-child(2):hover {
            background: #f0fdf4;
            border-color: #2e7d32;
            box-shadow: 0 4px 12px rgba(46, 125, 50, 0.12);
        }

        .indicador-cliente:nth-child(3):hover {
            background: #fff7ed;
            border-color: #ef8f00;
            box-shadow: 0 4px 12px rgba(239, 143, 0, 0.12);
        }

        .indicador-cliente strong {
            display: block;
            margin-bottom: 3px;

            color: #123b63;

            font-size: 22px;
            font-weight: 900;
            line-height: 1;
        }

        .indicador-cliente:nth-child(1) strong {
            color: #1976d2;
        }

        .indicador-cliente:nth-child(2) strong {
            color: #2e7d32;
        }

        .indicador-cliente:nth-child(3) strong {
            color: #d97706;
        }

        .indicador-cliente::after {
            position: absolute;
            top: 50%;
            right: 14px;

            transform: translateY(-50%);

            font-size: 22px;
            opacity: 0.16;

            pointer-events: none;
        }

        .indicador-cliente:nth-child(1)::after {
            content: "👥";
        }

        .indicador-cliente:nth-child(2)::after {
            content: "🗺️";
        }

        .indicador-cliente:nth-child(3)::after {
            content: "📍";
        }

        .indicador-cliente span {
            display: block;

            color: #64748b;

            font-size: 10px;
            font-weight: 700;
            line-height: 1.2;

            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .acoes-cliente {
            display: flex;
            align-items: center;
            justify-content: flex-end;

            gap: 6px;

            margin-top: 10px;
            padding-top: 9px;

            border-top: 1px solid #e2e8f0;
        }
    </style>
</head>

<body>
    <header class="topo-gestao">

        <div class="identidade-topo-gestao">

            <img src="img/logo-primo-pecas.jpeg/ChatGPT Image 17 de set. de 2026, 22_59_03.png" alt="PRIMO PEÇAS"
                class="imagem-logo-gestao">

            <div class="titulo-topo-gestao">

                <h1>
                    📍 Pontos de Entrega
                </h1>

                <p>
                    Cadastro e gestão dos pontos de entrega
                </p>

            </div>

        </div>

    </header>

    <div id="menu-container"></div>
    <main id="conteudo">

        <div id="resumoClientes"></div>

        <div class="formulario">

            <h2 id="tituloFormulario">
                Novo cliente
            </h2>

            <p class="subtitulo-formulario">
                Adicione os dados do cliente e associe-o a uma rota.
            </p>

            <div class="campo">
                <label for="codigo">
                    Código do cliente
                </label>

                <input type="text" id="codigo" placeholder="Digite o código">
            </div>


            <div class="campo">
                <label for="nome">
                    Nome do cliente
                </label>

                <input type="text" id="nome" placeholder="Digite o nome">
            </div>


            <div class="campo">
                <label for="endereco">
                    Endereço completo
                </label>

                <input type="text" id="endereco" placeholder="Rua, número, código postal, cidade">
            </div>

            <button type="button" class="botao-localizar-endereco" onclick="localizarEnderecoCliente()">
                📍 Localizar endereço
            </button>


            <div class="coordenadas-cliente">

                <div class="campo">

                    <label for="latitude">
                        Latitude
                    </label>

                    <input type="number" id="latitude" step="any" placeholder="Ex: 41.6232128">

                </div>


                <div class="campo">

                    <label for="longitude">
                        Longitude
                    </label>

                    <input type="number" id="longitude" step="any" placeholder="Ex: -8.3472675">

                </div>

            </div>

            <div class="mapa-confirmacao-cliente" id="mapaConfirmacaoCliente">
                <div class="mapa-confirmacao-vazio">
                    📍 Localize o endereço para visualizar o ponto de entrega
                </div>
            </div>


            <div class="campo">
                <label for="rota">
                    Rota
                </label>

                <select id="rota">

                    <option value="">
                        Selecione a rota
                    </option>

                    <option value="1">Rota 1 - Adaúfe</option>
                    <option value="2">Rota 2 - Braga Este</option>
                    <option value="3">Rota 3 - Braga Estádio</option>
                    <option value="4">Rota 4 - Braga 1</option>
                    <option value="5">Rota 5 - Braga 2</option>
                    <option value="6">Rota 6 - Vieira do Minho</option>
                    <option value="7">Rota 7 - Póvoa de Lanhoso 1</option>
                    <option value="8">Rota 8 - Póvoa de Lanhoso 2</option>
                    <option value="9">Rota 9 - Amares</option>
                    <option value="10">Rota 10 - Terras de Bouro</option>
                    <option value="11">Rota 11 - Caldelas</option>
                    <option value="12">Rota 12 - Vila Verde 1</option>
                    <option value="13">Rota 13 - Vila Verde 2</option>
                    <option value="14">Rota 14 - Vila Verde 3</option>
                    <option value="15">Rota 15 - Vila Verde 4</option>
                    <option value="16">Rota 16 - Ponte de Lima</option>

                </select>
            </div>


            <button id="botaoFormulario" onclick="cadastrarCliente()">
                Cadastrar cliente
            </button>

        </div>


        <div class="lista">

            <h2>🔎 Pesquisar clientes</h2>

            <div class="pesquisa">
                <input type="text" id="pesquisa" placeholder="Pesquisar por código, nome, endereço ou rota..."
                    oninput="pesquisarClientes()">

                <select id="filtroRota" onchange="pesquisarClientes(); atualizarResumoClientes()">

                    <option value="">
                        Rotas
                    </option>

                    <option value="1">Rota 1 - Adaúfe</option>
                    <option value="2">Rota 2 - Braga Este</option>
                    <option value="3">Rota 3 - Braga Estádio</option>
                    <option value="4">Rota 4 - Braga 1</option>
                    <option value="5">Rota 5 - Braga 2</option>
                    <option value="6">Rota 6 - Vieira do Minho</option>
                    <option value="7">Rota 7 - Póvoa de Lanhoso 1</option>
                    <option value="8">Rota 8 - Póvoa de Lanhoso 2</option>
                    <option value="9">Rota 9 - Amares</option>
                    <option value="10">Rota 10 - Terras de Bouro</option>
                    <option value="11">Rota 11 - Caldelas</option>
                    <option value="12">Rota 12 - Vila Verde 1</option>
                    <option value="13">Rota 13 - Vila Verde 2</option>
                    <option value="14">Rota 14 - Vila Verde 3</option>
                    <option value="15">Rota 15 - Vila Verde 4</option>
                    <option value="16">Rota 16 - Ponte de Lima</option>

                </select>
            </div>

            <div id="listaClientes">
                Digite algo para pesquisar.
            </div>

        </div>


        <script>

            /* =========================================
                MAPA DE CONFIRMAÇÃO
                ========================================= */

            let mapaConfirmacaoCliente = null;

            let marcadorConfirmacaoCliente = null;


            function mostrarClienteNoMapa(
                latitude,
                longitude
            ) {

                const elementoMapa =
                    document.getElementById(
                        "mapaConfirmacaoCliente"
                    );


                if (!elementoMapa) {
                    return;
                }


                const coordenadas = [
                    Number(latitude),
                    Number(longitude)
                ];


                /* CRIAR MAPA */

                if (!mapaConfirmacaoCliente) {

                    elementoMapa.innerHTML = "";


                    mapaConfirmacaoCliente =
                        L.map(
                            "mapaConfirmacaoCliente"
                        ).setView(
                            coordenadas,
                            17
                        );


                    L.tileLayer(
                        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
                        {
                            maxZoom: 19,
                            attribution:
                                "&copy; OpenStreetMap contributors"
                        }
                    )
                        .addTo(
                            mapaConfirmacaoCliente
                        );

                } else {

                    mapaConfirmacaoCliente.setView(
                        coordenadas,
                        17
                    );

                }


                /* REMOVER MARCADOR ANTERIOR */

                if (marcadorConfirmacaoCliente) {

                    mapaConfirmacaoCliente.removeLayer(
                        marcadorConfirmacaoCliente
                    );

                }


                /* NOVO MARCADOR */

                marcadorConfirmacaoCliente =
                    L.marker(
                        coordenadas,
                        {
                            draggable: true
                        }
                    )
                        .addTo(
                            mapaConfirmacaoCliente
                        );


                marcadorConfirmacaoCliente
                    .bindPopup(
                        "<strong>Ponto de entrega</strong>"
                    )
                    .openPopup();


                /* PERMITIR AJUSTAR O PONTO */

                marcadorConfirmacaoCliente.on(
                    "dragend",
                    function () {

                        const posicao =
                            marcadorConfirmacaoCliente
                                .getLatLng();


                        document
                            .getElementById(
                                "latitude"
                            )
                            .value =
                            posicao.lat.toFixed(7);


                        document
                            .getElementById(
                                "longitude"
                            )
                            .value =
                            posicao.lng.toFixed(7);

                    }
                );


                setTimeout(
                    function () {

                        mapaConfirmacaoCliente
                            .invalidateSize();

                    },
                    200
                );

            }


            // =========================
            // CADASTRAR CLIENTE
            // =========================
            let clienteEmEdicao = null;

            function nomeDaRota(numero) {

                const rotas = {
                    "1": "Adaúfe",
                    "2": "Braga Este",
                    "3": "Braga Estádio",
                    "4": "Braga 1",
                    "5": "Braga 2",
                    "6": "Vieira do Minho",
                    "7": "Póvoa de Lanhoso 1",
                    "8": "Póvoa de Lanhoso 2",
                    "9": "Amares",
                    "10": "Terras de Bouro",
                    "11": "Caldelas",
                    "12": "Vila Verde 1",
                    "13": "Vila Verde 2",
                    "14": "Vila Verde 3",
                    "15": "Vila Verde 4",
                    "16": "Ponte de Lima"
                };

                return rotas[numero];
            }

            function editarCliente(codigo) {

                const clientes =
                    JSON.parse(
                        localStorage.getItem("clientes")
                    ) || [];


                const cliente =
                    clientes.find(
                        function (cliente) {

                            return (
                                cliente.codigo === codigo
                            );

                        }
                    );


                if (!cliente) {

                    alert(
                        "Cliente não encontrado."
                    );

                    return;

                }


                clienteEmEdicao =
                    codigo;


                document
                    .querySelector(".formulario")
                    .classList.add(
                        "editando"
                    );


                document
                    .getElementById(
                        "tituloFormulario"
                    )
                    .textContent =
                    "Editar cliente";


                document
                    .getElementById(
                        "botaoFormulario"
                    )
                    .textContent =
                    "Atualizar cliente";


                /* =========================================
                   PREENCHER CAMPOS
                ========================================= */

                document
                    .getElementById("codigo")
                    .value =
                    cliente.codigo || "";


                document
                    .getElementById("nome")
                    .value =
                    cliente.nome || "";


                document
                    .getElementById("endereco")
                    .value =
                    cliente.endereco || "";


                document
                    .getElementById("latitude")
                    .value =
                    cliente.latitude ?? "";


                document
                    .getElementById("longitude")
                    .value =
                    cliente.longitude ?? "";


                document
                    .getElementById("rota")
                    .value =
                    cliente.rota || "";

                if (
                    cliente.latitude != null &&
                    cliente.longitude != null
                ) {

                    mostrarClienteNoMapa(
                        cliente.latitude,
                        cliente.longitude
                    );

                }

            }

            function excluirCliente(codigo) {

                const confirmar = confirm(
                    "Tem certeza que deseja excluir este cliente?"
                );

                if (!confirmar) {
                    return;
                }

                let clientes =
                    JSON.parse(localStorage.getItem("clientes")) || [];

                clientes = clientes.filter(function (cliente) {
                    return cliente.codigo !== codigo;
                });

                localStorage.setItem(
                    "clientes",
                    JSON.stringify(clientes)
                );

                alert("Cliente excluído com sucesso!");

                pesquisarClientes();
                atualizarResumoClientes();
            }

            /* =========================================
   LOCALIZAR ENDEREÇO DO CLIENTE
========================================= */

            async function localizarEnderecoCliente() {

                const endereco =
                    document
                        .getElementById("endereco")
                        .value
                        .trim();


                if (endereco === "") {

                    alert(
                        "Digite primeiro o endereço do cliente."
                    );

                    return;

                }


                const botao =
                    document.querySelector(
                        ".botao-localizar-endereco"
                    );


                const textoOriginal =
                    botao.textContent;


                try {

                    botao.disabled =
                        true;

                    botao.textContent =
                        "🔎 Localizando...";


                    const url =
                        "https://nominatim.openstreetmap.org/search" +
                        "?format=json" +
                        "&limit=1" +
                        "&countrycodes=pt" +
                        "&q=" +
                        encodeURIComponent(
                            endereco
                        );


                    const resposta =
                        await fetch(url);


                    if (!resposta.ok) {

                        throw new Error(
                            "Erro ao consultar endereço."
                        );

                    }


                    const resultados =
                        await resposta.json();


                    if (
                        !resultados ||
                        resultados.length === 0
                    ) {

                        alert(
                            "Não foi possível localizar esse endereço."
                        );

                        return;

                    }


                    const resultado =
                        resultados[0];


                    document
                        .getElementById("latitude")
                        .value =
                        Number(
                            resultado.lat
                        );


                    document
                        .getElementById("longitude")
                        .value =
                        Number(
                            resultado.lon
                        );


                    /* MOSTRAR LOCALIZAÇÃO NO MINI MAPA */

                    mostrarClienteNoMapa(
                        resultado.lat,
                        resultado.lon
                    );


                    alert(
                        "Endereço localizado com sucesso!"
                    );

                }
                catch (erro) {

                    console.error(
                        erro
                    );


                    alert(
                        "Não foi possível localizar o endereço neste momento."
                    );

                }
                finally {

                    botao.disabled =
                        false;

                    botao.textContent =
                        textoOriginal;

                }

            }

            function cadastrarCliente() {

                let clientes =
                    JSON.parse(
                        localStorage.getItem("clientes")
                    ) || [];


                const codigo =
                    document
                        .getElementById("codigo")
                        .value
                        .trim();

                const nome =
                    document
                        .getElementById("nome")
                        .value
                        .trim();

                const endereco =
                    document
                        .getElementById("endereco")
                        .value
                        .trim();

                const latitudeTexto =
                    document
                        .getElementById("latitude")
                        .value
                        .trim();

                const longitudeTexto =
                    document
                        .getElementById("longitude")
                        .value
                        .trim();

                const rota =
                    document
                        .getElementById("rota")
                        .value;


                /* =========================================
                   VALIDAR CAMPOS
                ========================================= */

                if (
                    codigo === "" ||
                    nome === "" ||
                    endereco === "" ||
                    latitudeTexto === "" ||
                    longitudeTexto === "" ||
                    rota === ""
                ) {

                    alert(
                        "Preencha todos os campos."
                    );

                    return;
                }


                const latitude =
                    Number(latitudeTexto);

                const longitude =
                    Number(longitudeTexto);


                /* =========================================
                   VALIDAR COORDENADAS
                ========================================= */

                if (
                    !Number.isFinite(latitude) ||
                    !Number.isFinite(longitude)
                ) {

                    alert(
                        "Latitude ou longitude inválida."
                    );

                    return;
                }


                if (
                    latitude < -90 ||
                    latitude > 90
                ) {

                    alert(
                        "A latitude deve estar entre -90 e 90."
                    );

                    return;
                }


                if (
                    longitude < -180 ||
                    longitude > 180
                ) {

                    alert(
                        "A longitude deve estar entre -180 e 180."
                    );

                    return;
                }


                /* =========================================
                   CRIAR CLIENTE
                ========================================= */

                const novoCliente = {

                    codigo: codigo,

                    nome: nome,

                    endereco: endereco,

                    rota: rota,

                    latitude: latitude,

                    longitude: longitude

                };


                /* =========================================
                   CADASTRAR / ATUALIZAR
                ========================================= */

                if (clienteEmEdicao !== null) {

                    const indice =
                        clientes.findIndex(
                            function (cliente) {

                                return (
                                    cliente.codigo ===
                                    clienteEmEdicao
                                );

                            }
                        );


                    if (indice !== -1) {

                        clientes[indice] =
                            novoCliente;

                    }

                } else {

                    clientes.push(
                        novoCliente
                    );

                }


                /* =========================================
                   SALVAR
                ========================================= */

                localStorage.setItem(
                    "clientes",
                    JSON.stringify(clientes)
                );


                /* =========================================
                   LIMPAR CAMPOS
                ========================================= */

                document
                    .getElementById("codigo")
                    .value = "";

                document
                    .getElementById("nome")
                    .value = "";

                document
                    .getElementById("endereco")
                    .value = "";

                document
                    .getElementById("latitude")
                    .value = "";

                document
                    .getElementById("longitude")
                    .value = "";

                document
                    .getElementById("rota")
                    .value = "";


                /* =========================================
                   MENSAGEM
                ========================================= */

                if (
                    clienteEmEdicao === null
                ) {

                    alert(
                        "Cliente cadastrado com sucesso!"
                    );

                } else {

                    alert(
                        "Cliente atualizado com sucesso!"
                    );

                }


                /* =========================================
                   TERMINAR EDIÇÃO
                ========================================= */

                clienteEmEdicao = null;


                document
                    .querySelector(".formulario")
                    .classList.remove(
                        "editando"
                    );


                document
                    .getElementById(
                        "tituloFormulario"
                    )
                    .textContent =
                    "Novo cliente";


                document
                    .getElementById(
                        "botaoFormulario"
                    )
                    .textContent =
                    "Cadastrar cliente";


                /* =========================================
                   FOCO
                ========================================= */

                document
                    .getElementById("codigo")
                    .focus();


                /* =========================================
                   ATUALIZAR ECRÃ
                ========================================= */

                pesquisarClientes();

                atualizarResumoClientes();

            }


            // =========================
            // PESQUISAR CLIENTES
            // =========================

            function pesquisarClientes() {

                const texto =
                    document.getElementById("pesquisa").value
                        .trim()
                        .toLowerCase();

                const filtroRota =
                    document.getElementById("filtroRota").value;

                const lista =
                    document.getElementById("listaClientes");


                const clientes =
                    JSON.parse(localStorage.getItem("clientes")) || [];


                const clientesFiltrados =
                    clientes.filter(function (cliente) {

                        const correspondeTexto =
                            texto === "" ||
                            cliente.codigo.toLowerCase().includes(texto) ||
                            cliente.nome.toLowerCase().includes(texto) ||
                            cliente.endereco.toLowerCase().includes(texto) ||
                            cliente.rota.toLowerCase().includes(texto) ||
                            nomeDaRota(cliente.rota).toLowerCase().includes(texto);

                        const correspondeRota =
                            filtroRota === "" ||
                            cliente.rota === filtroRota;

                        return correspondeTexto && correspondeRota;

                    });


                // Nenhum resultado

                if (clientesFiltrados.length === 0) {

                    lista.innerHTML = `
    <div class="mensagem-vazia">
        <strong>Nenhum cliente encontrado</strong>
        <span>
            Tente outro código, nome ou rota.
        </span>
    </div>
`;

                    return;
                }


                // Mostra os resultados

                lista.innerHTML = "";


                clientesFiltrados.forEach(function (cliente) {

                    lista.innerHTML += `
    <div class="cliente">

        <div class="cliente-cabecalho">

    <strong>
        ${cliente.nome}
    </strong>

    <span class="cliente-codigo">
    ${cliente.codigo}
    </span>

</div>

<div class="cliente-info">

    <span>
    📍 ${cliente.endereco}
</span>

    <span class="cliente-rota">
    🗺️ Rota ${cliente.rota} — ${nomeDaRota(cliente.rota)}
</span>

</div>

        <div class="acoes-cliente">

    <button
        class="btn-editar"
        onclick="editarCliente('${cliente.codigo}')"
    >
        ✏️ Editar
    </button>

    <button
        class="btn-excluir"
        onclick="excluirCliente('${cliente.codigo}')"
    >
        🗑️ Excluir
    </button>

</div>

    </div>
`;

                });

            }

            function atualizarResumoClientes() {

                const clientes =
                    JSON.parse(localStorage.getItem("clientes")) || [];

                const rotasUtilizadas =
                    new Set();

                clientes.forEach(function (cliente) {

                    if (cliente.rota) {
                        rotasUtilizadas.add(cliente.rota);
                    }

                });

                const filtroRota =
                    document.getElementById("filtroRota").value;

                const clientesNaRota =
                    filtroRota === ""
                        ? clientes.length
                        : clientes.filter(function (cliente) {
                            return cliente.rota === filtroRota;
                        }).length;

                document.getElementById("resumoClientes").innerHTML = `

        <div class="indicador-cliente">

            <strong>
                ${clientes.length}
            </strong>

            <span>
                clientes cadastrados
            </span>

        </div>


        <div class="indicador-cliente">

            <strong>
                ${rotasUtilizadas.size} / 16
            </strong>

            <span>
                rotas utilizadas
            </span>

        </div>


        <div class="indicador-cliente">

            <strong>
                ${clientesNaRota}
            </strong>

            <span>
                ${filtroRota === "" ? "todos os clientes" : "clientes em distribuição"}
            </span>

        </div>

    `;
            }

            atualizarResumoClientes();

        </script>

    </main>

    <script>

        fetch("menu.html")
            .then(function (resposta) {
                return resposta.text();
            })
            .then(function (menu) {

                document.getElementById("menu-container").innerHTML = menu;

                const paginaAtual =
                    window.location.pathname.split("/").pop();

                document.querySelectorAll(".menu a").forEach(function (link) {

                    const paginaLink =
                        link.getAttribute("href");

                    if (paginaLink === paginaAtual) {
                        link.classList.add("ativo");
                    }

                });

            });

    </script>

</body>
