<!DOCTYPE html>
<html lang="pt">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Planeamento de Missões - PRIMO PEÇAS</title>
    <link rel="stylesheet" href="layout-global.css">

    <style>
        /* ================================
   MODO DE PLANEAMENTO DA MISSÃO
================================ */

        .modo-planeamento {
            margin: 20px 0;
        }

        .modo-planeamento h3 {
            margin: 0 0 10px;
            color: #0f172a;
            font-size: 14px;
            font-weight: 700;
        }

        .opcoes-planeamento {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
            max-width: 620px;
        }

        .opcao-planeamento {
            position: relative;
            cursor: pointer;
        }

        .opcao-planeamento input {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }

        .opcao-planeamento-conteudo {
            display: flex;
            align-items: center;
            gap: 12px;

            min-height: 64px;
            padding: 12px 14px;

            border: 2px solid #e2e8f0;
            border-radius: 10px;

            background: #ffffff;

            transition:
                border-color .2s ease,
                background .2s ease,
                box-shadow .2s ease,
                transform .2s ease;
        }

        .opcao-planeamento-icone {
            display: flex;
            align-items: center;
            justify-content: center;

            width: 36px;
            height: 36px;
            flex-shrink: 0;

            border-radius: 9px;
            background: #f1f5f9;

            font-size: 18px;
        }

        .opcao-planeamento-conteudo>span:last-child {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .opcao-planeamento strong {
            color: #0f172a;
            font-size: 13px;
            font-weight: 800;
        }

        .opcao-planeamento small {
            color: #64748b;
            font-size: 11px;
            line-height: 1.3;
        }

        .opcao-planeamento:hover .opcao-planeamento-conteudo {
            border-color: #94a3b8;
            transform: translateY(-1px);
        }

        .opcao-planeamento input:checked+.opcao-planeamento-conteudo {
            border-color: #2563eb;
            background: #eff6ff;
            box-shadow:
                0 0 0 3px rgba(37, 99, 235, .08);
        }

        .opcao-planeamento input:checked+.opcao-planeamento-conteudo .opcao-planeamento-icone {
            background: #dbeafe;
        }

        /* ================================
   PRÉ-VISUALIZAÇÃO DA SEQUÊNCIA
================================ */

        .previsualizacao-ordem {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;

            margin-top: 12px;
            padding: 12px 14px;

            border: 1px solid #dbeafe;
            border-radius: 10px;

            background: #f8fbff;
        }

        .previsualizacao-ordem strong {
            color: #475569;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: .04em;
        }

        #textoPrevisualizacaoOrdem {
            color: #2563eb;
            font-size: 13px;
            font-weight: 800;
            line-height: 1.5;
        }

        #textoDistanciaMissao {
            display: block;
            width: 100%;
            margin-top: 6px;

            color: #475569;
            font-size: 12px;
            font-weight: 700;
        }

        /* ================================
   CABEÇALHO DO PLANEAMENTO
================================ */

        .cabecalho-planeamento {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;

            margin-bottom: 22px;
            padding: 22px 24px;

            border: 1px solid #1e293b;
            border-radius: 16px;

            background: #2A3B5D;

            box-shadow:
                0 10px 30px rgba(15, 23, 42, .12);
        }

        .cabecalho-planeamento-etiqueta {
            display: block;

            margin-bottom: 7px;

            color: #60a5fa;

            font-size: 10px;
            font-weight: 800;
            letter-spacing: .12em;
        }

        .cabecalho-planeamento h1 {
            margin: 0;

            color: #ffffff;

            font-size: 25px;
            font-weight: 800;
            line-height: 1.2;
        }

        .cabecalho-planeamento p {
            max-width: 620px;

            margin: 8px 0 0;

            color: #94a3b8;

            font-size: 13px;
            line-height: 1.5;
        }

        .cabecalho-planeamento-status {
            display: flex;
            align-items: center;
            gap: 8px;

            flex-shrink: 0;

            padding: 8px 12px;

            border: 1px solid rgba(34, 197, 94, .25);
            border-radius: 999px;

            background: rgba(34, 197, 94, .08);

            color: #86efac;

            font-size: 11px;
            font-weight: 700;
        }

        .ponto-status {
            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: #22c55e;

            box-shadow:
                0 0 0 4px rgba(34, 197, 94, .10);
        }

        .ponto-status-rotas.status-rotas-aguardando {
            background: #94a3b8;

            box-shadow:
                0 0 0 3px rgba(148, 163, 184, .15);
        }

        .ponto-status-rotas.status-rotas-andamento {
            background: #3b82f6;

            box-shadow:
                0 0 0 3px rgba(59, 130, 246, .15);
        }

        .ponto-status-rotas.status-rotas-pronta {
            background: #22c55e;

            box-shadow:
                0 0 0 3px rgba(34, 197, 94, .15);
        }

        /* ================================
   CARTÕES DAS ROTAS
================================ */

        .card-rota {
            display: flex;
            align-items: center;
            gap: 14px;

            margin-bottom: 10px;
            padding: 14px 16px;

            border: 1px solid #e2e8f0;
            border-radius: 12px;

            background: #ffffff;

            cursor: pointer;

            transition:
                transform .2s ease,
                border-color .2s ease,
                box-shadow .2s ease,
                background .2s ease;
        }

        .card-rota:hover {
            transform: translateY(-2px);

            border-color: #93c5fd;

            background: #f8fbff;

            box-shadow:
                0 8px 20px rgba(15, 23, 42, .08);
        }

        .card-rota-icone {
            display: flex;
            align-items: center;
            justify-content: center;

            width: 42px;
            height: 42px;
            flex-shrink: 0;

            border-radius: 10px;

            background: #eff6ff;

            font-size: 19px;
        }

        .card-rota-info {
            display: flex;
            flex: 1;
            flex-direction: column;
            gap: 3px;
        }

        .card-rota-codigo {
            color: #2563eb;

            font-size: 10px;
            font-weight: 800;
            letter-spacing: .08em;
        }

        .card-rota-info strong {
            color: #0f172a;

            font-size: 14px;
            font-weight: 800;
        }

        .card-rota-info small {
            color: #64748b;

            font-size: 11px;
            font-weight: 600;
        }

        .card-rota-acao {
            display: flex;
            align-items: center;
            justify-content: center;

            width: 30px;
            height: 30px;
            flex-shrink: 0;

            border-radius: 8px;

            background: #f1f5f9;
            color: #475569;

            font-size: 22px;
            font-weight: 700;

            transition:
                background .2s ease,
                color .2s ease,
                transform .2s ease;
        }

        .card-rota:hover .card-rota-acao {
            background: #2563eb;
            color: #ffffff;

            transform: translateX(2px);
        }

        /* ================================
   RESUMO DO PLANEAMENTO
================================ */

        .resumo-planeamento {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;

            margin-bottom: 24px;
            padding: 16px 18px;

            border: 1px solid #e2e8f0;
            border-radius: 14px;

            background: #ffffff;

            box-shadow: 0 4px 16px rgba(15, 23, 42, .05);
        }

        .resumo-planeamento-info {
            display: flex;
            align-items: center;
            gap: 13px;
        }

        .resumo-planeamento-icone {
            display: flex;
            align-items: center;
            justify-content: center;

            width: 46px;
            height: 46px;
            flex-shrink: 0;

            border-radius: 11px;

            background: #eff6ff;

            font-size: 20px;
        }

        .resumo-planeamento-info>div:last-child {
            display: grid;
            grid-template-columns: auto 1fr;
            align-items: center;
            column-gap: 8px;
        }

        .resumo-planeamento-rotulo {
            grid-column: 1 / -1;

            margin-bottom: 2px;

            color: #64748b;

            font-size: 9px;
            font-weight: 800;
            letter-spacing: .09em;
        }

        #contadorSelecionados {
            color: #0f172a;

            font-size: 22px;
            font-weight: 900;
            line-height: 1;
        }

        .resumo-planeamento-info small {
            color: #64748b;

            font-size: 11px;
            font-weight: 600;
        }

        /* BOTÃO CRIAR MISSÃO */

        .botao-criar-missao {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;

            min-height: 40px;
            padding: 0 17px;

            border: 0;
            border-radius: 9px;

            background: #2563eb;
            color: #EF7F1A;

            font-size: 12px;
            font-weight: 800;

            cursor: pointer;

            box-shadow: 0 5px 14px rgba(37, 99, 235, .20);

            transition:
                background .2s ease,
                transform .2s ease,
                box-shadow .2s ease;
        }

        .botao-criar-missao:hover:not(:disabled) {
            background: #1d4ed8;
            transform: translateY(-1px);

            box-shadow: 0 7px 18px rgba(37, 99, 235, .26);
        }

        .botao-criar-missao:disabled {
            background: #cbd5e1;
            color: #64748b;

            box-shadow: none;

            cursor: not-allowed;
        }

        .botao-resumo-missao {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;

            min-height: 34px;
            padding: 0 11px;

            border: 1px solid #cbd5e1;
            border-radius: 8px;

            background: #ffffff;
            color: #334155;

            font-size: 10px;
            font-weight: 800;

            cursor: pointer;
            transition:
                border-color .2s ease,
                background .2s ease,
                color .2s ease;
        }

        .botao-resumo-missao:hover:not(:disabled) {
            border-color: #93c5fd;
            background: #f8fbff;
            color: #1d4ed8;
        }

        .botao-resumo-missao:disabled {
            opacity: .45;
            cursor: not-allowed;
        }

        /* TÍTULO DAS ROTAS */

        .titulo-rotas-disponiveis {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 20px;

            margin: 0 2px 13px;
        }

        .titulo-rotas-disponiveis span {
            display: block;

            margin-bottom: 3px;

            color: #2563eb;

            font-size: 9px;
            font-weight: 800;
            letter-spacing: .1em;
        }

        .titulo-rotas-disponiveis h2 {
            margin: 0;

            color: #0f172a;

            font-size: 18px;
            font-weight: 800;
        }

        .titulo-rotas-disponiveis small {
            color: #64748b;

            font-size: 11px;
        }

        /* ================================
             GRADE DAS ROTAS
        ================================ */

        .grade-rotas {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 10px;
        }

        /* ================================
   GRADE DAS ROTAS
================================ */

        .grade-rotas {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 10px;
        }

        .grade-rotas .card-rota {
            margin-bottom: 0;
        }

        /* ================================
   CABEÇALHO MAIS COMPACTO
================================ */

        .cabecalho-planeamento {
            margin-bottom: 14px;
            padding: 13px 18px;
            border-radius: 12px;
        }

        .cabecalho-planeamento-etiqueta {
            margin-bottom: 3px;
            font-size: 9px;
        }

        .cabecalho-planeamento h1 {
            font-size: 21px;
            line-height: 1.15;
        }

        .cabecalho-planeamento p {
            margin-top: 4px;
            font-size: 11px;
            line-height: 1.35;
        }

        .cabecalho-planeamento-status {
            padding: 6px 10px;
            font-size: 10px;
        }

        /* ================================
   RESUMO DA SELEÇÃO MAIS COMPACTO
================================ */

        .resumo-planeamento {
            margin-bottom: 14px;
            padding: 10px 14px;
            border-radius: 11px;
        }

        .resumo-planeamento-info {
            gap: 10px;
        }

        .resumo-planeamento-icone {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            font-size: 17px;
        }

        .resumo-planeamento-rotulo {
            margin-bottom: 1px;
            font-size: 8px;
        }

        #contadorSelecionados {
            font-size: 19px;
        }

        .resumo-planeamento-info small {
            font-size: 10px;
        }

        .botao-criar-missao {
            min-height: 34px;
            padding: 0 14px;
            font-size: 11px;
        }

        /* ================================
            FUNDO PADRÃO DO SISTEMA
        ================================ */

        body {
            background: #f4f8fc;
            font-family: Arial, Helvetica, sans-serif;
        }

        /* ================================
   AÇÕES DO PLANEAMENTO
================================ */

        .acoes-planeamento {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* BOTÃO PONTOS SELECIONADOS */

        .botao-pontos-selecionados {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;

            min-height: 34px;
            padding: 0 12px;

            border: 1px solid #bfdbfe;
            border-radius: 9px;

            background: #eff6ff;
            color: #1d4ed8;

            font-size: 11px;
            font-weight: 800;

            cursor: pointer;

            transition:
                background .2s ease,
                border-color .2s ease,
                transform .2s ease;
        }

        .botao-pontos-selecionados strong {
            display: flex;
            align-items: center;
            justify-content: center;

            min-width: 20px;
            height: 20px;
            padding: 0 5px;

            border-radius: 999px;

            background: #2563eb;
            color: #ffffff;

            font-size: 10px;
        }

        .botao-pontos-selecionados:hover:not(:disabled) {
            background: #dbeafe;
            border-color: #93c5fd;
            transform: translateY(-1px);
        }

        .botao-pontos-selecionados:disabled {
            background: #f8fafc;
            border-color: #e2e8f0;
            color: #94a3b8;

            cursor: not-allowed;
        }

        .botao-pontos-selecionados:disabled strong {
            background: #cbd5e1;
        }

        /* ================================
   MODAL DE PONTOS SELECIONADOS
================================ */

        .modal-pontos {
            position: fixed;
            inset: 0;

            display: none;
            align-items: center;
            justify-content: center;

            padding: 20px;

            background: rgba(15, 23, 42, .45);

            z-index: 9999;
        }

        .modal-pontos.aberto {
            display: flex;
        }

        .modal-pontos-conteudo {
            width: min(520px, 100%);
            max-height: 70vh;

            overflow: hidden;

            border: 1px solid #dbeafe;
            border-radius: 16px;

            background: #ffffff;

            box-shadow:
                0 20px 60px rgba(15, 23, 42, .20);
        }

        .modal-pontos-cabecalho {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;

            padding: 16px 18px;

            border-bottom: 1px solid #e2e8f0;

            background: #f8fbff;
        }

        .modal-pontos-etiqueta {
            display: block;

            margin-bottom: 3px;

            color: #2563eb;

            font-size: 9px;
            font-weight: 800;
            letter-spacing: .1em;
        }

        .modal-pontos-cabecalho h3 {
            margin: 0;

            color: #0f172a;

            font-size: 16px;
            font-weight: 800;
        }

        .modal-resumo-missao {
            position: fixed;
            inset: 0;

            display: none;
            align-items: center;
            justify-content: center;

            padding: 20px;

            background: rgba(15, 23, 42, .45);

            z-index: 2000;
        }

        .modal-resumo-missao.aberto {
            display: flex;
        }

        .conteudo-resumo-missao {
            width: min(680px, 100%);
            max-height: 85vh;
            overflow-y: auto;

            padding: 18px;

            border-radius: 14px;

            background: #ffffff;

            box-shadow: 0 20px 50px rgba(15, 23, 42, .18);
        }

        .cabecalho-resumo-missao {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;

            margin-bottom: 14px;
        }

        .cabecalho-resumo-missao span {
            display: block;

            margin-bottom: 3px;

            color: #2563eb;

            font-size: 8px;
            font-weight: 900;
            letter-spacing: .1em;
        }

        .cabecalho-resumo-missao h3 {
            margin: 0;

            color: #0f172a;

            font-size: 18px;
            font-weight: 900;
        }

        .botao-fechar-resumo {
            width: 30px;
            height: 30px;

            border: 0;
            border-radius: 8px;

            background: #f1f5f9;
            color: #475569;

            font-size: 18px;
            font-weight: 800;

            cursor: pointer;
        }

        .grade-resumo-missao {
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            gap: 8px;
        }

        .card-resumo-missao {
            padding: 10px;

            border: 1px solid #e2e8f0;
            border-radius: 9px;

            background: #f8fafc;
        }

        .card-resumo-missao span {
            display: block;

            margin-bottom: 4px;

            color: #64748b;

            font-size: 8px;
            font-weight: 800;
        }

        .card-resumo-missao strong {
            color: #0f172a;

            font-size: 11px;
            font-weight: 900;
        }

        .sequencia-resumo-missao {
            margin-top: 12px;
            padding: 11px;

            border: 1px solid #dbeafe;
            border-radius: 9px;

            background: #eff6ff;
        }

        .sequencia-resumo-missao span {
            display: block;

            margin-bottom: 4px;

            color: #2563eb;

            font-size: 8px;
            font-weight: 900;
        }

        .sequencia-resumo-missao strong {
            color: #1e3a8a;

            font-size: 10px;
            font-weight: 800;
        }

        @media (max-width: 700px) {
            .grade-resumo-missao {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        .botao-fechar-modal {
            display: flex;
            align-items: center;
            justify-content: center;

            width: 32px;
            height: 32px;

            border: 0;
            border-radius: 8px;

            background: #e2e8f0;
            color: #475569;

            font-size: 20px;
            font-weight: 700;

            cursor: pointer;
        }

        .botao-fechar-modal:hover {
            background: #cbd5e1;
        }

        .lista-pontos-selecionados {
            max-height: 50vh;

            overflow-y: auto;

            padding: 10px;
        }

        .item-ponto-selecionado {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;

            padding: 11px 12px;

            border-bottom: 1px solid #eef2f7;
        }

        .item-ponto-selecionado:last-child {
            border-bottom: 0;
        }

        .item-ponto-info {
            display: flex;
            align-items: center;
            gap: 9px;
        }

        .item-ponto-info strong {
            padding: 4px 7px;

            border-radius: 6px;

            background: #eff6ff;
            color: #2563eb;

            font-size: 10px;
            font-weight: 800;
        }

        .item-ponto-info span {
            color: #0f172a;

            font-size: 12px;
            font-weight: 700;
        }

        .item-ponto-info small {
            color: #64748b;
            font-size: 9px;
            font-weight: 700;
        }

        .botao-remover-ponto {
            padding: 6px 10px;

            border: 1px solid #fecaca;
            border-radius: 7px;

            background: #fff1f2;
            color: #dc2626;

            font-size: 10px;
            font-weight: 800;

            cursor: pointer;
        }

        .botao-remover-ponto:hover {
            background: #fee2e2;
        }

        /* ================================
   CABEÇALHO DA ROTA ABERTA
================================ */

        .cabecalho-rota-aberta {
            display: flex;
            align-items: center;
            gap: 14px;

            margin-bottom: 14px;
            padding: 10px 12px;

            border: 1px solid #dbeafe;
            border-radius: 12px;

            background: #ffffff;

            box-shadow:
                0 4px 14px rgba(15, 23, 42, .05);
        }

        .botao-voltar-rotas {
            min-height: 34px;
            padding: 0 11px;

            border: 1px solid #cbd5e1;
            border-radius: 8px;

            background: #f8fafc;
            color: #475569;

            font-size: 11px;
            font-weight: 800;

            cursor: pointer;
        }

        .botao-voltar-rotas:hover {
            background: #f1f5f9;
        }

        .cabecalho-rota-info {
            display: flex;
            flex: 1;
            flex-direction: column;
            gap: 1px;
        }

        .cabecalho-rota-etiqueta {
            color: #2563eb;

            font-size: 9px;
            font-weight: 800;
            letter-spacing: .1em;
        }

        .cabecalho-rota-info h2 {
            margin: 0;

            color: #0f172a;

            font-size: 17px;
            font-weight: 800;
        }

        .cabecalho-rota-selecao {
            display: flex;
            align-items: center;
            gap: 8px;

            padding: 6px 9px;

            border-radius: 9px;

            background: #eff6ff;
        }

        .cabecalho-rota-selecao span {
            color: #64748b;

            font-size: 10px;
            font-weight: 700;
        }

        .cabecalho-rota-selecao strong {
            display: flex;
            align-items: center;
            justify-content: center;

            min-width: 22px;
            height: 22px;

            border-radius: 999px;

            background: #2563eb;
            color: #ffffff;

            font-size: 10px;
            font-weight: 800;
        }

        /* ================================
   ORDEM DA MISSÃO COMPACTA
================================ */

        .modo-planeamento {
            margin: 10px 0;
            padding: 10px 12px;

            border: 1px solid #e2e8f0;
            border-radius: 12px;

            background: #ffffff;

            box-shadow:
                0 4px 14px rgba(15, 23, 42, .04);
        }

        .modo-planeamento h3 {
            margin: 0 0 7px;

            font-size: 12px;
        }

        /* OPÇÕES MANUAL / OTIMIZADA */

        .opcoes-planeamento {
            grid-template-columns: repeat(2, minmax(0, 1fr));

            max-width: none;
            gap: 8px;
        }

        .opcao-planeamento-conteudo {
            min-height: 44px;

            padding: 7px 10px;

            border-radius: 8px;
        }

        .opcao-planeamento-icone {
            width: 30px;
            height: 30px;

            border-radius: 7px;

            font-size: 15px;
        }

        .opcao-planeamento strong {
            font-size: 11px;
        }

        .opcao-planeamento small {
            font-size: 9px;
        }

        /* PRÉ-VISUALIZAÇÃO DA SEQUÊNCIA */

        .previsualizacao-ordem {
            margin-top: 8px;
            padding: 8px 10px;

            border-radius: 8px;
        }

        .previsualizacao-ordem strong {
            font-size: 9px;
        }

        #textoPrevisualizacaoOrdem {
            font-size: 11px;
        }

        #textoDistanciaMissao {
            width: auto;

            margin-top: 0;
            margin-left: auto;

            font-size: 10px;
        }

        /* ================================
   AÇÕES DA ORDEM DA MISSÃO
================================ */

        .opcoes-planeamento {
            grid-template-columns:
                minmax(0, 1fr) minmax(0, 1fr) auto;

            align-items: stretch;
        }

        .botao-criar-missao-planeamento {
            min-width: 130px;
            min-height: 44px;

            align-self: stretch;

            padding: 0 16px;

            border-radius: 8px;
        }

        /* ================================
   PAINEL DE CLIENTES DA ROTA
================================ */

        .painel-clientes-rota {
            margin-top: 10px;
            padding: 12px;

            border: 1px solid #dbeafe;
            border-radius: 12px;

            background: #ffffff;

            box-shadow:
                0 4px 14px rgba(15, 23, 42, .04);
        }

        .cabecalho-clientes-rota {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;

            margin-bottom: 9px;
        }

        .cabecalho-clientes-etiqueta {
            display: block;

            margin-bottom: 2px;

            color: #2563eb;

            font-size: 8px;
            font-weight: 800;
            letter-spacing: .1em;
        }

        .cabecalho-clientes-rota h3 {
            margin: 0;

            color: #0f172a;

            font-size: 14px;
            font-weight: 800;
        }

        .total-clientes-rota {
            padding: 5px 8px;

            border-radius: 999px;

            background: #eff6ff;
            color: #2563eb;

            font-size: 9px;
            font-weight: 800;
        }

        /* BUSCA */

        .busca-clientes-rota {
            display: flex;
            align-items: center;
            gap: 8px;

            margin-bottom: 10px;
            padding: 0 11px;

            min-height: 38px;

            border: 1px solid #cbd5e1;
            border-radius: 9px;

            background: #f8fafc;
        }

        .busca-clientes-rota:focus-within {
            border-color: #2563eb;

            box-shadow:
                0 0 0 3px rgba(37, 99, 235, .08);
        }

        .busca-clientes-icone {
            font-size: 14px;
        }

        .busca-clientes-rota input {
            width: 100%;

            border: 0;
            outline: none;

            background: transparent;

            color: #0f172a;

            font-size: 11px;
            font-weight: 600;
        }

        /* ÁREA DOS CARDS */

        .cards-clientes-rota {
            display: grid;

            grid-template-columns:
                repeat(5, minmax(0, 1fr));

            gap: 8px;
        }

        /* ================================
   CARDS DOS CLIENTES
================================ */

        .card-cliente-rota {
            position: relative;

            display: flex;
            flex-direction: column;
            gap: 4px;

            min-width: 0;
            padding: 9px 10px;

            border: 1px solid #e2e8f0;
            border-radius: 9px;

            background: #ffffff;

            cursor: pointer;

            transition:
                border-color .2s ease,
                background .2s ease,
                transform .2s ease,
                box-shadow .2s ease;
        }

        .card-cliente-rota:hover {
            border-color: #93c5fd;
            background: #f8fbff;
            transform: translateY(-1px);
        }

        .card-cliente-rota input {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }

        .card-cliente-topo {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .card-cliente-codigo {
            color: #2563eb;

            font-size: 9px;
            font-weight: 900;
            letter-spacing: .05em;
        }

        .card-cliente-check {
            display: flex;
            align-items: center;
            justify-content: center;

            width: 18px;
            height: 18px;

            border: 1px solid #cbd5e1;
            border-radius: 5px;

            color: transparent;

            font-size: 10px;
            font-weight: 900;
        }

        .card-cliente-nome {
            overflow: hidden;

            color: #0f172a;

            font-size: 11px;
            font-weight: 800;

            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .card-cliente-rota {
            color: #64748b;

            font-size: 9px;
            font-weight: 700;
        }

        /* CLIENTE SELECIONADO */

        .card-cliente-rota:has(input:checked) {
            border-color: #2563eb;
            background: #eff6ff;

            box-shadow:
                0 0 0 2px rgba(37, 99, 235, .07);
        }

        .card-cliente-rota:has(input:checked) .card-cliente-check {
            border-color: #2563eb;
            background: #2563eb;
            color: #ffffff;
        }

        /* ================================
   MÉTRICAS DA MISSÃO
================================ */

        .metricas-missao {
            display: flex;
            align-items: center;
            gap: 8px;

            margin-left: auto;
        }

        #textoDistanciaMissao,
        #textoTempoMissao {
            width: auto;
            margin: 0;

            padding: 5px 8px;

            border-radius: 7px;

            background: #f1f5f9;
            color: #475569;

            font-size: 9px;
            font-weight: 800;

            white-space: nowrap;
        }

        /* ================================
   DETALHES DOS CARDS DOS CLIENTES
================================ */

        .card-cliente-endereco {
            overflow: hidden;

            color: #64748b;

            font-size: 9px;
            font-weight: 600;

            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .card-cliente-rodape {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;

            margin-top: 3px;
            padding-top: 5px;

            border-top: 1px solid #eef2f7;
        }

        .card-cliente-coordenadas {
            overflow: hidden;

            color: #94a3b8;

            font-size: 8px;
            font-weight: 700;

            white-space: nowrap;
            text-overflow: ellipsis;
        }

        /* ================================
   AÇÕES DOS CLIENTES DA ROTA
================================ */

        .acoes-clientes-rota {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .botao-ver-clientes {
            min-height: 27px;
            padding: 0 9px;

            border: 1px solid #bfdbfe;
            border-radius: 7px;

            background: #eff6ff;
            color: #1d4ed8;

            font-size: 9px;
            font-weight: 800;

            cursor: pointer;

            transition:
                background .2s ease,
                border-color .2s ease;
        }

        .botao-ver-clientes:hover {
            border-color: #93c5fd;
            background: #dbeafe;
        }

        /* ================================
   ÁREA ROLÁVEL DOS CLIENTES
================================ */

        .cards-clientes-rota {
            max-height: 245px;
            overflow-y: auto;
            overflow-x: hidden;

            padding: 3px 4px 3px 3px;

            scrollbar-width: thin;
            scrollbar-color: #cbd5e1 transparent;
        }

        /* Scrollbar - Chrome / Edge */

        .cards-clientes-rota::-webkit-scrollbar {
            width: 6px;
        }

        .cards-clientes-rota::-webkit-scrollbar-track {
            background: transparent;
        }

        .cards-clientes-rota::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 999px;
        }

        .cards-clientes-rota::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* ================================
   CLIENTES — MODO COMPACTO
================================ */

        .card-cliente-rota {
            gap: 2px;
            padding: 7px 9px;
        }

        .card-cliente-topo {
            min-height: 18px;
        }

        .card-cliente-nome {
            font-size: 10px;
            line-height: 1.2;
        }

        .card-cliente-endereco {
            font-size: 8px;
            line-height: 1.25;
        }

        .card-cliente-rodape {
            margin-top: 2px;
            padding-top: 4px;
        }

        .card-cliente-coordenadas,
        .card-cliente-rota {
            font-size: 8px;
        }

        /* ================================
   SEQUÊNCIA VISUAL DA MISSÃO
================================ */

        #textoPrevisualizacaoOrdem {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 4px;
        }

        .chip-sequencia {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            min-height: 24px;
            padding: 0 7px;

            border: 1px solid #bfdbfe;
            border-radius: 6px;

            background: #eff6ff;
            color: #1d4ed8;

            font-size: 9px;
            font-weight: 900;
        }

        .chip-base {
            border-color: #cbd5e1;
            background: #f1f5f9;
            color: #334155;
        }

        .chip-com-tooltip {
            position: relative;
            cursor: help;
        }

        .chip-sequencia.primeiro-ponto {
            border-color: #86efac;
            background: #f0fdf4;
            color: #15803d;
        }

        .chip-sequencia.ultimo-ponto {
            border-color: #fde68a;
            background: #fffbeb;
            color: #a16207;
        }

        .tooltip-sequencia {
            position: absolute;
            left: 50%;
            bottom: calc(100% + 8px);

            display: flex;
            flex-direction: column;
            gap: 2px;

            min-width: 150px;
            padding: 7px 9px;

            border-radius: 7px;
            background: #0f172a;
            color: #ffffff;

            box-shadow: 0 6px 18px rgba(15, 23, 42, .18);

            opacity: 0;
            visibility: hidden;
            pointer-events: none;

            transform: translateX(-50%) translateY(4px);
            transition: opacity .15s ease, transform .15s ease;

            z-index: 100;
        }

        .tooltip-sequencia strong {
            color: #ffffff;
            font-size: 10px;
            font-weight: 800;
        }

        .tooltip-sequencia small {
            color: #cbd5e1;
            font-size: 8px;
            font-weight: 600;
            white-space: nowrap;
        }

        .chip-com-tooltip:hover .tooltip-sequencia {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }

        .seta-sequencia {
            color: #94a3b8;

            font-size: 11px;
            font-weight: 800;
        }

        /* ================================
   ESTADO DA SEQUÊNCIA
================================ */

        .indicador-sequencia-manual,
        .indicador-sequencia-otimizada {
            display: inline-flex;
            align-items: center;

            min-height: 24px;
            padding: 0 7px;

            border: 1px solid #bbf7d0;
            border-radius: 6px;

            background: #f0fdf4;
            color: #15803d;

            font-size: 8px;
            font-weight: 800;

            white-space: nowrap;
        }

        .indicador-sequencia-manual {
            border: 1px solid #cbd5e1;
            background: #f8fafc;
            color: #475569;
        }

        .indicador-sequencia-otimizada {
            border: 1px solid #bbf7d0;
            background: #f0fdf4;
            color: #15803d;
        }

        .item-ponto-cabecalho {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .item-ponto-ordem {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            min-width: 24px;
            height: 20px;
            padding: 0 5px;

            border-radius: 5px;
            background: #eff6ff;
            color: #2563eb;

            font-size: 9px;
            font-weight: 900;
        }

        .indicador-total-paragens {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            min-height: 24px;
            padding: 0 7px;

            border: 1px solid #dbeafe;
            border-radius: 6px;

            background: #f8fbff;
            color: #475569;

            font-size: 8px;
            font-weight: 800;

            white-space: nowrap;
        }

        .indicador-modo-modal {
            display: inline-flex;
            align-items: center;

            width: fit-content;
            margin-top: 5px;
            padding: 4px 7px;

            border-radius: 6px;

            font-size: 8px;
            font-weight: 800;
        }

        .indicador-modo-modal.manual {
            border: 1px solid #cbd5e1;
            background: #f8fafc;
            color: #475569;
        }

        .indicador-modo-modal.otimizado {
            border: 1px solid #bbf7d0;
            background: #f0fdf4;
            color: #15803d;
        }

        .titulo-pontos-selecionados {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .titulo-pontos-selecionados h3 {
            margin: 0;
        }

        .contador-pontos-modal {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            min-width: 24px;
            height: 24px;
            padding: 0 7px;

            border-radius: 999px;
            background: #eff6ff;
            color: #2563eb;

            font-size: 10px;
            font-weight: 900;
        }

        .chips-resumo-missao {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 4px;

            margin-top: 6px;
        }

        .chips-resumo-missao .chip-sequencia {
            min-height: 24px;

            display: inline-flex;
            align-items: center;
            justify-content: center;

            padding: 0 7px;

            line-height: 1;
            text-align: center;
        }

        .chips-resumo-missao .chip-sequencia:not(.chip-base) {
            min-width: 42px;
        }

        .chips-resumo-missao .chip-resumo-cliente {
            min-width: 58px;
            min-height: 24px;

            display: inline-flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            gap: 3px;
            padding: 3px 7px;

            line-height: 1;
        }

        .codigo-resumo-cliente {
            font-size: 9px;
            font-weight: 900;
            line-height: 1;
        }

        .nome-resumo-cliente {
            display: block;

            max-width: 90px;

            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;

            font-size: 7px;
            font-weight: 600;
            line-height: 1.15;

            opacity: .72;
        }

        .rodape-resumo-missao {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 8px;

            margin-top: 14px;
            padding-top: 12px;

            border-top: 1px solid #e2e8f0;
        }

        .botao-fechar-resumo-rodape,
        .botao-criar-resumo-missao {
            min-height: 34px;
            padding: 0 14px;

            border-radius: 8px;

            font-size: 10px;
            font-weight: 800;

            cursor: pointer;
        }

        .botao-fechar-resumo-rodape {
            border: 1px solid #cbd5e1;

            background: #ffffff;
            color: #475569;
        }

        .botao-fechar-resumo-rodape:hover {
            background: #f8fafc;
            border-color: #94a3b8;
        }

        .botao-criar-resumo-missao {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;

            border: 1px solid #2563eb;

            background: #2563eb;
            color: #ffffff;
        }

        .botao-criar-resumo-missao:hover {
            background: #1d4ed8;
            border-color: #1d4ed8;
        }

        .nota-configuracao-missao {
            margin-right: auto;

            color: #94a3b8;

            font-size: 8px;
            font-weight: 600;
            line-height: 1.2;
        }

        #statusSistemaRotas {
            display: inline-flex !important;
            align-items: center;
            justify-content: center;
            gap: 7px;

            min-height: 30px;
            padding: 0 11px;

            border: 1px solid rgba(255, 255, 255, .16);
            border-radius: 8px;

            background: rgba(255, 255, 255, .10);

            color: #ffffff !important;

            font-size: 9px;
            font-weight: 800;

            box-shadow:
                0 2px 8px rgba(15, 23, 42, .08);

            box-sizing: border-box;
        }

        #textoStatusRotas {
            color: #ffffff !important;
            white-space: nowrap;
        }

        #pontoStatusRotas {
            width: 7px !important;
            height: 7px !important;
            flex: 0 0 7px;

            border-radius: 50%;
        }

        .botao-criar-missao {
            color: #ffffff;
        }

        .botao-criar-missao .icone-drone-menu {
            color: #EF7F1A;
        }

        .botao-criar-resumo-missao .icone-drone-menu {
            color: #EF7F1A;
        }

        #conteudo {
            min-width: 0;
            padding: 16px;
            margin-top: 50px;
            box-sizing: border-box;
        }

        @media (min-width: 769px) {
            #conteudo {
                margin-left: 185px;
            }
        }

        /* Em ecrãs menores */

        @media (max-width: 700px) {

            .cards-clientes-rota {
                max-height: 360px;
            }
        }

        @media (max-width: 700px) {

            .metricas-missao {
                width: 100%;

                margin-left: 0;

                flex-wrap: wrap;
            }
        }

        @media (max-width: 1100px) {

            .cards-clientes-rota {
                grid-template-columns:
                    repeat(3, minmax(0, 1fr));
            }
        }

        @media (max-width: 700px) {

            .cards-clientes-rota {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 700px) {

            .opcoes-planeamento {
                grid-template-columns: 1fr;
            }

            .botao-criar-missao-planeamento {
                width: 100%;
            }
        }

        /* MOBILE */

        @media (max-width: 600px) {

            .opcoes-planeamento {
                grid-template-columns: 1fr;
            }

            #textoDistanciaMissao {
                width: 100%;
                margin-left: 0;
            }
        }

        @media (max-width: 600px) {

            .cabecalho-rota-aberta {
                align-items: flex-start;
                flex-wrap: wrap;
            }

            .cabecalho-rota-selecao {
                width: 100%;
                justify-content: space-between;
            }
        }

        @media (max-width: 600px) {

            .acoes-planeamento {
                width: 100%;
                flex-direction: column;
            }

            .botao-pontos-selecionados,
            .botao-criar-missao {
                width: 100%;
            }
        }



        /* TABLET */

        @media (max-width: 1000px) {

            .grade-rotas {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

        }

        /* TELEMÓVEL */

        @media (max-width: 600px) {

            .grade-rotas {
                grid-template-columns: 1fr;
            }

        }

        /* RESPONSIVO */

        @media (max-width: 600px) {

            .resumo-planeamento {
                align-items: stretch;
                flex-direction: column;
            }

            .botao-criar-missao {
                width: 100%;
            }

            .titulo-rotas-disponiveis {
                align-items: flex-start;
                flex-direction: column;
                gap: 4px;
            }
        }

        @media (max-width: 600px) {

            .card-rota {
                padding: 12px;
            }

            .card-rota-icone {
                width: 38px;
                height: 38px;
            }

        }

        @media (max-width: 700px) {

            .cabecalho-planeamento {
                align-items: flex-start;
                flex-direction: column;

                padding: 18px;
            }

            .cabecalho-planeamento h1 {
                font-size: 21px;
            }

        }

        @media (max-width: 600px) {

            .previsualizacao-ordem {
                align-items: flex-start;
                flex-direction: column;
                gap: 5px;
            }

        }

        @media (max-width: 600px) {
            .opcoes-planeamento {
                grid-template-columns: 1fr;
            }
        }

        /* Cards das rotas mais compactos no desktop */
        @media (min-width: 1001px) {
            .grade-rotas {
                gap: 8px;
            }

            .grade-rotas .card-rota {
                padding: 9px 12px;
                gap: 10px;
            }

            .grade-rotas .card-rota-icone {
                width: 34px;
                height: 34px;
                font-size: 16px;
            }

            .grade-rotas .card-rota-info {
                gap: 2px;
            }
        }

        .titulo-rotas-disponiveis {
            padding: 12px 16px;
            margin-bottom: 12px;

            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 10px;

            box-shadow: 0 3px 10px rgba(15, 23, 42, 0.04);
        }

        .titulo-rotas-disponiveis span {
            display: block;
            margin-bottom: 3px;

            color: #64748b;
            font-size: 9px;
            font-weight: 800;
            letter-spacing: 0.08em;
        }

        .titulo-rotas-disponiveis h2 {
            margin: 0;

            color: #2A3B5D;
            font-size: 16px;
            font-weight: 800;
        }

        .titulo-rotas-disponiveis #statusSistemaRotas {
            background: #eff6ff;
            border-color: #bfdbfe;

        function calcularDistancia(lat1, lon1, lat2, lon2) {

            const raioTerra = 6371; // km

            const latitude1 =
                Number(lat1) * Math.PI / 180;

            const latitude2 =
                Number(lat2) * Math.PI / 180;

            const diferencaLatitude =
                (Number(lat2) - Number(lat1)) *
                Math.PI / 180;

            const diferencaLongitude =
                (Number(lon2) - Number(lon1)) *
                Math.PI / 180;


            const a =
                Math.sin(diferencaLatitude / 2) *
                Math.sin(diferencaLatitude / 2) +

                Math.cos(latitude1) *
                Math.cos(latitude2) *

                Math.sin(diferencaLongitude / 2) *
                Math.sin(diferencaLongitude / 2);


            const c =
                2 *
                Math.atan2(
                    Math.sqrt(a),
                    Math.sqrt(1 - a)
                );


            return raioTerra * c;
        }


        function otimizarOrdemClientes(
            codigosSelecionados
        ) {

            const coordenadasBase = {
                latitude: 41.6232128,
                longitude: -8.3472675
            };

            const clientesSelecionadosCompletos =
                codigosSelecionados
                    .map(function (codigo) {

                        return clientes.find(
                            function (cliente) {

                                return (
                                    String(cliente.codigo) ===
                                    String(codigo)
                                );

                            }
                        );

                    })
                    .filter(function (cliente) {

                        return (
                            cliente &&
                            cliente.latitude != null &&
                            cliente.longitude != null
                        );

                    });


            const clientesRestantes =
                [...clientesSelecionadosCompletos];


            const clientesOrdenados = [];


            let latitudeAtual =
                coordenadasBase.latitude;

            let longitudeAtual =
                coordenadasBase.longitude;


            while (
                clientesRestantes.length > 0
            ) {

                let indiceMaisProximo = 0;

                let menorDistancia =
                    Infinity;


                clientesRestantes.forEach(
                    function (
                        cliente,
                        indice
                    ) {

                        const distancia =
                            calcularDistancia(
                                latitudeAtual,
                                longitudeAtual,
                                cliente.latitude,
                                cliente.longitude
                            );


                        if (
                            distancia <
                            menorDistancia
                        ) {

                            menorDistancia =
                                distancia;

                            indiceMaisProximo =
                                indice;

                        }

                    }
                );


                const proximoCliente =
                    clientesRestantes.splice(
                        indiceMaisProximo,
                        1
                    )[0];


                clientesOrdenados.push(
                    String(
                        proximoCliente.codigo
                    )
                );


                latitudeAtual =
                    Number(
                        proximoCliente.latitude
                    );

                longitudeAtual =
                    Number(
                        proximoCliente.longitude
                    );

            }


            return clientesOrdenados;

        }

        function abrirResumoMissao() {

            const modal =
                document.getElementById("modalResumoMissao");

            const corpo =
                document.getElementById("corpoResumoMissao");

            if (!modal || !corpo) {
                return;
            }

            const ordem =
                modoPlaneamentoAtual === "otimizado"
                    ? otimizarOrdemClientes(clientesSelecionados)
                    : [...clientesSelecionados];

            const distanciaTotal =
                calcularDistanciaTotalMissao(ordem);

            const velocidadeMediaDrone = 65;

            const tempoMinutos =
                Math.ceil(
                    (distanciaTotal / velocidadeMediaDrone) * 60
                );

            const rotasEnvolvidas =
                [...new Set(
                    ordem.map(function (codigo) {

                        const cliente =
                            clientes.find(function (cliente) {
                                return String(cliente.codigo) === String(codigo);
                            });

                        return cliente
                            ? String(cliente.rota)
                            : null;
                    })
                        .filter(function (rota) {
                            return rota != null;
                        })
                )];

            corpo.innerHTML = `
        <div class="grade-resumo-missao">

            <div class="card-resumo-missao">
                <span>Modo</span>
                <strong>
                    ${modoPlaneamentoAtual === "otimizado"
                    ? "✨ Otimizado"
                    : "👤 Manual"
                }
                </strong>
            </div>

            <div class="card-resumo-missao">
                <span>Pontos de entrega</span>
                <strong>${ordem.length}</strong>
            </div>

            <div class="card-resumo-missao">
                <span>Distância</span>
                <strong>${distanciaTotal.toFixed(1)} km</strong>
            </div>

            <div class="card-resumo-missao">
                <span>Tempo estimado</span>
                <strong>${tempoMinutos} min</strong>
            </div>

            <div class="card-resumo-missao">
                <span>Rotas envolvidas</span>
                <strong>${rotasEnvolvidas.length}</strong>
            </div>

        </div>

        <div class="sequencia-resumo-missao">

    <span>SEQUÊNCIA DA MISSÃO</span>

    <div class="chips-resumo-missao">

        <span class="chip-sequencia chip-base">
            Base
        </span>

        ${ordem.map(function (codigo, indice) {

                    const classePosicao =
                        indice === 0
                            ? " primeiro-ponto"
                            : indice === ordem.length - 1
                                ? " ultimo-ponto"
                                : "";

                    const cliente =
                        clientes.find(function (cliente) {
                            return String(cliente.codigo) === String(codigo);
                        });

                    const nomeCliente =
                        cliente
                            ? cliente.nome
                            : "";

                    return `
                <span class="seta-sequencia">
                    →
                </span>

                <span class="chip-sequencia chip-resumo-cliente${classePosicao}">

    <strong class="codigo-resumo-cliente">
        ${codigo}
    </strong>

    <small class="nome-resumo-cliente">
        ${nomeCliente}
    </small>

</span>
            `;

                }).join("")}

        <span class="seta-sequencia">
            →
        </span>

        <span class="chip-sequencia chip-base">
            Base
        </span>

    </div>

</div>
    `;

            modal.classList.add("aberto");
        }

        function fecharResumoMissao() {

            const modal =
                document.getElementById("modalResumoMissao");

            if (modal) {
                modal.classList.remove("aberto");
            }
        }

        function localizarStatusRotas() {

            let container =
                document.getElementById(
                    "statusSistemaRotas"
                );

            if (!container) {
                container =
                    document.querySelector(
                        ".status-sistema-rotas"
                    );
            }

            /*
             * Compatibilidade com o cabeçalho antigo:
             * se o indicador ainda estiver apenas com o texto
             * "Sistema de rotas disponível", localizamos esse
             * elemento automaticamente.
             */
            if (!container) {

                const normalizarTexto =
                    function (valor) {

                        return String(valor || "")
                            .normalize("NFD")
                            .replace(/[\u0300-\u036f]/g, "")
                            .replace(/\s+/g, " ")
                            .trim()
                            .toLowerCase();
                    };

                const candidatos =
                    Array.from(
                        document.querySelectorAll(
                            "div, span, p"
                        )
                    );

                container =
                    candidatos.find(
                        function (elemento) {

                            const texto =
                                normalizarTexto(
                                    elemento.textContent
                                );

                            return (
                                texto ===
                                "sistema de rotas disponivel" ||
                                texto ===
                                "aguardando selecao de pontos" ||
                                texto ===
                                "missao em planeamento" ||
                                texto ===
                                "rota pronta para missao"
                            );
                        }
                    );
            }

            if (!container) {
                return null;
            }

            container.id =
                "statusSistemaRotas";

            container.style.display =
                "inline-flex";

            container.style.alignItems =
                "center";

            container.style.gap =
                "6px";


            let ponto =
                document.getElementById(
                    "pontoStatusRotas"
                );

            let texto =
                document.getElementById(
                    "textoStatusRotas"
                );


            if (!ponto || !texto) {

                container.innerHTML = `
                    <span
                        class="ponto-status-rotas"
                        id="pontoStatusRotas"
                        aria-hidden="true"
                    ></span>

                    <span id="textoStatusRotas"></span>
                `;

                ponto =
                    document.getElementById(
                        "pontoStatusRotas"
                    );

                texto =
                    document.getElementById(
                        "textoStatusRotas"
                    );
            }


            return {
                container: container,
                ponto: ponto,
                texto: texto
            };
        }


        function atualizarStatusRotas() {

            const elementos =
                localizarStatusRotas();

            if (!elementos) {
                return;
            }

            const ponto =
                elementos.ponto;

            const texto =
                elementos.texto;

            const quantidade =
                clientesSelecionados.length;


            ponto.style.display =
                "inline-block";

            ponto.style.width =
                "7px";

            ponto.style.height =
                "7px";

            ponto.style.flexShrink =
                "0";

            ponto.style.borderRadius =
                "50%";


            /*
             * ROTA PRONTA
             * Basta existir pelo menos um ponto selecionado,
             * pois a missão já pode ser criada.
             */
            if (quantidade > 0) {

                texto.textContent =
                    "Rota para missão";

                ponto.className =
                    "ponto-status-rotas status-rotas-pronta";

                ponto.style.background =
                    "#22c55e";

                ponto.style.boxShadow =
                    "0 0 0 3px rgba(34, 197, 94, .15)";

                return;
            }


            /*
             * EM PLANEAMENTO
             * Uma rota está aberta, mas ainda não foi
             * selecionado nenhum ponto.
             */
            if (rotaAbertaAtual !== null) {

                texto.textContent =
                    "Missão em planeamento";

                ponto.className =
                    "ponto-status-rotas status-rotas-andamento";

                ponto.style.background =
                    "#3b82f6";

                ponto.style.boxShadow =
                    "0 0 0 3px rgba(59, 130, 246, .15)";

                return;
            }


            /*
             * AGUARDANDO
             * Página inicial de rotas sem pontos selecionados.
             */
            texto.textContent =
                "Selecione os pontos de entrega";

            ponto.className =
                "ponto-status-rotas status-rotas-aguardando";

            ponto.style.background =
                "#94a3b8";

            ponto.style.boxShadow =
                "0 0 0 3px rgba(148, 163, 184, .15)";
        }

        window.addEventListener(
            "popstate",
            function (event) {

                const estado =
                    event.state;

                if (
                    estado &&
                    estado.tela === "lista-rotas"
                ) {

                    mostrarRotas();

                }
            }
        );

    </script>

    <div class="modal-pontos" id="modalPontosSelecionados">

        <div class="modal-pontos-conteudo">

            <div class="modal-pontos-cabecalho">

                <div>
                    <span>MISSÃO ATUAL</span>

                    <div class="titulo-pontos-selecionados">
                        <h3>
                            <svg viewBox="0 0 24 24" aria-hidden="true"
                                style="width:18px;height:18px;display:inline-block;vertical-align:middle;margin-right:5px;fill:none;stroke:#2563eb;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;">
                                <path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 1 1 16 0Z"></path>
                                <circle cx="12" cy="10" r="3"></circle>
                            </svg>
                            Pontos de entrega selecionados
                        </h3>

                        <strong class="contador-pontos-modal" id="contadorPontosModal">
                            0
                        </strong>
                    </div>

                    <span class="indicador-modo-modal manual" id="indicadorModoModal">
                        👤 Ordem manual
                    </span>

                </div>

                <button class="botao-fechar-modal" onclick="fecharPontosSelecionados()">
                    ×
                </button>

            </div>

            <div class="lista-pontos-selecionados" id="listaPontosSelecionados">
            </div>

        </div>

    </div>

    <div class="modal-resumo-missao" id="modalResumoMissao">
        <div class="conteudo-resumo-missao">

            <div class="cabecalho-resumo-missao">
                <div>
                    <span>MISSÃO ATUAL</span>
                    <h3>Resumo da missão</h3>
                </div>

                <button type="button" class="botao-fechar-resumo" onclick="fecharResumoMissao()">
                    ×
                </button>
            </div>

            <div class="corpo-resumo-missao" id="corpoResumoMissao">
            </div>

            <div class="rodape-resumo-missao">

                <span class="nota-configuracao-missao">
                    Aeronave e operador definidos no passo seguinte
                </span>

                <button type="button" class="botao-fechar-resumo-rodape" onclick="fecharResumoMissao()">
                    Fechar
                </button>

                <button type="button" class="botao-criar-resumo-missao" onclick="gerarDistribuicao()">
                    <svg class="icone-drone-menu" viewBox="0 0 64 40" aria-hidden="true">

                 Q32 34 36 32 L39 19 Q40 15 38 15Z"></path>

                            <path d="M36 27 49 31 48 34 34 31Z"></path>

                            <rect x="10" y="9" width="4" height="7" rx="2"></rect>
                            <rect x="50" y="9" width="4" height="7" rx="2"></rect>
                            <rect x="13" y="29" width="3.5" height="7" rx="1.7"></rect>
                            <rect x="47.5" y="29" width="3.5" height="7" rx="1.7"></rect>
                        </g>

                        <g fill="none" stroke="currentColor" stroke-width="2.5">
                            <ellipse cx="12" cy="10" rx="10" ry="4.5"></ellipse>
                            <ellipse cx="52" cy="10" rx="10" ry="4.5"></ellipse>
                            <ellipse cx="14.5" cy="29.5" rx="8" ry="3"></ellipse>
                            <ellipse cx="49.5" cy="29.5" rx="8" ry="3"></ellipse>
                        </g>
                    </svg> Criar missão
                </button>

            </div>

        </div>
    </div>
