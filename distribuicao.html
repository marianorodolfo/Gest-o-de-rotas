<!DOCTYPE html>
<html lang="pt">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nova Missão</title>

</head>

<body>

    <h1>Nova Missão</h1>

    <div id="dadosDistribuicao"></div>


    <script>

        const distribuidores =
            JSON.parse(
                localStorage.getItem("distribuidores")
            ) || [];


        const veiculos =
            JSON.parse(
                localStorage.getItem("veiculos")
            ) || [];


        const clientes =
            JSON.parse(
                localStorage.getItem("clientes")
            ) || [];


        const codigosSelecionados =
            JSON.parse(
                localStorage.getItem(
                    "clientesDistribuicaoTemporaria"
                )
            ) || [];


        const clientesSelecionados =
            codigosSelecionados
                .map(function (codigo) {

                    return clientes.find(
                        function (cliente) {

                            return (
                                String(cliente.codigo) ===
                                String(codigo)
                            );

                        }
                    );

                })
                .filter(function (cliente) {

                    return cliente != null;

                });


        const dados =
            document.getElementById(
                "dadosDistribuicao"
            );


        function nomeDaRota(numero) {

            const rotas = {

                "1": "Adaúfe",
                "2": "Braga Este",
                "3": "Braga Estádio",
                "4": "Braga 1",
                "5": "Braga 2",
                "6": "Vieira do Minho",
                "7": "Póvoa de Lanhoso 1",
                "8": "Póvoa de Lanhoso 2",
                "9": "Amares",
                "10": "Terras de Bouro",
                "11": "Caldelas",
                "12": "Vila Verde 1",
                "13": "Vila Verde 2",
                "14": "Vila Verde 3",
                "15": "Vila Verde 4",
                "16": "Ponte de Lima"

            };

            return rotas[String(numero)] || "";

        }


        /* ================================
           MOSTRAR DISTRIBUIDORES
           CONFORME O VEÍCULO
        ================================= */

        function atualizarDistribuidores() {

            const selectVeiculo =
                document.getElementById("veiculoDistribuicao");

            const selectDistribuidor =
                document.getElementById("distribuidorDistribuicao");

            const veiculo =
                selectVeiculo.value;

            const distribuicoes =
                JSON.parse(
                    localStorage.getItem("distribuicoes")
                ) || [];


            selectDistribuidor.innerHTML = `
        <option value="">
            Selecione o operador
        </option>
    `;


            if (!veiculo) {

                selectDistribuidor.disabled = true;

                return;

            }

            const tipoVeiculo = "drone";

            const distribuidoresDisponiveis =
                distribuidores.filter(function (distribuidor) {

                    const nome =
                        typeof distribuidor === "object"
                            ? distribuidor.nome
                            : distribuidor;


                    const tipo =
                        typeof distribuidor === "object"
                            ? distribuidor.tipo
                            : tipoVeiculo;


                    // if (tipo !== tipoVeiculo) {
                    //     return false;
                    // }


                    const ocupado =
                        distribuicoes.some(function (distribuicao) {

                            return (
                                String(distribuicao.distribuidor)
                                    .trim()
                                    .toLowerCase() ===
                                String(nome)
                                    .trim()
                                    .toLowerCase()
                                &&
                                distribuicao.status ===
                                "Em andamento"
                            );

                        });


                    return !ocupado;

                });


            distribuidoresDisponiveis.forEach(function (distribuidor) {

                const nome =
                    typeof distribuidor === "object"
                        ? distribuidor.nome
                        : distribuidor;


                selectDistribuidor.innerHTML += `
            <option value="${nome}">
                ${nome}
            </option>
        `;

            });


            if (distribuidoresDisponiveis.length === 0) {

                selectDistribuidor.innerHTML = `
            <option value="">
                Nenhum operador disponível
            </option>
        `;

                selectDistribuidor.disabled = true;

            }
            else {

                selectDistribuidor.disabled = false;

            }

        }


        /* ================================
           CONTEÚDO
        ================================= */

        dados.innerHTML = `

        <h2>
            Pontos de entrega
        </h2>

        <p>
            ${clientesSelecionados.length}
            ${clientesSelecionados.length === 1
                ? "ponto de entrega selecionado"
                : "pontos de entrega selecionados"
            }
        </p>


        <div id="clientesSelecionados"></div>


        <div id="areaVeiculo">

    <h2>
        Drone
    </h2>

    <select
        id="veiculoDistribuicao"
        onchange="atualizarDistribuidores()"
    >

        <option value="">
            Selecione o drone
        </option>

        ${[
                "DRN-001",
                "DRN-002",
                "DRN-003",
                "DRN-004"
            ].map(function (drone) {

                const distribuicoes =
                    JSON.parse(
                        localStorage.getItem("distribuicoes")
                    ) || [];


                const ocupado =
                    distribuicoes.some(function (distribuicao) {

                        return (
                            distribuicao.veiculo === drone &&
                            distribuicao.status === "Em andamento"
                        );

                    });


                return `
                <option
                    value="${drone}"
                    ${ocupado ? "disabled" : ""}
                >
                    ${drone}${ocupado
                        ? " — 🔴 Em missão"
                        : ""
                    }
                </option>
            `;

            }).join("")}

    </select>

</div>

<div id="areaModoOperacao">

    <h2>
        Modo de operação
    </h2>

    <select id="modoOperacaoDistribuicao">

        <option value="">
            Selecione o modo de operação
        </option>

        <option value="manual">
            Manual
        </option>

        <option value="assistido">
            Assistido
        </option>

        <option value="autonomo">
            Autónomo
        </option>

    </select>

</div>


        <div id="areaDistribuidor">

            <h2>
                Operador
            </h2>

            <select
                id="distribuidorDistribuicao"
                disabled
            >

                <option value="">
                Primeiro selecione o drone
                </option>

            </select>

        </div>


        <div id="areaBotao">

            <button
                onclick="criarDistribuicao()"
            >
                Iniciar missão
            </button>

        </div>

    `;


        /* ================================
           CLIENTES
        ================================= */

        const lista =
            document.getElementById(
                "clientesSelecionados"
            );


        clientesSelecionados.forEach(
            function (cliente) {

                lista.innerHTML += `

                <div>

                    <strong>
                        ${cliente.codigo} - ${cliente.nome}
                    </strong>

                    <br>

                    ${cliente.endereco}

                    <br>

                    Rota ${cliente.rota} -
                    ${nomeDaRota(cliente.rota)}

                </div>

                <hr>

            `;

            }
        );


        /* ================================
           CRIAR DISTRIBUIÇÃO
        ================================= */

        function criarDistribuicao() {

            const distribuidor =
                document.getElementById(
                    "distribuidorDistribuicao"
                ).value;


            const veiculo =
                document.getElementById(
                    "veiculoDistribuicao"
                ).value;

            const modoOperacao =
                document.getElementById(
                    "modoOperacaoDistribuicao"
                ).value;

            if (!modoOperacao) {

                alert(
                    "Selecione o modo de operação."
                );

                return;

            }


            if (!veiculo) {

                alert(
                    "Selecione um drone."
                );

                return;

            }


            if (!distribuidor) {

                alert(
                    "Selecione um operador."
                );

                return;

            }

            const distribuicoesExistentes =
                JSON.parse(
                    localStorage.getItem("distribuicoes")
                ) || [];


            const veiculoOcupado =
                distribuicoesExistentes.some(
                    function (distribuicao) {

                        return (
                            distribuicao.veiculo === veiculo &&
                            distribuicao.status === "Em andamento"
                        );

                    }
                );


            if (veiculoOcupado) {

                alert(
                    "Este drone já está em missão."
                );

                return;

            }


            if (clientesSelecionados.length === 0) {

                alert(
                    "Não há clientes selecionados."
                );

                return;

            }


            const agora = new Date();


            const distribuicoes =
                JSON.parse(
                    localStorage.getItem(
                        "distribuicoes"
                    )
                ) || [];


            const novaDistribuicao = {

                id:
                    Date.now(),

                clientes:
                    clientesSelecionados,


                distribuidor,

                veiculo:
                    veiculo,

                modoOperacao:
                    modoOperacao,

                data:
                    agora.toLocaleDateString(
                        "pt-PT"
                    ),

                horaInicio:
                    agora.toLocaleTimeString(
                        "pt-PT",
                        {
                            hour: "2-digit",
                            minute: "2-digit"
                        }
                    ),

                inicioTimestamp:
                    agora.getTime(),

                status:
                    "Em andamento"

            };


            distribuicoes.push(
                novaDistribuicao
            );


            localStorage.setItem(
                "distribuicoes",
                JSON.stringify(
                    distribuicoes
                )
            );


            localStorage.removeItem(
                "clientesDistribuicaoTemporaria"
            );


            alert(
                "Missão criada com sucesso!"
            );


            window.location.href =
                "Distribuicoes.html";

        }

        atualizarDistribuidores();

    </script>

</body>

</html>
