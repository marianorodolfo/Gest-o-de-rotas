<!DOCTYPE html>
<html lang="pt">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nova Missão</title>

    <style>
        body {
            margin: 0;
            padding: 18px;

            background: #eef4fb;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            color: #0f172a;
        }

        .cabecalho-configuracao {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;

            margin-bottom: 14px;
            padding: 13px 18px;

            border-radius: 12px;

            background: #2A3B5D;

            box-shadow:
                0 6px 18px rgba(15, 23, 42, .10);
        }

        .cabecalho-configuracao-etiqueta {
            display: block;

            margin-bottom: 3px;

            color: #93c5fd;

            font-size: 9px;
            font-weight: 900;
            letter-spacing: .10em;
        }

        .cabecalho-configuracao h1 {
            margin: 0;

            color: #ffffff;

            font-size: 21px;
            font-weight: 900;
            line-height: 1.15;
        }

        .cabecalho-configuracao p {
            margin: 4px 0 0;

            color: #cbd5e1;

            font-size: 11px;
            font-weight: 600;
            line-height: 1.35;
        }

        .cabecalho-configuracao-status {
            display: inline-flex;
            align-items: center;
            gap: 6px;

            flex-shrink: 0;

            padding: 6px 10px;

            border: 1px solid rgba(255, 255, 255, .14);
            border-radius: 999px;

            background: rgba(255, 255, 255, .08);
            color: #e2e8f0;

            font-size: 10px;
            font-weight: 800;
        }

        .cabecalho-configuracao-status {
            transition:
                background 0.2s ease,
                border-color 0.2s ease,
                color 0.2s ease;
        }


        /* Aguardando */

        .cabecalho-configuracao-status.status-aguardando {
            background: rgba(148, 163, 184, 0.10);
            border-color: rgba(203, 213, 225, 0.18);
            color: #cbd5e1;
        }


        /* Em configuração */

        .cabecalho-configuracao-status.status-andamento {
            background: rgba(59, 130, 246, 0.14);
            border-color: rgba(147, 197, 253, 0.28);
            color: #bfdbfe;
        }


        /* Completa */

        .cabecalho-configuracao-status.status-completo {
            background: rgba(34, 197, 94, 0.14);
            border-color: rgba(134, 239, 172, 0.28);
            color: #bbf7d0;
        }

        .ponto-status-configuracao {
            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: #22c55e;

            box-shadow:
                0 0 0 3px rgba(34, 197, 94, .15);
        }

        .ponto-status-configuracao.status-aguardando {
            background: #94a3b8;

            box-shadow:
                0 0 0 3px rgba(148, 163, 184, .15);
        }

        .ponto-status-configuracao.status-andamento {
            background: #3b82f6;

            box-shadow:
                0 0 0 3px rgba(59, 130, 246, .15);
        }

        .ponto-status-configuracao.status-completo {
            background: #22c55e;

            box-shadow:
                0 0 0 3px rgba(34, 197, 94, .15);
        }

        .painel-pontos-missao {
            margin-bottom: 12px;
            padding: 12px;

            border: 1px solid #dbeafe;
            border-radius: 12px;

            background: #ffffff;

            box-shadow:
                0 4px 14px rgba(15, 23, 42, .04);
        }

        .cabecalho-pontos-missao {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;

            margin-bottom: 10px;
        }

        .etiqueta-pontos-missao {
            display: block;

            margin-bottom: 2px;

            color: #2563eb;

            font-size: 8px;
            font-weight: 900;
            letter-spacing: .1em;
        }

        .cabecalho-pontos-missao h2 {
            margin: 0;

            color: #0f172a;

            font-size: 14px;
            font-weight: 900;
        }

        .contador-pontos-missao {
            display: flex;
            align-items: baseline;
            gap: 4px;

            padding: 6px 9px;

            border-radius: 8px;

            background: #eff6ff;
            color: #2563eb;
        }

        .contador-pontos-missao strong {
            font-size: 14px;
            font-weight: 900;
        }

        .contador-pontos-missao span {
            font-size: 8px;
            font-weight: 800;
        }

        #clientesSelecionados {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 7px;
        }

        .card-ponto-configuracao {
            display: flex;
            align-items: flex-start;
            gap: 8px;

            min-width: 0;
            padding: 8px;

            border: 1px solid #e2e8f0;
            border-radius: 8px;

            background: #f8fafc;
        }

        .ordem-ponto-configuracao {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            flex: 0 0 24px;
            width: 24px;
            height: 24px;

            border-radius: 6px;

            background: #eff6ff;
            color: #2563eb;

            font-size: 9px;
            font-weight: 900;
        }

        .dados-ponto-configuracao {
            display: flex;
            flex-direction: column;
            gap: 2px;

            min-width: 0;
            flex: 1;
        }

        .cabecalho-ponto-configuracao {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
        }

        .cabecalho-ponto-configuracao strong {
            color: #2563eb;
            font-size: 9px;
            font-weight: 900;
        }

        .cabecalho-ponto-configuracao span {
            color: #64748b;
            font-size: 7px;
            font-weight: 800;
        }

        .nome-ponto-configuracao {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;

            color: #0f172a;
            font-size: 10px;
            font-weight: 800;
        }

        .dados-ponto-configuracao small {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;

            color: #64748b;
            font-size: 8px;
            font-weight: 600;
        }

        .rota-ponto-configuracao {
            color: #94a3b8 !important;
            font-size: 7px !important;
        }

        .grade-configuracao-operacional {
            display: grid !important;
            grid-template-columns:
                repeat(3, minmax(0, 1fr)) !important;

            align-items: stretch;
            gap: 15px;

            width: 100%;
        }


        .grade-detalhe-missao .detalhe-item strong {
            color: #2A3B5D;

            font-size: 11px;
            font-weight: 800;

            white-space: nowrap;
        }

        #areaVeiculo,
        #areaModoOperacao,
        #areaDistribuidor {
            min-width: 0;
            margin: 0;
            padding: 1px 2px;

            border: 1px solid #e2e8f0;
            border-radius: 9px;

            background: #f8fafc;

            box-sizing: border-box;
        }

        /* Campo de configuração concluído */

        #areaVeiculo.configurado,
        #areaModoOperacao.configurado,
        #areaDistribuidor.configurado {
            border-color: #93c5fd;

            background: #f8fbff;

            box-shadow:
                0 0 0 2px rgba(37, 99, 235, 0.08);
        }

        #areaVeiculo h2,
        #areaModoOperacao h2,
        #areaDistribuidor h2 {
            margin: 5px 7px 4px;

            color: #334155;

            font-size: 9px;
            font-weight: 900;
            line-height: 1;
        }

        #areaVeiculo select,
        #areaModoOperacao select,
        #areaDistribuidor select {
            display: block;

            width: calc(100% - 12px);
            height: 28px;

            margin: 0 6px 6px;
            padding: 0 7px;

            border: 1px solid #cbd5e1;
            border-radius: 6px;

            background: #ffffff;
            color: #0f172a;

            font-size: 9px;
            font-weight: 700;

            outline: none;
            box-sizing: border-box;
        }

        #areaBotao {
            display: flex;
            justify-content: flex-end;

            margin-top: 10px;
        }

        .botao-iniciar-missao {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;

            min-height: 38px;
            padding: 0 16px;

            border: 1px solid #2563eb;
            border-radius: 8px;

            background: #2563eb;
            color: #ffffff;

            font-size: 10px;
            font-weight: 900;

            cursor: pointer;

            transition:
                background .2s ease,
                border-color .2s ease,
                transform .15s ease;
        }

        .botao-iniciar-missao:hover {
            background: #1d4ed8;
            border-color: #1d4ed8;

            transform: translateY(-1px);
        }

        .botao-iniciar-missao:disabled {
            border-color: #cbd5e1;

            background: #e2e8f0;
            color: #94a3b8;

            cursor: not-allowed;

            transform: none;
        }

        .botao-iniciar-missao:disabled:hover {
            border-color: #cbd5e1;

            background: #e2e8f0;

            transform: none;
        }

        .painel-configuracao-operacional {
            margin-top: 12px;
            margin-bottom: 12px;
            padding: 14px;

            border: 1px solid #dbeafe;
            border-radius: 12px;

            background: #ffffff;

            box-shadow:
                0 4px 14px rgba(15, 23, 42, .05);

            box-sizing: border-box;
        }

        .etiqueta-configuracao-operacional {
            display: block;
            margin-bottom: 2px;

            color: #2563eb;

            font-size: 8px;
            font-weight: 900;
            letter-spacing: .1em;
        }

        .cabecalho-configuracao-operacional h2 {
            margin: 5px 0px 15px 5px;

            color: #0f172a;

            font-size: 16px;
            font-weight: 900;
            line-height: 1.1;
        }

        .cabecalho-configuracao-operacional small {
            display: block;
            margin-bottom: 4px;
        }

        .nota-operador {
            display: block;
            margin: -2px 7px 5px;

            color: #94a3b8;

            font-size: 7px;
            font-weight: 600;
        }

        @media (max-width: 900px) {
            #clientesSelecionados {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 600px) {
            #clientesSelecionados {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 700px) {

            .cabecalho-configuracao {
                align-items: flex-start;
                flex-direction: column;
            }

        }
    </style>

</head>

<body>

    <div class="cabecalho-configuracao">

        <div class="cabecalho-configuracao-texto">

            <span class="cabecalho-configuracao-etiqueta">
                CONFIGURAÇÃO OPERACIONAL
            </span>

            <h1>
                <svg class="icone-drone-menu" viewBox="0 0 64 40" aria-hidden="true"
                    style="width: 40px; height: 20px; color: #EF7F1A; display: inline-block; vertical-align: middle; margin-right: 6px;">
                    <g fill="currentColor" stroke="none">
                        <path d="M26 15 Q24 15 25 19 L28 32
                 Q32 34 36 32 L39 19 Q40 15 38 15Z"></path>

                        <path d="M27 18 13 11 11 14 28 23Z"></path>
                        <path d="M37 18 51 11 53 14 36 23Z"></path>
                        <path d="M28 27 15 31 16 34 30 31Z"></path>
                        <path d="M36 27 49 31 48 34 34 31Z"></path>

                        <rect x="10" y="9" width="4" height="7" rx="2"></rect>
                        <rect x="50" y="9" width="4" height="7" rx="2"></rect>
                        <rect x="13" y="29" width="3.5" height="7" rx="1.7"></rect>
                        <rect x="47.5" y="29" width="3.5" height="7" rx="1.7"></rect>
                    </g>

                    <g fill="none" stroke="currentColor" stroke-width="2.5">
                        <ellipse cx="12" cy="10" rx="10" ry="4.5"></ellipse>
                        <ellipse cx="52" cy="10" rx="10" ry="4.5"></ellipse>
                        <ellipse cx="14.5" cy="29.5" rx="8" ry="3"></ellipse>
                        <ellipse cx="49.5" cy="29.5" rx="8" ry="3"></ellipse>
                    </g>
                </svg> Configuração da Missão
            </h1>

            <p>
                Selecione o drone, o modo de operação e o operador responsável pela missão.
            </p>

        </div>

        <div class="cabecalho-configuracao-status" id="statusConfiguracaoMissao">
            <span class="ponto-status-configuracao"></span>
            <span id="textoStatusConfiguracao">
                Aguardando configuração
            </span>
        </div>

    </div>

    <div id="dadosDistribuicao"></div>


    <script>
        const parametrosURL =
            new URLSearchParams(
                window.location.search
            );

        const idMissaoEdicao =
            parametrosURL.get(
                "editar"
            );

        const distribuicoesExistentes =
            JSON.parse(
                localStorage.getItem(
                    "distribuicoes"
                )
            ) || [];

        const missaoEdicao =
            idMissaoEdicao
                ? distribuicoesExistentes.find(
                    function (distribuicao) {

                        return (
                            String(distribuicao.id) ===
                            String(idMissaoEdicao)
                        );

                    }
                )
                : null;

        const distribuidores =
            JSON.parse(
                localStorage.getItem("distribuidores")
            ) || [];


        const veiculos =
            JSON.parse(
                localStorage.getItem("veiculos")
            ) || [];


        const clientes =
            JSON.parse(
                localStorage.getItem("clientes")
            ) || [];


        const codigosSelecionados =
            JSON.parse(
                localStorage.getItem(
                    "clientesDistribuicaoTemporaria"
                )
            ) || [];


        const clientesSelecionados =
            codigosSelecionados
                .map(function (codigo) {

                    return clientes.find(
                        function (cliente) {

                            return (
                                String(cliente.codigo) ===
                                String(codigo)
                            );

                        }
                    );

                })
                .filter(function (cliente) {

                    return cliente != null;

                });


        const dados =
            document.getElementById(
                "dadosDistribuicao"
            );


        function nomeDaRota(numero) {

            const rotas = {

                "1": "Adaúfe",
                "2": "Braga Este",
                "3": "Braga Estádio",
                "4": "Braga 1",
                "5": "Braga 2",
                "6": "Vieira do Minho",
                "7": "Póvoa de Lanhoso 1",
                "8": "Póvoa de Lanhoso 2",
                "9": "Amares",
                "10": "Terras de Bouro",
                "11": "Caldelas",
                "12": "Vila Verde 1",
                "13": "Vila Verde 2",
                "14": "Vila Verde 3",
                "15": "Vila Verde 4",
                "16": "Ponte de Lima"

            };

            return rotas[String(numero)] || "";

        }


        /* ================================
           MOSTRAR DISTRIBUIDORES
           CONFORME O VEÍCULO
        ================================= */

        function atualizarDistribuidores() {

            const selectVeiculo =
                document.getElementById(
                    "veiculoDistribuicao"
                );

            const selectDistribuidor =
                document.getElementById(
                    "distribuidorDistribuicao"
                );

            if (!selectVeiculo || !selectDistribuidor) {
                return;
            }

            const veiculo =
                selectVeiculo.value;

            selectDistribuidor.innerHTML = `
        <option value="">
            Selecione o operador
        </option>
    `;

            if (!veiculo) {

                selectDistribuidor.innerHTML = `
            <option value="">
                Primeiro selecione o drone
            </option>
        `;

                selectDistribuidor.disabled = true;

                return;
            }

            const operadoresAtivos =
                distribuidores.filter(
                    function (distribuidor) {

                        if (
                            typeof distribuidor ===
                            "object"
                        ) {
                            return (
                                distribuidor.ativo !==
                                false
                            );
                        }

                        return true;
                    }
                );


            operadoresAtivos.forEach(
                function (distribuidor) {

                    const nome =
                        typeof distribuidor === "object"
                            ? distribuidor.nome
                            : distribuidor;

                    if (!nome) {
                        return;
                    }

                    selectDistribuidor.innerHTML += `
            <option value="${nome}">
                ${nome}
            </option>
        `;

                }
            );


            if (
                operadoresAtivos.length ===
                0
            ) {

                selectDistribuidor.innerHTML = `
        <option value="">
            Nenhum operador ativo
        </option>
    `;

                selectDistribuidor.disabled =
                    true;

                return;
            }


            selectDistribuidor.disabled =
                false;
        }


        /* ================================
           CONTEÚDO
        ================================= */

        dados.innerHTML = `

        <div class="painel-pontos-missao">

    <div class="cabecalho-pontos-missao">

        <div>
            <span class="etiqueta-pontos-missao">
                PLANEAMENTO DA ROTA
            </span>

            <h2>
    <svg viewBox="0 0 24 24" aria-hidden="true"
         style="width:22px;height:22px;display:inline-block;vertical-align:middle;margin-right:6px;fill:none;stroke:#2563eb;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;">
        <path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 1 1 16 0Z"></path>
        <circle cx="12" cy="10" r="3"></circle>
    </svg>
    Pontos de entrega
</h2>
        </div>

        <div class="contador-pontos-missao">
            <strong>
                ${clientesSelecionados.length}
            </strong>

            <span>
                ${clientesSelecionados.length === 1
                ? "ponto de entrega"
                : "pontos de entrega"
            }
            </span>
        </div>

    </div>

    <div id="clientesSelecionados"></div>

</div>

<div class="painel-configuracao-operacional">

    <div class="cabecalho-configuracao-operacional">

        <div>
            <span class="etiqueta-configuracao-operacional">
                CONFIGURAÇÃO DA MISSÃO
            </span>

            <h2>
    <svg viewBox="0 0 64 40"
         aria-hidden="true"
         style="width: 24px; height: 20px; color: #EF7F1A; display: inline-block; vertical-align: middle; margin-right: 6px;">
        <g fill="currentColor" stroke="none">
            <path d="M26 15 Q24 15 25 19 L28 32
                     Q32 34 36 32 L39 19 Q40 15 38 15Z"></path>
            <path d="M27 18 13 11 11 14 28 23Z"></path>
            <path d="M37 18 51 11 53 14 36 23Z"></path>
            <path d="M28 27 15 31 16 34 30 31Z"></path>
            <path d="M36 27 49 31 48 34 34 31Z"></path>
            <rect x="10" y="9" width="4" height="7" rx="2"></rect>
            <rect x="50" y="9" width="4" height="7" rx="2"></rect>
            <rect x="13" y="29" width="3.5" height="7" rx="1.7"></rect>
            <rect x="47.5" y="29" width="3.5" height="7" rx="1.7"></rect>
        </g>
        <g fill="none" stroke="currentColor" stroke-width="2.5">
            <ellipse cx="12" cy="10" rx="10" ry="4.5"></ellipse>
            <ellipse cx="52" cy="10" rx="10" ry="4.5"></ellipse>
            <ellipse cx="14.5" cy="29.5" rx="8" ry="3"></ellipse>
            <ellipse cx="49.5" cy="29.5" rx="8" ry="3"></ellipse>
        </g>
    </svg>
    Recursos operacionais
</h2>
        </div>

        <small>
            Defina o drone, o modo de operação e o operador
        </small>

    </div>

    <div class="grade-configuracao-operacional">


        <div id="areaVeiculo">

    <h2>
        Drone
    </h2>

    <select
    id="veiculoDistribuicao"
    onchange="
        atualizarDistribuidores();
        atualizarStatusConfiguracao();
    "
>

        <option value="">
            Selecione o drone
        </option>

${veiculos
                .filter(function (drone) {

                    const aeronavesInativas =
                        JSON.parse(
                            localStorage.getItem(
                                "aeronavesInativas"
                            )
                        ) || [];

                    return (
                        !aeronavesInativas.includes(
                            drone
                        )
                    );

                })
                .map(function (drone) {
                    const distribuicoes =
                        JSON.parse(
                            localStorage.getItem("distribuicoes")
                        ) || [];


                    const ocupado =
                        distribuicoes.some(function (distribuicao) {

                            return (
                                distribuicao.veiculo === drone &&
                                distribuicao.status === "Em andamento"
                            );

                        });

                    const manutencoesDrones =
                        JSON.parse(
                            localStorage.getItem(
                                "manutencoesDrones"
                            )
                        ) || {};


                    const emManutencao =
                        manutencoesDrones[
                        String(drone)
                        ] &&
                        manutencoesDrones[
                            String(drone)
                        ].estado ===
                        "Em manutenção";


                    return `
                <option
    value="${drone}"
    ${ocupado ||
                            emManutencao
                            ? "disabled"
                            : ""
                        }
>
    ${drone}${ocupado
                            ? " — 🔴 Em missão"
                            : emManutencao
                                ? " — ⚙️ Em manutenção"
                                : " — 🟢 Disponível"
                        }
</option>
            `;

                }).join("")}

    </select>

</div>

<div id="areaModoOperacao">

    <h2>
        Modo de operação
    </h2>

    <select
    id="modoOperacaoDistribuicao"
    onchange="atualizarStatusConfiguracao()"
    >

        <option value="">
            Selecione o modo de operação
        </option>

        <option value="manual">
            Manual
        </option>

        <option value="assistido">
            Assistido
        </option>

        <option value="autonomo">
            Autónomo
        </option>

    </select>

</div>


        <div id="areaDistribuidor">

    <h2>
        Operador
    </h2>

    <small class="nota-operador">
        Pode supervisionar várias missões
    </small>

    <select
    id="distribuidorDistribuicao"
    onchange="atualizarStatusConfiguracao()"
    disabled
>

        <option value="">
            Primeiro selecione o drone
        </option>

    </select>

</div>

    </div>
</div>

    <div id="areaBotao">

    <button
    class="botao-iniciar-missao"
    id="botaoIniciarMissao"
    onclick="criarDistribuicao()"
    disabled
>
<svg viewBox="0 0 64 40"
     aria-hidden="true"
     style="width: 28px; height: 20px; color: #EF7F1A; display: inline-block; vertical-align: middle; flex-shrink: 0;">

        /* ================================
           CRIAR DISTRIBUIÇÃO
        ================================= */

        function criarDistribuicao() {

            const distribuidor =
                document.getElementById(
                    "distribuidorDistribuicao"
                ).value;


            const veiculo =
                document.getElementById(
                    "veiculoDistribuicao"
                ).value;

            const modoOperacao =
                document.getElementById(
                    "modoOperacaoDistribuicao"
                ).value;

            if (!modoOperacao) {

                alert(
                    "Selecione o modo de operação."
                );

                return;

            }


            if (!veiculo) {

                alert(
                    "Selecione um drone."
                );

                return;

            }


            if (!distribuidor) {

                alert(
                    "Selecione um operador."
                );

                return;

            }

            const distribuicoesExistentes =
                JSON.parse(
                    localStorage.getItem("distribuicoes")
                ) || [];


            const veiculoOcupado =
                distribuicoesExistentes.some(
                    function (distribuicao) {

                        const mesmaMissao =
                            missaoEdicao &&
                            String(distribuicao.id) ===
                            String(missaoEdicao.id);

                        return (
                            !mesmaMissao &&
                            distribuicao.veiculo === veiculo &&
                            distribuicao.status === "Em andamento"
                        );

                    }
                );


            if (veiculoOcupado) {

                alert(
                    "Este drone já está em missão."
                );

                return;

            }

            const manutencoesDrones =
                JSON.parse(
                    localStorage.getItem(
                        "manutencoesDrones"
                    )
                ) || {};


            const manutencaoAtual =
                manutencoesDrones[
                String(veiculo)
                ];


            if (
                manutencaoAtual &&
                manutencaoAtual.estado ===
                "Em manutenção"
            ) {

                alert(
                    "Este drone está em manutenção."
                );

                return;

            }


            if (clientesSelecionados.length === 0) {

                alert(
                    "Não há clientes selecionados."
                );

                return;

            }


            const agora = new Date();


            const distribuicoes =
                JSON.parse(
                    localStorage.getItem(
                        "distribuicoes"
                    )
                ) || [];


            if (missaoEdicao) {

                const indiceMissaoEdicao =
                    distribuicoes.findIndex(
                        function (distribuicao) {

                            return (
                                String(distribuicao.id) ===
                                String(idMissaoEdicao)
                            );

                        }
                    );

                if (indiceMissaoEdicao !== -1) {

                    distribuicoes[
                        indiceMissaoEdicao
                    ].clientes =
                        clientesSelecionados;

                    distribuicoes[
                        indiceMissaoEdicao
                    ].distribuidor =
                        distribuidor;

                    distribuicoes[
                        indiceMissaoEdicao
                    ].veiculo =
                        veiculo;

                    distribuicoes[
                        indiceMissaoEdicao
                    ].modoOperacao =
                        modoOperacao;

                    distribuicoes[
                        indiceMissaoEdicao
                    ].tempoEstimadoMinutos =
                        Number(
                            localStorage.getItem(
                                "tempoEstimadoMissaoTemporaria"
                            )
                        ) || null;

                }

            } else {

                const novaDistribuicao = {

                    id:
                        Date.now(),

                    clientes:
                        clientesSelecionados,

                    distribuidor,

                    veiculo:
                        veiculo,

                    modoOperacao:
                        modoOperacao,

                    data:
                        agora.toLocaleDateString(
                            "pt-PT"
                        ),

                    horaInicio:
                        agora.toLocaleTimeString(
                            "pt-PT",
                            {
                                hour: "2-digit",
                                minute: "2-digit"
                            }
                        ),

                    inicioTimestamp:
                        agora.getTime(),

                    tempoEstimadoMinutos:
                        Number(
                            localStorage.getItem(
                                "tempoEstimadoMissaoTemporaria"
                            )
                        ) || null,

                    status:
                        "Em andamento"

                };

                distribuicoes.push(
                    novaDistribuicao
                );

            }


            localStorage.setItem(
                "distribuicoes",
                JSON.stringify(
                    distribuicoes
                )
            );


            localStorage.removeItem(
                "clientesDistribuicaoTemporaria"
            );


            alert(
                missaoEdicao
                    ? "Missão atualizada com sucesso!"
                    : "Missão criada com sucesso!"
            );


            window.location.href =
                "distribuicoes.html";

        }

        function atualizarStatusConfiguracao() {

            const drone =
                document.getElementById(
                    "veiculoDistribuicao"
                )?.value || "";

            const modo =
                document.getElementById(
                    "modoOperacaoDistribuicao"
                )?.value || "";

            const operador =
                document.getElementById(
                    "distribuidorDistribuicao"
                )?.value || "";

            const texto =
                document.getElementById(
                    "textoStatusConfiguracao"
                );

            const ponto =
                document.querySelector(
                    ".ponto-status-configuracao"
                );

            const statusConfiguracao =
                document.querySelector(
                    ".cabecalho-configuracao-status"
                );

            const botao =
                document.getElementById(
                    "botaoIniciarMissao"
                );

            const areaDrone =
                document.getElementById(
                    "areaVeiculo"
                );

            const areaModo =
                document.getElementById(
                    "areaModoOperacao"
                );

            const areaOperador =
                document.getElementById(
                    "areaDistribuidor"
                );


            if (areaDrone) {

                areaDrone.classList.toggle(
                    "configurado",
                    Boolean(drone)
                );

            }


            if (areaModo) {

                areaModo.classList.toggle(
                    "configurado",
                    Boolean(modo)
                );

            }


            if (areaOperador) {

                areaOperador.classList.toggle(
                    "configurado",
                    Boolean(operador)
                );

            }

            if (!texto || !ponto) {
                return;
            }

            if (statusConfiguracao) {

                statusConfiguracao.classList.remove(
                    "status-aguardando",
                    "status-andamento",
                    "status-completo"
                );

            }

            const configuracaoCompleta =
                drone && modo && operador;

            if (botao) {
                botao.disabled =
                    !configuracaoCompleta;
            }

            if (configuracaoCompleta) {

                texto.textContent =
                    "Configuração completa";

                ponto.className =
                    "ponto-status-configuracao status-completo";

                if (statusConfiguracao) {
                    statusConfiguracao.classList.add(
                        "status-completo"
                    );
                }

                return;
            }

            if (drone || modo || operador) {

                texto.textContent =
                    "Configuração em andamento";

                ponto.className =
                    "ponto-status-configuracao status-andamento";

                if (statusConfiguracao) {
                    statusConfiguracao.classList.add(
                        "status-andamento"
                    );
                }

                return;
            }

            texto.textContent =
                "Aguardando configuração";

            ponto.className =
                "ponto-status-configuracao status-aguardando";

            if (statusConfiguracao) {
                statusConfiguracao.classList.add(
                    "status-aguardando"
                );
            }

        }

        atualizarDistribuidores();

        if (missaoEdicao) {

            const selectVeiculo =
                document.getElementById(
                    "veiculoDistribuicao"
                );

            const selectModo =
                document.getElementById(
                    "modoOperacaoDistribuicao"
                );

            const selectDistribuidor =
                document.getElementById(
                    "distribuidorDistribuicao"
                );


            if (selectVeiculo) {
                selectVeiculo.value =
                    missaoEdicao.veiculo || "";
            }


            atualizarDistribuidores();


            if (selectModo) {
                selectModo.value =
                    missaoEdicao.modoOperacao || "";
            }


            if (selectDistribuidor) {
                selectDistribuidor.value =
                    missaoEdicao.distribuidor || "";
            }

        }

        atualizarStatusConfiguracao();

    </script>
