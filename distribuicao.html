<!DOCTYPE html>
<html lang="pt">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nova Missão</title>

    <style>
        body {
            margin: 0;
            padding: 18px;

            background: #eef4fb;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            color: #0f172a;
        }

        .cabecalho-configuracao {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;

            margin-bottom: 14px;
            padding: 13px 18px;

            border-radius: 12px;

            background: #123b63;

            box-shadow:
                0 6px 18px rgba(15, 23, 42, .10);
        }

        .cabecalho-configuracao-etiqueta {
            display: block;

            margin-bottom: 3px;

            color: #93c5fd;

            font-size: 9px;
            font-weight: 900;
            letter-spacing: .10em;
        }

        .cabecalho-configuracao h1 {
            margin: 0;

            color: #ffffff;

            font-size: 21px;
            font-weight: 900;
            line-height: 1.15;
        }

        .cabecalho-configuracao p {
            margin: 4px 0 0;

            color: #cbd5e1;

            font-size: 11px;
            font-weight: 600;
            line-height: 1.35;
        }

        .cabecalho-configuracao-status {
            display: inline-flex;
            align-items: center;
            gap: 6px;

            flex-shrink: 0;

            padding: 6px 10px;

            border: 1px solid rgba(255, 255, 255, .14);
            border-radius: 999px;

            background: rgba(255, 255, 255, .08);
            color: #e2e8f0;

            font-size: 10px;
            font-weight: 800;
        }

        .ponto-status-configuracao {
            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: #22c55e;

            box-shadow:
                0 0 0 3px rgba(34, 197, 94, .15);
        }

        .ponto-status-configuracao.status-aguardando {
            background: #94a3b8;

            box-shadow:
                0 0 0 3px rgba(148, 163, 184, .15);
        }

        .ponto-status-configuracao.status-andamento {
            background: #3b82f6;

            box-shadow:
                0 0 0 3px rgba(59, 130, 246, .15);
        }

        .ponto-status-configuracao.status-completo {
            background: #22c55e;

            box-shadow:
                0 0 0 3px rgba(34, 197, 94, .15);
        }

        .painel-pontos-missao {
            margin-bottom: 12px;
            padding: 12px;

            border: 1px solid #dbeafe;
            border-radius: 12px;

            background: #ffffff;

            box-shadow:
                0 4px 14px rgba(15, 23, 42, .04);
        }

        .cabecalho-pontos-missao {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;

            margin-bottom: 10px;
        }

        .etiqueta-pontos-missao {
            display: block;

            margin-bottom: 2px;

            color: #2563eb;

            font-size: 8px;
            font-weight: 900;
            letter-spacing: .1em;
        }

        .cabecalho-pontos-missao h2 {
            margin: 0;

            color: #0f172a;

            font-size: 14px;
            font-weight: 900;
        }

        .contador-pontos-missao {
            display: flex;
            align-items: baseline;
            gap: 4px;

            padding: 6px 9px;

            border-radius: 8px;

            background: #eff6ff;
            color: #2563eb;
        }

        .contador-pontos-missao strong {
            font-size: 14px;
            font-weight: 900;
        }

        .contador-pontos-missao span {
            font-size: 8px;
            font-weight: 800;
        }

        #clientesSelecionados {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 7px;
        }

        .card-ponto-configuracao {
            display: flex;
            align-items: flex-start;
            gap: 8px;

            min-width: 0;
            padding: 8px;

            border: 1px solid #e2e8f0;
            border-radius: 8px;

            background: #f8fafc;
        }

        .ordem-ponto-configuracao {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            flex: 0 0 24px;
            width: 24px;
            height: 24px;

            border-radius: 6px;

            background: #eff6ff;
            color: #2563eb;

            font-size: 9px;
            font-weight: 900;
        }

        .dados-ponto-configuracao {
            display: flex;
            flex-direction: column;
            gap: 2px;

            min-width: 0;
            flex: 1;
        }

        .cabecalho-ponto-configuracao {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
        }

        .cabecalho-ponto-configuracao strong {
            color: #2563eb;
            font-size: 9px;
            font-weight: 900;
        }

        .cabecalho-ponto-configuracao span {
            color: #64748b;
            font-size: 7px;
            font-weight: 800;
        }

        .nome-ponto-configuracao {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;

            color: #0f172a;
            font-size: 10px;
            font-weight: 800;
        }

        .dados-ponto-configuracao small {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;

            color: #64748b;
            font-size: 8px;
            font-weight: 600;
        }

        .rota-ponto-configuracao {
            color: #94a3b8 !important;
            font-size: 7px !important;
        }

        .grade-configuracao-operacional {
            display: grid !important;
            grid-template-columns:
                repeat(3, minmax(0, 1fr)) !important;

            align-items: stretch;
            gap: 15px;

            width: 100%;
        }

        #areaVeiculo,
        #areaModoOperacao,
        #areaDistribuidor {
            min-width: 0;
            margin: 0;
            padding: 1px 2px;

            border: 1px solid #e2e8f0;
            border-radius: 9px;

            background: #f8fafc;

            box-sizing: border-box;
        }

        #areaVeiculo h2,
        #areaModoOperacao h2,
        #areaDistribuidor h2 {
            margin: 5px 7px 4px;

            color: #334155;

            font-size: 9px;
            font-weight: 900;
            line-height: 1;
        }

        #areaVeiculo select,
        #areaModoOperacao select,
        #areaDistribuidor select {
            display: block;

            width: calc(100% - 12px);
            height: 28px;

            margin: 0 6px 6px;
            padding: 0 7px;

            border: 1px solid #cbd5e1;
            border-radius: 6px;

            background: #ffffff;
            color: #0f172a;

            font-size: 9px;
            font-weight: 700;

            outline: none;
            box-sizing: border-box;
        }

        #areaBotao {
            display: flex;
            justify-content: flex-end;

            margin-top: 10px;
        }

        .botao-iniciar-missao {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;

            min-height: 38px;
            padding: 0 16px;

            border: 1px solid #2563eb;
            border-radius: 8px;

            background: #2563eb;
            color: #ffffff;

            font-size: 10px;
            font-weight: 900;

            cursor: pointer;

            transition:
                background .2s ease,
                border-color .2s ease,
                transform .15s ease;
        }

        .botao-iniciar-missao:hover {
            background: #1d4ed8;
            border-color: #1d4ed8;

            transform: translateY(-1px);
        }

        .botao-iniciar-missao:disabled {
            border-color: #cbd5e1;

            background: #e2e8f0;
            color: #94a3b8;

            cursor: not-allowed;

            transform: none;
        }

        .botao-iniciar-missao:disabled:hover {
            border-color: #cbd5e1;

            background: #e2e8f0;

            transform: none;
        }

        .painel-configuracao-operacional {
            margin-top: 12px;
            margin-bottom: 12px;
            padding: 14px;

            border: 1px solid #dbeafe;
            border-radius: 12px;

            background: #ffffff;

            box-shadow:
                0 4px 14px rgba(15, 23, 42, .05);

            box-sizing: border-box;
        }

        .etiqueta-configuracao-operacional {
            display: block;
            margin-bottom: 2px;

            color: #2563eb;

            font-size: 8px;
            font-weight: 900;
            letter-spacing: .1em;
        }

        .cabecalho-configuracao-operacional h2 {
            margin: 5px 0px 15px 5px;

            color: #0f172a;

            font-size: 16px;
            font-weight: 900;
            line-height: 1.1;
        }

        .cabecalho-configuracao-operacional small {
            display: block;
            margin-bottom: 4px;
        }

        .nota-operador {
            display: block;
            margin: -2px 7px 5px;

            color: #94a3b8;

            font-size: 7px;
            font-weight: 600;
        }

        @media (max-width: 900px) {
            #clientesSelecionados {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 600px) {
            #clientesSelecionados {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 700px) {

            .cabecalho-configuracao {
                align-items: flex-start;
                flex-direction: column;
            }

        }
    </style>

</head>

<body>

    <div class="cabecalho-configuracao">

        <div class="cabecalho-configuracao-texto">

            <span class="cabecalho-configuracao-etiqueta">
                CONFIGURAÇÃO OPERACIONAL
            </span>

            <h1>
                🚁 Configuração da Missão
            </h1>

            <p>
                Selecione o drone, o modo de operação e o operador responsável pela missão.
            </p>

        </div>

        <div class="cabecalho-configuracao-status" id="statusConfiguracaoMissao">
            <span class="ponto-status-configuracao"></span>
            <span id="textoStatusConfiguracao">
                Aguardando configuração
            </span>
        </div>

    </div>

    <div id="dadosDistribuicao"></div>


    <script>

        const distribuidores =
            JSON.parse(
                localStorage.getItem("distribuidores")
            ) || [];


        const veiculos =
            JSON.parse(
                localStorage.getItem("veiculos")
            ) || [];


        const clientes =
            JSON.parse(
                localStorage.getItem("clientes")
            ) || [];


        const codigosSelecionados =
            JSON.parse(
                localStorage.getItem(
                    "clientesDistribuicaoTemporaria"
                )
            ) || [];


        const clientesSelecionados =
            codigosSelecionados
                .map(function (codigo) {

                    return clientes.find(
                        function (cliente) {

                            return (
                                String(cliente.codigo) ===
                                String(codigo)
                            );

                        }
                    );

                })
                .filter(function (cliente) {

                    return cliente != null;

                });


        const dados =
            document.getElementById(
                "dadosDistribuicao"
            );


        function nomeDaRota(numero) {

            const rotas = {

                "1": "Adaúfe",
                "2": "Braga Este",
                "3": "Braga Estádio",
                "4": "Braga 1",
                "5": "Braga 2",
                "6": "Vieira do Minho",
                "7": "Póvoa de Lanhoso 1",
                "8": "Póvoa de Lanhoso 2",
                "9": "Amares",
                "10": "Terras de Bouro",
                "11": "Caldelas",
                "12": "Vila Verde 1",
                "13": "Vila Verde 2",
                "14": "Vila Verde 3",
                "15": "Vila Verde 4",
                "16": "Ponte de Lima"

            };

            return rotas[String(numero)] || "";

        }


        /* ================================
           MOSTRAR DISTRIBUIDORES
           CONFORME O VEÍCULO
        ================================= */

        function atualizarDistribuidores() {

            const selectVeiculo =
                document.getElementById(
                    "veiculoDistribuicao"
                );

            const selectDistribuidor =
                document.getElementById(
                    "distribuidorDistribuicao"
                );

            if (!selectVeiculo || !selectDistribuidor) {
                return;
            }

            const veiculo =
                selectVeiculo.value;

            selectDistribuidor.innerHTML = `
        <option value="">
            Selecione o operador
        </option>
    `;

            if (!veiculo) {

                selectDistribuidor.innerHTML = `
            <option value="">
                Primeiro selecione o drone
            </option>
        `;

                selectDistribuidor.disabled = true;

                return;
            }

            distribuidores.forEach(
                function (distribuidor) {

                    const nome =
                        typeof distribuidor === "object"
                            ? distribuidor.nome
                            : distribuidor;

                    if (!nome) {
                        return;
                    }

                    selectDistribuidor.innerHTML += `
                <option value="${nome}">
                    ${nome}
                </option>
            `;
                }
            );

            if (distribuidores.length === 0) {

                selectDistribuidor.innerHTML = `
            <option value="">
                Nenhum operador cadastrado
            </option>
        `;

                selectDistribuidor.disabled = true;

                return;
            }

            selectDistribuidor.disabled = false;
        }


        /* ================================
           CONTEÚDO
        ================================= */

        dados.innerHTML = `

        <div class="painel-pontos-missao">

    <div class="cabecalho-pontos-missao">

        <div>
            <span class="etiqueta-pontos-missao">
                PLANEAMENTO DA ROTA
            </span>

            <h2>
                📍 Pontos de entrega
            </h2>
        </div>

        <div class="contador-pontos-missao">
            <strong>
                ${clientesSelecionados.length}
            </strong>

            <span>
                ${clientesSelecionados.length === 1
                ? "ponto"
                : "pontos"
            }
            </span>
        </div>

    </div>

    <div id="clientesSelecionados"></div>

</div>

<div class="painel-configuracao-operacional">

    <div class="cabecalho-configuracao-operacional">

        <div>
            <span class="etiqueta-configuracao-operacional">
                CONFIGURAÇÃO DA MISSÃO
            </span>

            <h2>
                🚁 Recursos operacionais
            </h2>
        </div>

        <small>
            Defina o drone, o modo de operação e o operador
        </small>

    </div>

    <div class="grade-configuracao-operacional">


        <div id="areaVeiculo">

    <h2>
        Drone
    </h2>

    <select
    id="veiculoDistribuicao"
    onchange="
        atualizarDistribuidores();
        atualizarStatusConfiguracao();
    "
>

        <option value="">
            Selecione o drone
        </option>

        ${[
                "DRN-001",
                "DRN-002",
                "DRN-003",
                "DRN-004"
            ].map(function (drone) {

                const distribuicoes =
                    JSON.parse(
                        localStorage.getItem("distribuicoes")
                    ) || [];


                const ocupado =
                    distribuicoes.some(function (distribuicao) {

                        return (
                            distribuicao.veiculo === drone &&
                            distribuicao.status === "Em andamento"
                        );

                    });


                return `
                <option
                    value="${drone}"
                    ${ocupado ? "disabled" : ""}
                >
                    ${drone}${ocupado
                        ? " — 🔴 Em missão"
                        : " — 🟢 Disponível"
                    }
                </option>
            `;

            }).join("")}

    </select>

</div>

<div id="areaModoOperacao">

    <h2>
        Modo de operação
    </h2>

    <select
    id="modoOperacaoDistribuicao"
    onchange="atualizarStatusConfiguracao()"
    >

        <option value="">
            Selecione o modo de operação
        </option>

        <option value="manual">
            Manual
        </option>

        <option value="assistido">
            Assistido
        </option>

        <option value="autonomo">
            Autónomo
        </option>

    </select>

</div>


        <div id="areaDistribuidor">

    <h2>
        Operador
    </h2>

    <small class="nota-operador">
        Pode supervisionar várias missões
    </small>

    <select
    id="distribuidorDistribuicao"
    onchange="atualizarStatusConfiguracao()"
    disabled
>

        <option value="">
            Primeiro selecione o drone
        </option>

    </select>

</div>

    </div>
</div>

    <div id="areaBotao">

    <button
        class="botao-iniciar-missao"
        id="botaoIniciarMissao"
        onclick="criarDistribuicao()"
        disabled
    >
        <span>🚁</span>
        Iniciar missão
    </button>

</div>

</div>

    `;


        /* ================================
           CLIENTES
        ================================= */

        const lista =
            document.getElementById(
                "clientesSelecionados"
            );


        clientesSelecionados.forEach(
            function (cliente) {

                lista.innerHTML += `

    <div class="card-ponto-configuracao">

        <div class="ordem-ponto-configuracao">
            ${clientesSelecionados.indexOf(cliente) + 1}
        </div>

        <div class="dados-ponto-configuracao">

            <div class="cabecalho-ponto-configuracao">
                <strong>
                    ${cliente.codigo}
                </strong>

                <span>
                    Rota ${String(cliente.rota).padStart(2, "0")}
                </span>
            </div>

            <strong class="nome-ponto-configuracao">
                ${cliente.nome}
            </strong>

            <small>
                ${cliente.endereco}
            </small>

            <small class="rota-ponto-configuracao">
                ${nomeDaRota(cliente.rota)}
            </small>

        </div>

    </div>

`;

            }
        );


        /* ================================
           CRIAR DISTRIBUIÇÃO
        ================================= */

        function criarDistribuicao() {

            const distribuidor =
                document.getElementById(
                    "distribuidorDistribuicao"
                ).value;


            const veiculo =
                document.getElementById(
                    "veiculoDistribuicao"
                ).value;

            const modoOperacao =
                document.getElementById(
                    "modoOperacaoDistribuicao"
                ).value;

            if (!modoOperacao) {

                alert(
                    "Selecione o modo de operação."
                );

                return;

            }


            if (!veiculo) {

                alert(
                    "Selecione um drone."
                );

                return;

            }


            if (!distribuidor) {

                alert(
                    "Selecione um operador."
                );

                return;

            }

            const distribuicoesExistentes =
                JSON.parse(
                    localStorage.getItem("distribuicoes")
                ) || [];


            const veiculoOcupado =
                distribuicoesExistentes.some(
                    function (distribuicao) {

                        return (
                            distribuicao.veiculo === veiculo &&
                            distribuicao.status === "Em andamento"
                        );

                    }
                );


            if (veiculoOcupado) {

                alert(
                    "Este drone já está em missão."
                );

                return;

            }


            if (clientesSelecionados.length === 0) {

                alert(
                    "Não há clientes selecionados."
                );

                return;

            }


            const agora = new Date();


            const distribuicoes =
                JSON.parse(
                    localStorage.getItem(
                        "distribuicoes"
                    )
                ) || [];


            const novaDistribuicao = {

                id:
                    Date.now(),

                clientes:
                    clientesSelecionados,


                distribuidor,

                veiculo:
                    veiculo,

                modoOperacao:
                    modoOperacao,

                data:
                    agora.toLocaleDateString(
                        "pt-PT"
                    ),

                horaInicio:
                    agora.toLocaleTimeString(
                        "pt-PT",
                        {
                            hour: "2-digit",
                            minute: "2-digit"
                        }
                    ),

                inicioTimestamp:
                    agora.getTime(),

                status:
                    "Em andamento"

            };


            distribuicoes.push(
                novaDistribuicao
            );


            localStorage.setItem(
                "distribuicoes",
                JSON.stringify(
                    distribuicoes
                )
            );


            localStorage.removeItem(
                "clientesDistribuicaoTemporaria"
            );


            alert(
                "Missão criada com sucesso!"
            );


            window.location.href =
                "Distribuicoes.html";

        }

        function atualizarStatusConfiguracao() {

            const drone =
                document.getElementById(
                    "veiculoDistribuicao"
                )?.value || "";

            const modo =
                document.getElementById(
                    "modoOperacaoDistribuicao"
                )?.value || "";

            const operador =
                document.getElementById(
                    "distribuidorDistribuicao"
                )?.value || "";

            const texto =
                document.getElementById(
                    "textoStatusConfiguracao"
                );

            const ponto =
                document.querySelector(
                    ".ponto-status-configuracao"
                );

            const botao =
                document.getElementById(
                    "botaoIniciarMissao"
                );

            if (!texto || !ponto) {
                return;
            }

            const configuracaoCompleta =
                drone && modo && operador;

            if (botao) {
                botao.disabled =
                    !configuracaoCompleta;
            }

            if (configuracaoCompleta) {

                texto.textContent =
                    "Configuração completa";

                ponto.className =
                    "ponto-status-configuracao status-completo";

                return;
            }

            if (drone || modo || operador) {

                texto.textContent =
                    "Configuração em andamento";

                ponto.className =
                    "ponto-status-configuracao status-andamento";

                return;
            }

            texto.textContent =
                "Aguardando configuração";

            ponto.className =
                "ponto-status-configuracao status-aguardando";
        }

        atualizarDistribuidores();
        atualizarStatusConfiguracao();

    </script>

</body>

</html>
