<!DOCTYPE html>
<html lang="pt">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="menu.css">

    <style>
        body {

            font-family: Arial, sans-serif;

            margin: 0;

            padding: 0;

            background: #f4f6f8;

            color: #1f2933;

        }


        #conteudo {

            margin-left: 200px;

            padding: 75px 10px 24px 0px;

        }


        h1 {

            margin-top: 0;

            margin-bottom: 25px;

            font-size: 28px;

        }

        .topo-distribuicoes h1 {
            font-size: 20px;
        }


        /* =========================================
           LISTA DE DISTRIBUIÇÕES
        ========================================= */

        #listaDistribuicoes {

            display: grid;

            grid-template-columns:
                repeat(4, minmax(0, 1fr));

            gap: 10px;

            align-items: start;

        }

        @media (max-width: 1500px) {

            #listaDistribuicoes {
                grid-template-columns:
                    repeat(4, minmax(0, 1fr));
            }

        }


        @media (max-width: 1200px) {

            #listaDistribuicoes {
                grid-template-columns:
                    repeat(3, minmax(0, 1fr));
            }

        }


        .cartao-distribuicao {

            background: white;

            border: 1px solid #e1e6eb;
            border-left: 4px solid #ef4444;

            border-radius: 11px;

            padding: 8px 11px;

            width: 100%;
            box-sizing: border-box;

            box-shadow:
                0 2px 7px rgba(16, 24, 40, 0.05);

            cursor: pointer;

            transition:
                transform 0.18s ease,
                box-shadow 0.18s ease,
                border-color 0.18s ease;

        }


        .cartao-distribuicao:hover {

            transform:
                translateY(-3px);

            box-shadow:
                0 6px 16px rgba(16, 24, 40, 0.10);

        }


        .cartao-distribuicao h2 {

            margin: 0 0 5px 0;

            color: #123b63;

            font-size: 14px;
            font-weight: 800;

        }


        .info-distribuicao {

            display: flex;
            flex-direction: column;

            gap: 0;

            color: #667085;

            font-size: 11.5px;
            line-height: 1.25;

        }


        .info-distribuicao strong {

            color: #1f2933;

        }


        .info-distribuicao p {

            margin: 1px 0;

        }


        /* =========================================
           DETALHES DA DISTRIBUIÇÃO
        ========================================= */

        .detalhe-distribuicao {
            grid-column: 1 / -1;
            width: 100%;

            background: #ffffff;

            border: 1px solid #e1e6eb;
            border-radius: 12px;

            padding: 16px 18px;

            box-shadow:
                0 2px 8px rgba(16, 24, 40, 0.06);

            max-width: 600px;
        }


        .detalhe-distribuicao h2 {

            margin-top: 0;

            margin-bottom: 20px;

            color: #123b63;

        }


        .detalhe-item {
            margin-bottom: 7px;
            color: #667085;

            font-size: 13px;
        }


        .detalhe-item strong {

            color: #1f2933;

        }


        /* =========================================
           CLIENTES DA DISTRIBUIÇÃO
        ========================================= */

        .clientes-da-distribuicao {

            display: flex;

            flex-direction: column;

            gap: 5px;

            margin-bottom: 15px;

        }


        .cliente-distribuicao {

            display: grid;

            grid-template-columns:
                170px 75px minmax(0, 1fr);

            align-items: center;

            gap: 10px;

            padding: 7px 10px;

            background: #f8fafc;

            border: 1px solid #e2e8f0;
            border-left: 3px solid #2563eb;

            border-radius: 8px;

            color: #1f2933;

            font-size: 12px;

        }

        .nome-cliente-entrega {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .cliente-distribuicao .status-ponto {
            justify-self: start;
        }

        .cliente-distribuicao button {
            justify-self: end;
        }

        .cliente-distribuicao button {
            height: 26px;

            padding: 0 9px;

            border: none;
            border-radius: 6px;

            background: #2563eb;
            color: white;

            font-size: 10px;
            font-weight: 700;

            line-height: 1;

            cursor: pointer;

            white-space: nowrap;

            transition:
                background 0.18s ease,
                transform 0.18s ease;
        }


        .cliente-distribuicao button:hover {
            background: #1d4ed8;

            transform: translateY(-1px);
        }


        /* =========================================
           BOTÕES
        ========================================= */

        #finalizarDistribuicao {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            width: fit-content;

            height: 32px;

            margin-top: 0px;

            padding: 0 12px;

            background: #2f8f5b;

            color: white;

            border: none;

            border-radius: 7px;

            font-size: 13px;

            font-weight: 600;

            line-height: 1;

            cursor: pointer;

        }


        #finalizarDistribuicao:hover {

            background: #246b44;

            transform:
                translateY(-1px);

        }


        #finalizarDistribuicao:disabled {

            background: #aab4bd;

            cursor: not-allowed;

            transform: none;

            opacity: 0.8;

        }


        .btn-voltar-distribuicoes {
            position: static;

            display: block !important;

            width: fit-content !important;

            height: 32px !important;

            margin-top: 0px;

            margin-left: 0 !important;

            padding: 0 12px !important;

            background: #123b63;

            color: white;

            border: none;

            border-radius: 7px;

            font-size: 13px;

            font-weight: 600;

            line-height: 1;

            cursor: pointer;

        }


        .btn-voltar-distribuicoes:hover {

            background: #09243d;

            transform:
                translateY(-1px);

        }


        .acoes-distribuicao {

            display: flex;

            align-items: center;
            justify-content: flex-end;

            gap: 8px;

            width: 100%;

            margin-top: 10px;

        }

        #editarDistribuicao {
            height: 34px;
            padding: 0 13px;

            border: 1px solid #2563EB;
            border-radius: 7px;

            background: #eff6ff;
            color: #2563EB;

            font-size: 11px;
            font-weight: 800;

            cursor: pointer;

            transition:
                background 0.18s ease,
                color 0.18s ease,
                border-color 0.18s ease,
                transform 0.18s ease;
        }

        #editarDistribuicao:hover {
            background: #2563EB;
            color: #ffffff;
            border-color: #2563EB;
        }

        #editarDistribuicao:active {
            transform: translateY(1px);
        }


        /* =========================================
           ESTADOS
        ========================================= */

        .estado-distribuicao {

            display: inline-block;

            width: fit-content;

            align-self: flex-end;

            margin-top: 3px;

            padding: 3px 8px;

            border-radius: 6px;

            background: #e8f5e9;

            color: #2f8f5b;

            font-size: 10.5px;

            font-weight: 700;

        }


        .estado-em-andamento {
            background: #fee2e2;
            color: #b91c1c;
        }

        /* Missão retornando à base */

        .cartao-distribuicao.cartao-retornando {
            background: #fff7ed;
            border-color: #fb923c;
            border-left-color: #f97316;
        }

        .cartao-distribuicao.cartao-retornando h2 {
            color: #c2410c;
        }

        .estado-retornando {
            background: #ffedd5;
            color: #c2410c;
        }


        /* =========================================
           ABAS
        ========================================= */

        .abas-distribuicoes {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));

            gap: 10px;

            margin-top: -5px;

            margin-bottom: 14px;

            padding: 8px;

            background: white;

            border: 1px solid #e2e8f0;
            border-radius: 14px;

            box-shadow:
                0 3px 12px rgba(15, 23, 42, 0.06);
        }


        .aba-distribuicao {
            min-height: 46px;

            display: flex;
            align-items: center;
            justify-content: center;

            border: 1px solid #dbe3ec;
            background: white;
            color: #334155;

            padding: 6px 14px;

            border-radius: 12px;

            font-size: 13px;
            font-weight: 700;

            cursor: pointer;

            box-shadow:
                0 3px 10px rgba(15, 23, 42, 0.06);

            transition:
                transform 0.18s ease,
                box-shadow 0.18s ease,
                border-color 0.18s ease,
                background 0.18s ease;
        }


        .aba-distribuicao:hover {
            transform: translateY(-2px);

            box-shadow:
                0 6px 16px rgba(15, 23, 42, 0.10);

            border-color: #94a3b8;
        }


        .aba-distribuicao.ativa {
            background: #123b63;
            color: white;
            border-color: #123b63;
        }

        /* =========================================
   ESTADO ATIVO DOS CARDS
========================================= */

        /* Nova missão */

        #abaNovaMissao.ativa {
            background: #2563eb;
            border-color: #2563eb;
            color: white;
        }


        /* Em andamento */

        #abaEmAndamento.ativa {
            background: #ef4444;
            border-color: #ef4444;
            color: white;
        }


        /* Histórico */

        #abaHistorico.ativa {
            background: #16a34a;
            border-color: #16a34a;
            color: white;
        }


        /* Gestão */

        #abaGestao.ativa {
            background: #123b63;
            border-color: #123b63;
            color: white;
        }

        /* =========================================
   IDENTIDADE DOS CARDS DE DISTRIBUIÇÕES
========================================= */

        /* Nova missão — ação principal */

        #abaNovaMissao {
            background: #eff6ff;
            border-color: #bfdbfe;
            color: #1d4ed8;
        }


        /* Em andamento — operação ativa */

        #abaEmAndamento {
            background: #fff7f7;
            border-color: #fecaca;
            color: #b91c1c;
        }


        /* Histórico — operações concluídas */

        #abaHistorico {
            background: #f0fdf4;
            border-color: #bbf7d0;
            color: #15803d;
        }


        /* Gestão — administração */

        #abaGestao {
            background: #f8fafc;
            border-color: #cbd5e1;
            color: #123b63;
        }


        /* =========================================
   FILTRO DO HISTÓRICO
========================================= */

        #filtroHistorico {
            display: flex;
            align-items: center;
            gap: 3px;

            flex-wrap: nowrap !important;
            overflow: visible;

            width: 100%;
            box-sizing: border-box;

            margin-bottom: 12px;
            padding: 8px 10px;

            background: #ffffff;

            border: 1px solid #dbe3ec;
            border-radius: 9px;

            box-shadow:
                0 2px 7px rgba(15, 23, 42, 0.05);
        }

        #filtroHistorico label:not(:first-child) {
            margin-left: 8px;
        }


        #filtroHistorico label {
            margin: 0 2px 0 0;

            color: #475569;

            font-size: 10px;
            font-weight: 800;

            white-space: nowrap;
        }


        #filtroClienteHistorico,
        #filtroDataHistorico,
        #filtroOperadorHistorico,
        #filtroAeronaveHistorico {
            height: 30px;

            box-sizing: border-box;

            flex-shrink: 1;
            min-width: 0;

            padding: 0 16px;

            border: 1px solid #cbd5e1;
            border-radius: 6px;

            background: #f8fafc;
            color: #0f172a;

            font-family:
                Arial,
                sans-serif;

            font-size: 11px;
            font-weight: 700;

            outline: none;

            transition:
                border-color 0.18s ease,
                box-shadow 0.18s ease,
                background 0.18s ease;
        }

        #filtroOperadorHistorico,
        #filtroAeronaveHistorico {
            padding-left: 8px;
            padding-right: 8px;
        }

        #filtroClienteHistorico,
        #filtroDataHistorico {
            flex-shrink: 0;
        }

        #filtroClienteHistorico {
            width: 180px;
        }

        #filtroDataHistorico {
            width: 135px;
        }

        #filtroOperadorHistorico {
            width: 190px;
        }

        #filtroAeronaveHistorico {
            width: 165px;
        }


        #filtroClienteHistorico.filtro-ativo,
        #filtroDataHistorico.filtro-ativo,
        #filtroOperadorHistorico.filtro-ativo,
        #filtroAeronaveHistorico.filtro-ativo {
            background: #eff6ff;

            border-color: #2563eb;

            color: #1d4ed8;

            box-shadow:
                0 0 0 1px rgba(37, 99, 235, 0.10);
        }


        #filtroHistorico button {
            height: 30px;

            margin: 0;
            white-space: nowrap;
            flex-shrink: 0;
            padding: 0 10px;

            border: 1px solid #cbd5e1;
            border-radius: 6px;

            background: #f8fafc;
            color: #475569;

            font-size: 10px;
            font-weight: 800;

            cursor: pointer;

            transition:
                background 0.18s ease,
                border-color 0.18s ease,
                color 0.18s ease;
        }

        #btnFiltroMensal {
            margin-left: auto !important;

            background: #eff6ff !important;
            border-color: #93c5fd !important;
            color: #1d4ed8 !important;
        }

        #btnFiltroMensal:hover {
            background: #dbeafe !important;
            border-color: #60a5fa !important;
            color: #1e40af !important;
        }

        #btnFiltroMensal.filtro-ativo {
            background: #2563eb !important;
            border-color: #2563eb !important;
            color: #ffffff !important;
        }

        .grupo-filtro-mensal {
            position: relative;
            flex-shrink: 0;
        }

        #areaFiltroMensal {
            position: absolute;

            top: calc(100% + 7px);
            right: 0;

            z-index: 20;

            width: 190px;
            box-sizing: border-box;

            padding: 10px;

            background: #ffffff;

            border: 1px solid #cbd5e1;
            border-radius: 8px;

            box-shadow:
                0 8px 20px rgba(15, 23, 42, 0.12);
        }

        #areaFiltroMensal label {
            display: block;

            margin: 0 0 6px 0 !important;

            color: #475569;

            font-size: 10px;
            font-weight: 800;
        }

        #filtroMesHistorico {
            width: 100%;
            height: 30px;

            box-sizing: border-box;

            padding: 0 8px;

            border: 1px solid #cbd5e1;
            border-radius: 6px;

            background: #f8fafc;
            color: #0f172a;

            font-family: Arial, sans-serif;
            font-size: 11px;
            font-weight: 700;

            outline: none;
        }

        #filtroMesHistorico:focus {
            background: #eff6ff;
            border-color: #2563eb;

            box-shadow:
                0 0 0 1px rgba(37, 99, 235, 0.10);
        }


        #filtroHistorico button:hover {
            background: #f1f5f9;
            border-color: #94a3b8;
            color: #123b63;
        }

        /* Garantir grelha do resumo da missão */

        .detalhe-distribuicao .grade-detalhe-missao {
            display: grid !important;

            grid-template-columns:
                repeat(5, minmax(0, 1fr)) !important;

            gap: 10px;

            width: 100%;
        }

        .grade-detalhe-missao {
            display: grid !important;

            grid-template-columns:
                repeat(5, minmax(0, 1fr)) !important;

            gap: 0;

            width: 100%;

            margin-bottom: 1px;

            padding: 6px 0px;

            background: #f8fafc;

            border: 1px solid #e2e8f0;
            border-radius: 8px;
        }


        .item-resumo-missao {
            display: flex;
            align-items: center;

            gap: 5px;

            min-width: 0;

            padding: 2px 10px;

            background: transparent;

            border: none;

            margin: 0;
        }


        .item-resumo-missao:not(:first-child) {
            border-left: 1px solid #cbd5e1;
        }


        .item-resumo-missao span {
            color: #64748b;

            font-size: 9.5px;
            font-weight: 600;

            white-space: nowrap;
        }


        .item-resumo-missao strong {
            color: #123b63;

            font-size: 11px;
            font-weight: 800;

            white-space: nowrap;
        }

        .status-ponto {
            padding: 3px 7px;

            border-radius: 999px;

            font-size: 9.5px;
            font-weight: 800;

            white-space: nowrap;
        }


        .status-ponto-pendente {
            background: #fff7ed;
            color: #c2410c;
        }


        .status-ponto-concluido {
            background: #ecfdf3;
            color: #15803d;
        }

        .status-detalhe-missao {
            display: flex;
            align-items: center;

            gap: 6px;
        }


        .status-detalhe-rotulo {
            color: #64748b;

            font-size: 10.5px;
            font-weight: 700;
        }

        .cabecalho-detalhe-missao {
            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 16px;

            margin-bottom: 14px;
        }


        .rotulo-detalhe-missao {
            display: block;

            margin-bottom: 2px;

            color: #64748b;

            font-size: 9.5px;
            font-weight: 700;

            letter-spacing: 0.7px;
        }


        .cabecalho-detalhe-missao h1 {
            margin: 0;

            color: #123b63;

            font-size: 20px;
            font-weight: 800;
        }

        .cabecalho-cartao-missao {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .titulo-data-missao {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
        }

        .hora-inicio-cartao {
            margin-left: auto;

            color: #64748b;

            font-size: 10px;
            font-weight: 700;

            white-space: nowrap;
        }

        .cabecalho-cartao-missao h2 {
            margin: 0;

            color: #123b63;

            font-size: 15px;
            font-weight: 900;

            white-space: nowrap;
        }

        .data-missao-historico {
            color: #94a3b8;

            font-size: 9.5px;
            font-weight: 600;

            white-space: nowrap;
        }

        .estado-distribuicao.estado-historico-concluido {
            margin-left: auto;

            padding: 2px 6px;

            background: #dcfce7;
            color: #166534;

            font-size: 8.5px;
            font-weight: 800;

            white-space: nowrap;
        }

        .estado-historico-concluido {
            margin-left: auto;
            background: #dcfce7;
            color: #166534;
            white-space: nowrap;
        }


        .estado-detalhe-missao {
            padding: 4px 9px;

            border-radius: 999px;

            font-size: 10.5px;
            font-weight: 800;

            white-space: nowrap;
        }


        .estado-detalhe-andamento {
            background: #fee2e2;
            color: #b91c1c;
        }


        .estado-detalhe-retornando {
            background: #ffedd5;
            color: #c2410c;
        }

        .estado-detalhe-concluido {
            background: #dcfce7;
            color: #166534;
        }

        .total-pontos-entrega {
            color: #64748b;

            font-size: 12px;
            font-weight: 600;
        }

        body:has(.detalhe-distribuicao) #filtroHistorico {
            display: none !important;
        }

        .resumo-operacional-historico {
            display: flex;
            align-items: center;
            gap: 6px;

            margin: 3px 0 2px;

            color: #334155;

            font-size: 10.5px;
            font-weight: 700;

            white-space: nowrap;
        }

        .resumo-operacional-historico strong {
            color: #123b63;
            font-weight: 800;
        }

        .resumo-operacional-historico span {
            display: inline-flex;
            align-items: center;
        }

        .tempo-historico-missao {
            display: flex;
            align-items: center;
            gap: 4px;

            margin: 1px 0 2px;

            color: #64748b;

            font-size: 9.5px;

            white-space: nowrap;
            flex-wrap: nowrap;
        }

        .tempo-historico-missao span {
            white-space: nowrap;
        }

        .historico-sem-resultados {
            grid-column: 1 / -1;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            min-height: 110px;

            padding: 18px;

            background: #ffffff;

            border: 1px dashed #cbd5e1;
            border-radius: 10px;

            text-align: center;
        }

        .historico-sem-resultados strong {
            color: #123b63;
            font-size: 13px;
            font-weight: 800;
        }

        .historico-sem-resultados span {
            margin-top: 4px;

            color: #94a3b8;
            font-size: 10px;
            font-weight: 600;
        }

        #confirmarChegadaBase {
            height: 32px;

            padding: 0 12px;

            border: 1px solid #f59e0b;
            border-radius: 8px;

            background: #f59e0b;
            color: #ffffff;

            font-size: 11px;
            font-weight: 800;

            cursor: pointer;

            box-shadow:
                0 2px 6px rgba(245, 158, 11, 0.18);

            transition:
                background 0.18s ease,
                border-color 0.18s ease,
                transform 0.18s ease,
                box-shadow 0.18s ease;
        }

        #confirmarChegadaBase:hover {
            background: #d97706;
            border-color: #d97706;

            transform: translateY(-1px);

            box-shadow:
                0 4px 10px rgba(217, 119, 6, 0.22);
        }

        #confirmarChegadaBase:active {
            transform: translateY(0);
        }


        /* =========================================
           TELEMÓVEL
        ========================================= */

        @media (max-width: 900px) {

            #conteudo {

                margin-left: 0;

                padding:
                    20px 16px;

            }


            #listaDistribuicoes {

                grid-template-columns:
                    1fr;

            }


            .cartao-distribuicao {

                max-width:
                    400px;

                padding:
                    8px 12px;

            }


            .detalhe-distribuicao {

                padding:
                    16px;

            }


            .detalhe-distribuicao h1 {

                margin-bottom:
                    10px;

                font-size:
                    22px;

            }


            .detalhe-distribuicao h2 {

                margin-bottom:
                    10px;

            }


            .detalhe-item {

                margin-bottom:
                    8px;

            }

        }


        @media (max-width: 600px) {

            #filtroHistorico {

                display: flex;

                flex-direction: column;

                align-items: flex-start;

                gap: 8px;

            }

</head>


<body>

    <script>

        fetch("menu.html")

            .then(function (resposta) {

                return resposta.text();

            })

            .then(function (menu) {

                document
                    .getElementById(
                        "menu-container"
                    )
                    .innerHTML = menu;


                const paginaAtual =
                    window.location.pathname
                        .split("/")
                        .pop();


                document
                    .querySelectorAll(
                        ".menu a"
                    )
                    .forEach(
                        function (link) {

                            const paginaLink =
                                link.getAttribute(
                                    "href"
                                );


                            if (

                                paginaAtual
                            ) {

                                link.classList.add(
                                    "ativo"
                                );

                            }

                        }
                    );

            });

    </script>


    <!-- =========================================
         JAVASCRIPT PRINCIPAL
    ========================================= -->

    <script>


        /* =========================================
           ELEMENTOS
        ========================================= */

        const lista =
            document.getElementById(
                "listaDistribuicoes"
            );


        const abaEmAndamento =
            document.getElementById(
                "abaEmAndamento"
            );


        const abaHistorico =
            document.getElementById(
                "abaHistorico"
            );


        const abaGestao =
            document.getElementById(
                "abaGestao"
            );


        const filtroHistorico =
            document.getElementById(
                "filtroHistorico"
            );


        const filtroDataHistorico =
            document.getElementById(
                "filtroDataHistorico"
            );


        const btnLimparFiltroHistorico =
            document.getElementById(
                "btnLimparFiltroHistorico"
            );

        const btnFiltroMensal =
            document.getElementById(
                "btnFiltroMensal"
            );

        const areaFiltroMensal =
            document.getElementById(
                "areaFiltroMensal"
            );

        const filtroMesHistorico =
            document.getElementById(
                "filtroMesHistorico"
            );


        /* =========================================
           LER DISTRIBUIÇÕES
        ========================================= */

        function obterDistribuicoes() {

            return JSON.parse(
                localStorage.getItem(
                    "distribuicoes"
                )
            ) || [];

        }


        /* =========================================
           MOSTRAR LISTA
        ========================================= */


        function mostrarLista(
            tipo,
            dataForcada,
            somentePendentes = false
        ) {

            lista.innerHTML = "";

            const filtroHistorico =
                document.getElementById(
                    "filtroHistorico"
                );

            if (filtroHistorico) {

                filtroHistorico.style.display =
                    tipo === "historico"
                        ? ""
                        : "none";
            }


            /* =====================================
               CONTROLAR FILTRO
            ====================================== */

            if (
                filtroHistorico
            ) {

                filtroHistorico.style.display =
                    tipo === "historico"
                        ? "flex"
                        : "none";

            }


            const distribuicoes =
                obterDistribuicoes();


            /* =====================================
               FILTRAR
            ====================================== */

            const distribuicoesFiltradas =
                distribuicoes

                    .filter(
                        function (
                            distribuicao
                        ) {

                            if (
                                !distribuicao
                            ) {

                                return false;

                            }


                            /* =====================
                               EM ANDAMENTO
                            ====================== */

                            if (
                                tipo ===
                                "andamento"
                            ) {

                                return (
                                    distribuicao.status ===
                                    "Em andamento" &&
                                    (
                                        !somentePendentes ||
                                        distribuicao.retornoBase !==
                                        "Em andamento"
                                    )
                                );

                            }


                            /* =====================
                               HISTÓRICO
                            ====================== */

                            if (
                                distribuicao.status !==
                                "Concluída"
                            ) {

                                return false;

                            }


                            /*
 * Se existir filtro
 * por dia, aplicar.
 */

                            console.log(
                                "FILTRO HISTÓRICO:",
                                filtroDataHistorico.value
                            );

                            const pesquisaCliente =
                                (
                                    document.getElementById(
                                        "filtroClienteHistorico"
                                    )?.value || ""
                                )
                                    .trim()
                                    .toLowerCase();


                            if (pesquisaCliente) {

                                const encontrouCliente =
                                    Array.isArray(
                                        distribuicao.clientes
                                    ) &&
                                    distribuicao.clientes.some(
                                        function (cliente) {

                                            const codigo =
                                                String(
                                                    cliente.codigo || ""
                                                )
                                                    .toLowerCase();

                                            const nome =
                                                String(
                                                    cliente.nome || ""
                                                )
                                                    .toLowerCase();


                                            return (
                                                codigo.includes(
                                                    pesquisaCliente
                                                ) ||
                                                nome.includes(
                                                    pesquisaCliente
                                                )
                                            );

                                        }
                                    );


                                if (!encontrouCliente) {
                                    return false;
                                }

                            }

                            const operadorFiltro =
                                document.getElementById(
                                    "filtroOperadorHistorico"
                                )?.value || "";


                            if (operadorFiltro) {

                                if (
                                    String(
                                        distribuicao.distribuidor || ""
                                    ) !== operadorFiltro
                                ) {

                                    return false;

                                }

                            }

                            const aeronaveFiltro =
                                document.getElementById(
                                    "filtroAeronaveHistorico"
                                )?.value || "";


                            if (aeronaveFiltro) {

                                if (
                                    String(
                                        distribuicao.veiculo || ""
                                    ) !== aeronaveFiltro
                                ) {

                                    return false;

                                }

                            }

                            const mesFiltro =
                                filtroMesHistorico
                                    ? filtroMesHistorico.value
                                    : "";

                            if (mesFiltro) {

                                const dataISO =
                                    converterDataParaISO(
                                        distribuicao.data
                                    );

                                if (
                                    dataISO.substring(0, 7) !==
                                    mesFiltro
                                ) {
                                    return false;
                                }
                            }


                            const dataFiltro =
                                dataForcada ||
                                (
                                    filtroDataHistorico
                                        ? filtroDataHistorico.value
                                        : ""
                                );


                            if (dataFiltro) {

                                const partes =
                                    dataFiltro.split("-");


                                const dataFormatada =
                                    partes[2] +
                                    "/" +
                                    partes[1] +
                                    "/" +
                                    partes[0];


                                if (
                                    distribuicao.data !==
                                    dataFormatada
                                ) {
                                    return false;
                                }

                            }


                            return true;

                        }
                    )


                    /* =================================
                       ORDENAR
                    ================================= */

                    .sort(
                        function (
                            a,
                            b
                        ) {

                            const dataA =
                                a.fimTimestamp ||
                                a.inicioTimestamp ||
                                0;


                            const dataB =
                                b.fimTimestamp ||
                                b.inicioTimestamp ||
                                0;


                            return (
                                dataB -
                                dataA
                            );

                        }
                    );


            /* =====================================
               TÍTULO
            ====================================== */

            const tituloLista =
                document.getElementById(
                    "tituloListaDistribuicoes"
                );


            if (
                tituloLista
            ) {

                if (
                    tipo === "andamento"
                ) {

                    tituloLista.textContent =
                        distribuicoesFiltradas.length +
                        (
                            distribuicoesFiltradas.length === 1
                                ? " missão em andamento"
                                : " missões em andamento"
                        );

                } else {

                    const pesquisaClienteAtiva =
                        (
                            document.getElementById(
                                "filtroClienteHistorico"
                            )?.value || ""
                        ).trim() !== "";

                    const dataAtiva =
                        Boolean(
                            dataForcada ||
                            filtroDataHistorico?.value
                        );

                    const operadorAtivo =
                        Boolean(
                            filtroOperadorHistorico?.value
                        );

                    const aeronaveAtiva =
                        Boolean(
                            filtroAeronaveHistorico?.value
                        );

                    const mesAtivo =
                        Boolean(
                            filtroMesHistorico?.value
                        );

                    const filtrosAtivos =
                        pesquisaClienteAtiva ||
                        dataAtiva ||
                        operadorAtivo ||
                        aeronaveAtiva ||
                        mesAtivo;


                    if (mesAtivo) {

                        const mesSelecionado =
                            filtroMesHistorico.value;


                        const totalEntregasMes =
                            distribuicoes.reduce(
                                function (
                                    total,
                                    distribuicao
                                ) {

                                    if (
                                        !distribuicao ||
                                        !Array.isArray(
                                            distribuicao.clientes
                                        )
                                    ) {

                                        return total;

                                    }


                                    const dataISO =
                                        converterDataParaISO(
                                            distribuicao.data
                                        );


                                    if (
                                        dataISO.substring(
                                            0,
                                            7
                                        ) !==
                                        mesSelecionado
                                    ) {

                                        return total;

                                    }


                                    const pontosAtendidos =
                                        distribuicao.clientes.filter(
                                            function (cliente) {

                                                return (
                                                    cliente.statusEntrega ===
                                                    "Concluída"
                                                );

                                            }
                                        ).length;


                                    return (
                                        total +
                                        pontosAtendidos
                                    );

                                },
                                0
                            );


                        const partesMes =
                            filtroMesHistorico.value.split("-");

                        const dataMes =
                            new Date(
                                Number(partesMes[0]),
                                Number(partesMes[1]) - 1,
                                1
                            );

                        let nomeMes =
                            dataMes.toLocaleDateString(
                                "pt-PT",
                                {
                                    month: "long",
                                    year: "numeric"
                                }
                            );

                        nomeMes =
                            nomeMes.charAt(0).toUpperCase() +
                            nomeMes.slice(1);


                        tituloLista.textContent =
                            distribuicoesFiltradas.length +
                            (
                                distribuicoesFiltradas.length === 1
                                    ? " missão"
                                    : " missões"
                            ) +
                            " · " +
                            totalEntregasMes +
                            (
                                totalEntregasMes === 1
                                    ? " entrega"
                                    : " entregas"
                            ) +
                            " · " +
                            nomeMes;

                    } else if (filtrosAtivos) {

                        tituloLista.textContent =
                            distribuicoesFiltradas.length +
                            (
                                distribuicoesFiltradas.length === 1
                                    ? " missão encontrada"
                                    : " missões encontradas"
                            );

                    } else {

                        tituloLista.textContent =
                            distribuicoesFiltradas.length +
                            (
                                distribuicoesFiltradas.length === 1
                                    ? " missão concluída"
                                    : " missões concluídas"
                            );

                    }

                }

            }

            /* =====================================
               SEM RESULTADOS
            ====================================== */

            if (
                distribuicoesFiltradas.length ===
                0
            ) {

                lista.innerHTML =
                    tipo === "andamento"

                        ? `
                            <p>
                                Nenhuma missão em andamento.
                            </p>
                        `

                        : `
    <div class="historico-sem-resultados">
        <strong>
            Nenhuma missão encontrada
        </strong>

        <span>
            Altere ou limpe os filtros para ver outras missões.
        </span>
    </div>
`;

                return;

            }


            /* =====================================
               CRIAR CARTÕES
            ====================================== */

            distribuicoesFiltradas.forEach(
                function (
                    distribuicao,
                    indice
                ) {


                    const clientes =
                        Array.isArray(
                            distribuicao.clientes
                        )
                            ? distribuicao.clientes
                            : [];


                    lista.innerHTML += `

                        <div
    class="
        cartao-distribuicao
        ${distribuicao.retornoBase === "Em andamento"
                            ? "cartao-retornando"
                            : ""
                        }
    "
    onclick="
        abrirDistribuicao(
            ${distribuicao.id}
        )
    "
>

                            <div class="cabecalho-cartao-missao">

    <div class="titulo-data-missao">

        <h2>
            Missão ${indice + 1}
        </h2>

        ${tipo === "historico"
                            ? `
                <span class="data-missao-historico">
                    ${distribuicao.data || "-"}
                </span>
              `
                            : ""
                        }

    </div>


    ${tipo === "historico"
                            ? `
            <span class="estado-distribuicao estado-historico-concluido">
                Concluída
            </span>
          `
                            : `
            <span class="hora-inicio-cartao">
                Início ${distribuicao.horaInicio || "-"}
            </span>
          `
                        }

</div>


                            <div
                                class="info-distribuicao"
                            >

                                ${tipo !== "historico"
                            ? `
        
      `
                            : ""
                        }


                                ${tipo === "historico"

                            ? `

        <p class="resumo-operacional-historico">

            <strong>
                ${distribuicao.veiculo || "-"}
            </strong>

            <span>·</span>

            <span>
                ${distribuicao.distribuidor || "-"}
            </span>

            <span>·</span>

            <span>
    <strong>
        ${clientes.length}
    </strong>

    &nbsp;

    ${clientes.length === 1
                                ? "entrega"
                                : "entregas"
                            }
</span>

        </p>

    `

                            : `

        <p>

            Operador:

            <strong>
                ${distribuicao.distribuidor || "-"}
            </strong>

        </p>


        <p>

            Aeronave:

            <strong>
                ${distribuicao.veiculo || "-"}
            </strong>

            <span style="margin-left: 8px;">
                · Pontos:
            </span>

            <strong>
                ${clientes.length}
            </strong>

        </p>

    `
                        }


                                ${tipo ===
                            "historico"

                            ? `

                                            <p class="tempo-historico-missao">

    <span>
        Início:
        <strong>
            ${distribuicao.horaInicio || "-"}
        </strong>
    </span>

    <span>·</span>

    <span>
        Fim:
        <strong>
            ${distribuicao.horaFim || "-"}
        </strong>
    </span>

    <span>·</span>

    <span>
        Duração:
        <strong>
            ${distribuicao.duracao !== undefined
                                ? formatarDuracao(
                                    distribuicao.duracao
                                )
                                : "-"
                            }
        </strong>
    </span>

</p>

                                        `

                            : ""
                        }


                                ${tipo !== "historico"
                            ? `
        <span
            class="
                estado-distribuicao

                ${distribuicao.retornoBase === "Em andamento"
                                ? "estado-retornando"
                                : distribuicao.status === "Em andamento"
                                    ? "estado-em-andamento"
                                    : ""
                            }
            "
        >

            ${distribuicao.retornoBase === "Em andamento"
                                ? "Retornando à base"
                                : distribuicao.status || "Concluída"
                            }

        </span>
      `
                            : ""
                        }


                            </div>

                        </div>

                    `;

                }
            );

        }

        function concluirEntrega(idDistribuicao, codigoCliente) {

            const distribuicoes =
                obterDistribuicoes();

            const distribuicao =
                distribuicoes.find(
                    function (item) {

                        return (
                            String(item.id) ===
                            String(idDistribuicao)
                        );

                    }
                );


            if (!distribuicao) {
                return;
            }

            document.getElementById(
                "filtroHistorico"
            )?.style.setProperty(
                "display",
                "none"
            );

            const cliente =
                distribuicao.clientes.find(
                    function (item) {

                        return (
                            String(item.codigo) ===
                            String(codigoCliente)
                        );

                    }
                );


            if (!cliente) {
                return;
            }


            cliente.statusEntrega =
                "Concluída";

            cliente.horaEntrega =
                new Date().toLocaleTimeString(
                    "pt-PT",
                    {
                        hour: "2-digit",
                        minute: "2-digit"
                    }
                );

            const todasEntregasConcluidas =
                distribuicao.clientes.every(
                    function (cliente) {

                        return (
                            cliente.statusEntrega ===
                            "Concluída"
                        );

                    }
                );


            if (todasEntregasConcluidas) {

                distribuicao.status =
                    "Em andamento";

                distribuicao.retornoBase =
                    "Em andamento";

            }


            localStorage.setItem(
                "distribuicoes",
                JSON.stringify(distribuicoes)
            );


            abrirDistribuicao(
                idDistribuicao
            );

        }

        let abaRetornoDetalhe = "andamento";

        /* =========================================
           ABRIR DISTRIBUIÇÃO
        ========================================= */

        function abrirDistribuicao(
            id
        ) {

            const distribuicoes =
                obterDistribuicoes();


            const distribuicao =
                distribuicoes.find(
                    function (
                        item
                    ) {

                        return (
                            String(item.id) ===
                            String(id)
                        );

                    }
                );


            if (
                !distribuicao
            ) {

                return;

            }



            /*
 * Registar detalhe da missão
 * no histórico do navegador
 */

            const abaOrigem =
                distribuicao.status === "Concluída"
                    ? "historico"
                    : "andamento";


            history.replaceState(
                {
                    tela: "lista-missoes",
                    aba: abaOrigem
                },
                "",
                window.location.href
            );


            history.pushState(
                {
                    tela: "detalhe-missao",
                    id: String(id),
                    aba: abaOrigem
                },
                "",
                window.location.href
            );

            /* =====================================
               CLIENTES
            ====================================== */

            const clientesDaDistribuicao =
                Array.isArray(
                    distribuicao.clientes
                )

                    ? distribuicao.clientes
                        .slice()

                    : [];

            /* =====================================
               MOSTRAR DETALHES
            ====================================== */

            lista.innerHTML = `

                <div
                    class="detalhe-distribuicao"
                >

     <div class="cabecalho-detalhe-missao">

    <div>
        <span class="rotulo-detalhe-missao">
            MISSÃO OPERACIONAL
        </span>

        <h1>
            Missão
        </h1>
    </div>

    <div class="status-detalhe-missao">

    <span class="status-detalhe-rotulo">
        Status:
    </span>

    <span
    class="
        estado-detalhe-missao
        ${distribuicao.status === "Concluída"
                    ? "estado-detalhe-concluido"
                    : distribuicao.retornoBase === "Em andamento"
                        ? "estado-detalhe-retornando"
                        : "estado-detalhe-andamento"
                }
    "
>
    ${distribuicao.status === "Concluída"
                    ? "Missão concluída"
                    : distribuicao.retornoBase === "Em andamento"
                        ? "Retornando à base"
                        : "Em andamento"
                }
</span>

</div>

</div>


<div
    class="grade-detalhe-missao"
    style="
        grid-template-columns:
            repeat(
                ${distribuicao.horaFim ? 5 : 4},
                minmax(0, 1fr)
            ) !important;
    "
>

<div class="item-resumo-missao">

        <span>Operador</span>

        <strong>
            ${distribuicao.distribuidor ||
                "Não registado"
                }
        </strong>
    </div>


<div class="item-resumo-missao">

        <span>Aeronave</span>

        <strong>
            ${distribuicao.veiculo ||
                "Não registada"
                }
        </strong>
    </div>


<div class="item-resumo-missao">

        <span>Data</span>

        <strong>
            ${distribuicao.data ||
                "Não registada"
                }
        </strong>
    </div>


<div class="item-resumo-missao">

    <span>Início</span>

    <strong>
        ${distribuicao.horaInicio ||
                "Não registado"
                }

        ${distribuicao.tempoEstimadoMinutos
                    ? `
                · ${distribuicao.tempoEstimadoMinutos} min
              `
                    : ""
                }
    </strong>

</div>


    ${distribuicao.horaFim

                    ? `

            <div class="item-resumo-missao">

                <span>Fim</span>

                <strong>
                    ${distribuicao.horaFim}
                </strong>

            </div>

        `

                    : ""
                }

</div>


                   <div class="cabecalho-pontos-entrega">

    <div>

        /* =========================================

        ========================================= */

        function formatarDuracao(
            segundos
        ) {

            segundos =
                Number(
                    segundos || 0
                );


            const horas =
                Math.floor(
                    segundos / 3600
                );


            const minutos =
                Math.floor(
                    (segundos % 3600) / 60
                );


            if (horas > 0) {

                return (
                    horas +
                    "h " +
                    minutos +
                    "m"
                );

            }


            return (
                minutos +
                "m"
            );

        }


        /* =========================================
           CONVERTER DATA PARA YYYY-MM-DD
        ========================================= */

        function converterDataParaISO(
            dataTexto
        ) {

            if (
                !dataTexto
            ) {

                return "";

            }


            const partes =
                dataTexto.split("/");


            if (
                partes.length !== 3
            ) {

                return "";

            }


            return (
                partes[2] +
                "-" +
                partes[1] +
                "-" +
                partes[0]
            );

        }

                                "
                            >
                                · Operador:
                            </span>

                            <strong>
                                ${missao.distribuidor || "-"}
                            </strong>
                        </p>

                    </div>

                </div>

            `;

                }
            );

        }


        /* =========================================
           INICIALIZAÇÃO A PARTIR DA URL
        ========================================= */

        function inicializarAPartirDaURL() {

            const parametros =
                new URLSearchParams(
                    window.location.search
                );


            const id =
                parametros.get(
                    "id"
                );


            const modo =
                parametros.get(
                    "modo"
                );


            const data =
                parametros.get(
                    "data"
                );


            const mes =
                parametros.get(
                    "mes"
                );


            /* =====================================
               ABRIR DISTRIBUIÇÃO ESPECÍFICA
            ====================================== */

            if (
                id
            ) {

                abrirDistribuicao(
                    id
                );

                return;

            }


            /* =====================================
               ABRIR HISTÓRICO
            ====================================== */

            if (
                modo ===
                "historico"
            ) {

                ativarAba(
                    "historico"
                );


                /*
                 * Se foi enviada uma data
                 * específica pelo Dashboard,
                 * aplicar diretamente.
                 */

                if (
                    data
                ) {

                    filtroDataHistorico.value =
                        data;

                }


                /*
                 * Se foi enviado um mês,
                 * mostramos o histórico desse
                 * mês através de uma filtragem
                 * especial.
                 */

                if (
                    mes
                ) {

                    mostrarHistoricoPorMes(
                        mes
                    );

                    return;

                }


                mostrarLista(
                    "historico",
                    data
                );

                return;

            }

            /* =====================================
                ABRIR MISSÕES PENDENTES
            ====================================== */

            if (
                modo ===
                "pendentes"
            ) {

                ativarAba(
                    "andamento"
                );

                mostrarLista(
                    "andamento",
                    null,
                    true
                );

                return;

            }

            /* =====================================
                ABRIR PONTOS ATENDIDOS
            ====================================== */

            if (
                modo ===
                "pontos-atendidos"
            ) {

                mostrarPontosAtendidos(
                    data
                );

                return;

            }

            /* =====================================
                ABRIR PONTOS PENDENTES
            ====================================== */

            if (
                modo ===
                "pontos-pendentes"
            ) {

                mostrarPontosPendentes(
                    data
                );

                return;

            }


            /* =====================================
               COMPORTAMENTO NORMAL
            ====================================== */

            mostrarLista(
                "andamento"
            );

        }


        /* =========================================
           HISTÓRICO POR MÊS
        ========================================= */

        function mostrarHistoricoPorMes(
            mesSelecionado
        ) {

            lista.innerHTML = "";


            filtroHistorico.style.display =
                "block";


            /*
             * Retiramos o filtro diário
             * porque o Dashboard pediu
             * o histórico mensal.
             */

            filtroDataHistorico.value =
                "";


            const distribuicoes =
                obterDistribuicoes();


            const distribuicoesFiltradas =
                distribuicoes

                    .filter(
                        function (
                            distribuicao
                        ) {

                            if (
                                !distribuicao
                            ) {

                                return false;

                            }


                            if (
                                distribuicao.status !==
                                "Concluída"
                            ) {

                                return false;

                            }


                            const dataISO =
                                converterDataParaISO(
                                    distribuicao.data
                                );


                            return (
                                dataISO.substring(
                                    0,
                                    7
                                ) ===
                                mesSelecionado
                            );

                        }
                    )


                    .sort(
                        function (
                            a,
                            b
                        ) {

                            const dataA =
                                a.fimTimestamp ||
                                a.inicioTimestamp ||
                                0;


                            const dataB =
                                b.fimTimestamp ||
                                b.inicioTimestamp ||
                                0;


                            return (
                                dataB -
                                dataA
                            );

                        }
                    );


            /* =====================================
   TOTAL DE ENTREGAS DO MÊS
====================================== */

            let totalEntregasMes =
                0;


            distribuicoes.forEach(
                function (
                    distribuicao
                ) {

                    if (
                        !distribuicao ||
                        !Array.isArray(
                            distribuicao.clientes
                        )
                    ) {

                        return;

                    }


                    const dataISO =
                        converterDataParaISO(
                            distribuicao.data
                        );


                    if (
                        dataISO.substring(
                            0,
                            7
                        ) !==
                        mesSelecionado
                    ) {

                        return;

                    }


                    const pontosAtendidos =
                        distribuicao.clientes.filter(
                            function (cliente) {

                                return (
                                    cliente.statusEntrega ===
                                    "Concluída"
                                );

                            }
                        ).length;


                    totalEntregasMes +=
                        pontosAtendidos;

                }
            );


            /* =====================================
               TÍTULO
            ====================================== */

            const tituloLista =
                document.getElementById(
                    "tituloListaDistribuicoes"
                );


            if (
                tituloLista
            ) {

                tituloLista.textContent =
                    distribuicoesFiltradas.length +
                    " distribuições concluídas no mês" +
                    " · " +
                    totalEntregasMes +
                    " entregas";

            }


            if (
                distribuicoesFiltradas.length ===
                0
            ) {

                lista.innerHTML = `

                    <p>

                        Nenhuma missão concluída neste mês.

                    </p>

                `;

                return;

            }


            distribuicoesFiltradas.forEach(
                function (
                    distribuicao,
                    indice
                ) {

                    const clientes =
                        Array.isArray(
                            distribuicao.clientes
                        )
                            ? distribuicao.clientes
                            : [];


                    lista.innerHTML += `

                        <div
                            class="cartao-distribuicao"

                            onclick="
                                abrirDistribuicao(
                                    ${distribuicao.id}
                                )
                            "
                        >

                            <div class="cabecalho-cartao-missao">

    <div class="titulo-data-missao">

        <h2>
            Missão ${indice + 1}
        </h2>

        <span class="data-missao-historico">
            ${distribuicao.data || "-"}
        </span>

    </div>

    <span
        class="
            estado-distribuicao
            estado-historico-concluido
        "
    >
        Concluída
    </span>

</div>


                            <div
                                class="info-distribuicao"
                            >

                                <p>

                                    Data:

                                    <strong>

                                        ${distribuicao.data || "-"}

                                    </strong>

                                </p>


                                <p class="resumo-operacional-historico">

    <strong>
        ${distribuicao.veiculo || "-"}
    </strong>

    <span>·</span>

    <span>
        ${distribuicao.distribuidor || "-"}
    </span>

    <span>·</span>

    <span>
        <strong>
            ${clientes.length}
        </strong>

        &nbsp;

        ${clientes.length === 1
                            ? "entrega"
                            : "entregas"
                        }
    </span>

</p>


                                <div
                                    style="
                                        display:
                                            flex;
                                        gap:
                                            20px;
                                        flex-wrap:
                                            wrap;
                                    "
                                >

                                    ${distribuicao.horaInicio

                            ? `

                                                <p class="tempo-historico-missao">

    <span>
        Início:
        <strong>
            ${distribuicao.horaInicio || "-"}
        </strong>
    </span>

    <span>·</span>

    <span>
        Fim:
        <strong>
            ${distribuicao.horaFim || "-"}
        </strong>
    </span>

    <span>·</span>

    <span>
        Duração:
        <strong>
            ${distribuicao.duracao !== undefined
                                ? formatarDuracao(
                                    distribuicao.duracao
                                )
                                : "-"
                            }
        </strong>
    </span>

</p>

                                        `

                            : ""
                        }


                                ${tipo !== "historico"
                            ? `
        <span
            class="
                estado-distribuicao

                ${distribuicao.retornoBase === "Em andamento"
                                ? "estado-retornando"
                                : distribuicao.status === "Em andamento"
                                    ? "estado-em-andamento"
                                    : ""
                            }
            "
        >

            ${distribuicao.retornoBase === "Em andamento"
                                ? "Retornando à base"
                                : distribuicao.status || "Concluída"
                            }

        </span>
      `
                            : ""
                        }

                            </div>

                        </div>

                    `;

                }
            );

        }


        /* =========================================
           INICIAR
        ========================================= */

        window.addEventListener(
            "popstate",
            function (event) {

                const estado =
                    event.state;


                if (
                    estado &&
                    estado.tela === "lista-missoes" &&
                    estado.aba === "historico"
                ) {

                    ativarAba(
                        "historico"
                    );

                    mostrarLista(
                        "historico"
                    );

                    return;
                }


                mostrarDistribuicoes();

            }
        );

        inicializarAPartirDaURL();


    </script>


</body>

</html>
