<!DOCTYPE html>
<html lang="pt">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="menu.css">

    <style>
        body {

            font-family: Arial, sans-serif;

            margin: 0;

            padding: 0;

            background: #f4f6f8;

            color: #1f2933;

        }


        #conteudo {

            margin-left: 230px;

            padding: 78px 30px 24px;

        }


        h1 {

            margin-top: 0;

            margin-bottom: 25px;

            font-size: 28px;

        }


        /* =========================================
           LISTA DE DISTRIBUIÇÕES
        ========================================= */

        #listaDistribuicoes {

            display: grid;

            grid-template-columns:
                repeat(5, minmax(0, 1fr));

            gap: 10px;

            align-items: start;

        }

        @media (max-width: 1500px) {

            #listaDistribuicoes {
                grid-template-columns:
                    repeat(4, minmax(0, 1fr));
            }

        }


        @media (max-width: 1200px) {

            #listaDistribuicoes {
                grid-template-columns:
                    repeat(3, minmax(0, 1fr));
            }

        }


        .cartao-distribuicao {

            background: white;

            border: 1px solid #e1e6eb;
            border-left: 4px solid #ef4444;

            border-radius: 11px;

            padding: 8px 11px;

            width: 100%;
            box-sizing: border-box;

            box-shadow:
                0 2px 7px rgba(16, 24, 40, 0.05);

            cursor: pointer;

            transition:
                transform 0.18s ease,
                box-shadow 0.18s ease,
                border-color 0.18s ease;

        }


        .cartao-distribuicao:hover {

            transform:
                translateY(-3px);

            box-shadow:
                0 6px 16px rgba(16, 24, 40, 0.10);

        }


        .cartao-distribuicao h2 {

            margin: 0 0 5px 0;

            color: #123b63;

            font-size: 14px;
            font-weight: 800;

        }


        .info-distribuicao {

            display: flex;
            flex-direction: column;

            gap: 0;

            color: #667085;

            font-size: 11.5px;
            line-height: 1.25;

        }


        .info-distribuicao strong {

            color: #1f2933;

        }


        .info-distribuicao p {

            margin: 1px 0;

        }


        /* =========================================
           DETALHES DA DISTRIBUIÇÃO
        ========================================= */

        .detalhe-distribuicao {
            background: #ffffff;

            border: 1px solid #e1e6eb;
            border-radius: 12px;

            padding: 16px 18px;

            box-shadow:
                0 2px 8px rgba(16, 24, 40, 0.06);

            max-width: 900px;
        }


        .detalhe-distribuicao h2 {

            margin-top: 0;

            margin-bottom: 20px;

            color: #123b63;

        }


        .detalhe-item {
            margin-bottom: 7px;
            color: #667085;

            font-size: 13px;
        }


        .detalhe-item strong {

            color: #1f2933;

        }


        /* =========================================
           CLIENTES DA DISTRIBUIÇÃO
        ========================================= */

        .clientes-da-distribuicao {

            display: flex;

            flex-direction: column;

            gap: 8px;

            margin-bottom: 15px;

        }


        .cliente-distribuicao {

            padding: 10px 12px;

            background: #f8fafc;

            border: 1px solid #e5e7eb;

            border-radius: 8px;

            color: #1f2933;

            font-size: 14px;

        }


        /* =========================================
           BOTÕES
        ========================================= */

        #finalizarDistribuicao {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            width: fit-content;

            height: 32px;

            margin-top: 10px;

            padding: 0 12px;

            background: #2f8f5b;

            color: white;

            border: none;

            border-radius: 7px;

            font-size: 13px;

            font-weight: 600;

            line-height: 1;

            cursor: pointer;

        }


        #finalizarDistribuicao:hover {

            background: #246b44;

            transform:
                translateY(-1px);

        }


        #finalizarDistribuicao:disabled {

            background: #aab4bd;

            cursor: not-allowed;

            transform: none;

            opacity: 0.8;

        }


        .btn-voltar-distribuicoes {

            position: relative;

            top: -2px;

            display: block !important;

            width: fit-content !important;

            height: 32px !important;

            margin-top: 15px;

            margin-left: 0 !important;

            padding: 0 12px !important;

            background: #123b63;

            color: white;

            border: none;

            border-radius: 7px;

            font-size: 13px;

            font-weight: 600;

            line-height: 1;

            cursor: pointer;

        }


        .btn-voltar-distribuicoes:hover {

            background: #09243d;

            transform:
                translateY(-1px);

        }


        .acoes-distribuicao {

            display: flex;

            align-items: center;

            gap: 8px;

            margin-top: 10px;

        }


        /* =========================================
           ESTADOS
        ========================================= */

        .estado-distribuicao {

            display: inline-block;

            width: fit-content;

            align-self: flex-end;

            margin-top: 3px;

            padding: 3px 8px;

            border-radius: 6px;

            background: #e8f5e9;

            color: #2f8f5b;

            font-size: 10.5px;

            font-weight: 700;

        }


        .estado-em-andamento {
            background: #fee2e2;
            color: #b91c1c;
        }

        /* Missão retornando à base */

        .cartao-distribuicao.cartao-retornando {
            background: #fff7ed;
            border-color: #fb923c;
            border-left-color: #f97316;
        }

        .cartao-distribuicao.cartao-retornando h2 {
            color: #c2410c;
        }

        .estado-retornando {
            background: #ffedd5;
            color: #c2410c;
        }


        /* =========================================
           ABAS
        ========================================= */

        .abas-distribuicoes {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));

            gap: 10px;

            margin-bottom: 14px;

            padding: 10px;

            background: white;

            border: 1px solid #e2e8f0;
            border-radius: 14px;

            box-shadow:
                0 3px 12px rgba(15, 23, 42, 0.06);
        }


        .aba-distribuicao {
            min-height: 54px;

            display: flex;
            align-items: center;
            justify-content: center;

            border: 1px solid #dbe3ec;
            background: white;
            color: #334155;

            padding: 9px 14px;

            border-radius: 12px;

            font-size: 13px;
            font-weight: 700;

            cursor: pointer;

            box-shadow:
                0 3px 10px rgba(15, 23, 42, 0.06);

            transition:
                transform 0.18s ease,
                box-shadow 0.18s ease,
                border-color 0.18s ease,
                background 0.18s ease;
        }


        .aba-distribuicao:hover {
            transform: translateY(-2px);

            box-shadow:
                0 6px 16px rgba(15, 23, 42, 0.10);

            border-color: #94a3b8;
        }


        .aba-distribuicao.ativa {
            background: #123b63;
            color: white;
            border-color: #123b63;
        }

        /* =========================================
   ESTADO ATIVO DOS CARDS
========================================= */

        /* Nova missão */

        #abaNovaMissao.ativa {
            background: #2563eb;
            border-color: #2563eb;
            color: white;
        }


        /* Em andamento */

        #abaEmAndamento.ativa {
            background: #ef4444;
            border-color: #ef4444;
            color: white;
        }


        /* Histórico */

        #abaHistorico.ativa {
            background: #16a34a;
            border-color: #16a34a;
            color: white;
        }


        /* Gestão */

        #abaGestao.ativa {
            background: #123b63;
            border-color: #123b63;
            color: white;
        }

        /* =========================================
   IDENTIDADE DOS CARDS DE DISTRIBUIÇÕES
========================================= */

        /* Nova missão — ação principal */

        #abaNovaMissao {
            background: #eff6ff;
            border-color: #bfdbfe;
            color: #1d4ed8;
        }


        /* Em andamento — operação ativa */

        #abaEmAndamento {
            background: #fff7f7;
            border-color: #fecaca;
            color: #b91c1c;
        }


        /* Histórico — operações concluídas */

        #abaHistorico {
            background: #f0fdf4;
            border-color: #bbf7d0;
            color: #15803d;
        }


        /* Gestão — administração */

        #abaGestao {
            background: #f8fafc;
            border-color: #cbd5e1;
            color: #123b63;
        }


        /* =========================================
           FILTRO DO HISTÓRICO
        ========================================= */

        #filtroHistorico {

            margin-bottom: 20px;

            padding: 14px;

            background: white;

            border: 1px solid #e1e6eb;

            border-radius: 10px;

        }


        #filtroHistorico label {

            color: #667085;

            font-size: 13px;

            margin-right: 8px;

        }


        #filtroDataHistorico {

            padding: 6px 8px;

            border:
                1px solid #d5dce3;

            border-radius: 6px;

            font-family: Arial, sans-serif;

        }


        #filtroHistorico button {

            margin-left: 8px;

            padding: 6px 10px;

            border:
                1px solid #d5dce3;

            background: white;

            color: #667085;

            border-radius: 6px;

            cursor: pointer;

        }


        #filtroHistorico button:hover {

            background: #f0f4f7;

        }


        /* =========================================
           TELEMÓVEL
        ========================================= */

        @media (max-width: 900px) {

            #conteudo {

                margin-left: 0;

                padding:
                    20px 16px;

            }


            #listaDistribuicoes {

                grid-template-columns:
                    1fr;

            }


            .cartao-distribuicao {

                max-width:
                    400px;

                padding:
                    8px 12px;

            }


            .detalhe-distribuicao {

                padding:
                    16px;

            }


            .detalhe-distribuicao h1 {

                margin-bottom:
                    10px;

                font-size:
                    22px;

            }


            .detalhe-distribuicao h2 {

                margin-bottom:
                    10px;

            }


            .detalhe-item {

                margin-bottom:
                    8px;

            }

        }


        @media (max-width: 600px) {

            #filtroHistorico {

                display: flex;

                flex-direction: column;

                align-items: flex-start;

                gap: 8px;

            }


            #filtroHistorico label {

                margin-right: 0;

            }


            #filtroHistorico button {

                margin-left: 0;

            }

        }
    </style>


    <title>Distribuições</title>

</head>


<body>


    <!-- =========================================
         CABEÇALHO
    ========================================= -->

    <header class="topo">

        <div class="logo">
            PRIMO PEÇAS
        </div>

        <div class="topo-distribuicoes">

            <h1>
                Missões
            </h1>

            <p id="tituloListaDistribuicoes"></p>

        </div>

    </header>


    <!-- =========================================
         MENU
    ========================================= -->

    <div id="menu-container"></div>


    <!-- =========================================
         CONTEÚDO
    ========================================= -->

    <main id="conteudo">


        <!-- =====================================
             ABAS
        ====================================== -->

        <div class="abas-distribuicoes">

            <button id="abaNovaMissao" class="aba-distribuicao">
                ➕ Nova missão
            </button>

            <button id="abaEmAndamento" class="aba-distribuicao ativa">
                Em andamento
            </button>

            <button id="abaHistorico" class="aba-distribuicao">
                Histórico
            </button>

            <button id="abaGestao" class="aba-distribuicao">
                ⚙️ Gestão
            </button>

        </div>


        <!-- =====================================
             FILTRO HISTÓRICO
        ====================================== -->

        <div id="filtroHistorico" style="display: none;">

            <label for="filtroDataHistorico">

                Filtrar histórico por dia

            </label>


            <input type="date" id="filtroDataHistorico">


            <button type="button" id="btnLimparFiltroHistorico">

                Todos os dias

            </button>

        </div>


        <!-- =====================================
             LISTA
        ====================================== -->

        <div id="listaDistribuicoes"></div>


    </main>


    <!-- =========================================
         MENU
    ========================================= -->

    <script>

        fetch("menu.html")

            .then(function (resposta) {

                return resposta.text();

            })

            .then(function (menu) {

                document
                    .getElementById(
                        "menu-container"
                    )
                    .innerHTML = menu;


                const paginaAtual =
                    window.location.pathname
                        .split("/")
                        .pop();


                document
                    .querySelectorAll(
                        ".menu a"
                    )
                    .forEach(
                        function (link) {

                            const paginaLink =
                                link.getAttribute(
                                    "href"
                                );


                            if (
                                paginaLink ===
                                paginaAtual
                            ) {

                                link.classList.add(
                                    "ativo"
                                );

                            }

                        }
                    );

            });

    </script>


    <!-- =========================================
         JAVASCRIPT PRINCIPAL
    ========================================= -->

    <script>


        /* =========================================
           ELEMENTOS
        ========================================= */

        const lista =
            document.getElementById(
                "listaDistribuicoes"
            );


        const abaEmAndamento =
            document.getElementById(
                "abaEmAndamento"
            );


        const abaHistorico =
            document.getElementById(
                "abaHistorico"
            );


        const abaGestao =
            document.getElementById(
                "abaGestao"
            );


        const filtroHistorico =
            document.getElementById(
                "filtroHistorico"
            );


        const filtroDataHistorico =
            document.getElementById(
                "filtroDataHistorico"
            );


        const btnLimparFiltroHistorico =
            document.getElementById(
                "btnLimparFiltroHistorico"
            );


        /* =========================================
           LER DISTRIBUIÇÕES
        ========================================= */

        function obterDistribuicoes() {

            return JSON.parse(
                localStorage.getItem(
                    "distribuicoes"
                )
            ) || [];

        }


        /* =========================================
           MOSTRAR LISTA
        ========================================= */

        function mostrarLista(
            tipo,
            dataForcada
        ) {

            lista.innerHTML = "";


            /* =====================================
               CONTROLAR FILTRO
            ====================================== */

            if (
                filtroHistorico
            ) {

                filtroHistorico.style.display =
                    tipo === "historico"
                        ? "block"
                        : "none";

            }


            const distribuicoes =
                obterDistribuicoes();


            /* =====================================
               FILTRAR
            ====================================== */

            const distribuicoesFiltradas =
                distribuicoes

                    .filter(
                        function (
                            distribuicao
                        ) {

                            if (
                                !distribuicao
                            ) {

                                return false;

                            }


                            /* =====================
                               EM ANDAMENTO
                            ====================== */

                            if (
                                tipo ===
                                "andamento"
                            ) {

                                return (
                                    distribuicao.status ===
                                    "Em andamento"
                                );

                            }


                            /* =====================
                               HISTÓRICO
                            ====================== */

                            if (
                                distribuicao.status !==
                                "Concluída"
                            ) {

                                return false;

                            }


                            /*
 * Se existir filtro
 * por dia, aplicar.
 */

                            console.log(
                                "FILTRO HISTÓRICO:",
                                filtroDataHistorico.value
                            );

                            const dataFiltro =
                                dataForcada ||
                                (
                                    filtroDataHistorico
                                        ? filtroDataHistorico.value
                                        : ""
                                );


                            if (dataFiltro) {

                                const partes =
                                    dataFiltro.split("-");


                                const dataFormatada =
                                    partes[2] +
                                    "/" +
                                    partes[1] +
                                    "/" +
                                    partes[0];


                                return (
                                    distribuicao.data ===
                                    dataFormatada
                                );

                            }


                            return true;

                        }
                    )


                    /* =================================
                       ORDENAR
                    ================================= */

                    .sort(
                        function (
                            a,
                            b
                        ) {

                            const dataA =
                                a.fimTimestamp ||
                                a.inicioTimestamp ||
                                0;


                            const dataB =
                                b.fimTimestamp ||
                                b.inicioTimestamp ||
                                0;


                            return (
                                dataB -
                                dataA
                            );

                        }
                    );


            /* =====================================
               TÍTULO
            ====================================== */

            const tituloLista =
                document.getElementById(
                    "tituloListaDistribuicoes"
                );


            if (
                tituloLista
            ) {

                if (
                    tipo ===
                    "andamento"
                ) {

                    tituloLista.textContent =
                        distribuicoesFiltradas.length +
                        " missões em andamento";

                } else {

                    tituloLista.textContent =
                        distribuicoesFiltradas.length +
                        " missões concluídas";

                }

            }


            /* =====================================
               SEM RESULTADOS
            ====================================== */

            if (
                distribuicoesFiltradas.length ===
                0
            ) {

                lista.innerHTML =
                    tipo === "andamento"

                        ? `
                            <p>
                                Nenhuma distribuição
                                em andamento.
                            </p>
                        `

                        : `
                            <p>
                                Nenhuma distribuição
                                encontrada.
                            </p>
                        `;

                return;

            }


            /* =====================================
               CRIAR CARTÕES
            ====================================== */

            distribuicoesFiltradas.forEach(
                function (
                    distribuicao,
                    indice
                ) {


                    const clientes =
                        Array.isArray(
                            distribuicao.clientes
                        )
                            ? distribuicao.clientes
                            : [];


                    lista.innerHTML += `

                        <div
    class="
        cartao-distribuicao
        ${distribuicao.retornoBase === "Em andamento"
                            ? "cartao-retornando"
                            : ""
                        }
    "
    onclick="
        abrirDistribuicao(
            ${distribuicao.id}
        )
    "
>

                            <h2>

                                Missão
                                ${indice + 1}

                            </h2>


                            <div
                                class="info-distribuicao"
                            >

                                <p>

    Data:

    <strong>
        ${distribuicao.data || "-"}
    </strong>

    <span style="margin-left: 8px;">
        · Início:
    </span>

    <strong>
        ${distribuicao.horaInicio || "-"}
    </strong>

</p>


                                <p>

                                    Operador:

                                    <strong>

                                        ${distribuicao.distribuidor || "-"}

                                    </strong>

                                </p>


                                <p>

    Aeronave:

    <strong>
        ${distribuicao.veiculo || "-"}
    </strong>

    <span style="margin-left: 8px;">
        · Pontos:
    </span>

    <strong>
        ${clientes.length}
    </strong>

</p>


                                ${tipo ===
                            "historico"

                            ? `

                                            <div
                                                style="
                                                    display:
                                                        flex;
                                                    gap:
                                                        20px;
                                                    flex-wrap:
                                                        wrap;
                                                "
                                            >

                                                ${distribuicao.horaInicio

                                ? `

                                                            <p>

                                                                Iniciada:

                                                                <strong>

                                                                    ${distribuicao.horaInicio}

                                                                </strong>

                                                            </p>

                                                        `

                                : ""
                            }


                                                ${distribuicao.horaFim

                                ? `

                                                            <p>

                                                                Finalizada:

                                                                <strong>

                                                                    ${distribuicao.horaFim}

                                                                </strong>

                                                            </p>

                                                        `

                                : ""
                            }

                                            </div>


                                            ${distribuicao.duracao !==
                                undefined

                                ? `

                                                        <p>

                                                            Duração:

                                                            <strong>

                                                                ${formatarDuracao(
                                    distribuicao.duracao
                                )}

                                                            </strong>

                                                        </p>

                                                    `

                                : ""
                            }

                                        `

                            : ""
                        }


                                <span
    class="
        estado-distribuicao

        ${distribuicao.retornoBase === "Em andamento"

                            ? "estado-retornando"

                            : distribuicao.status === "Em andamento"

                                ? "estado-em-andamento"

                                : ""
                        }
    "
>

    ${distribuicao.retornoBase === "Em andamento"

                            ? "Retornando à base"

                            : distribuicao.status || "Concluída"
                        }

</span>


                            </div>

                        </div>

                    `;

                }
            );

        }

        function concluirEntrega(idDistribuicao, codigoCliente) {

            const distribuicoes =
                obterDistribuicoes();

            const distribuicao =
                distribuicoes.find(
                    function (item) {

                        return (
                            String(item.id) ===
                            String(idDistribuicao)
                        );

                    }
                );


            if (!distribuicao) {
                return;
            }


            const cliente =
                distribuicao.clientes.find(
                    function (item) {

                        return (
                            String(item.codigo) ===
                            String(codigoCliente)
                        );

                    }
                );


            if (!cliente) {
                return;
            }


            cliente.statusEntrega =
                "Concluída";

            cliente.horaEntrega =
                new Date().toLocaleTimeString(
                    "pt-PT",
                    {
                        hour: "2-digit",
                        minute: "2-digit"
                    }
                );

            const todasEntregasConcluidas =
                distribuicao.clientes.every(
                    function (cliente) {

                        return (
                            cliente.statusEntrega ===
                            "Concluída"
                        );

                    }
                );


            if (todasEntregasConcluidas) {

                distribuicao.status =
                    "Em andamento";

                distribuicao.retornoBase =
                    "Em andamento";

            }


            localStorage.setItem(
                "distribuicoes",
                JSON.stringify(distribuicoes)
            );


            abrirDistribuicao(
                idDistribuicao
            );

        }


        /* =========================================
           ABRIR DISTRIBUIÇÃO
        ========================================= */

        function abrirDistribuicao(
            id
        ) {

            const distribuicoes =
                obterDistribuicoes();


            const distribuicao =
                distribuicoes.find(
                    function (
                        item
                    ) {

                        return (
                            String(item.id) ===
                            String(id)
                        );

                    }
                );


            if (
                !distribuicao
            ) {

                return;

            }


            /* =====================================
               CLIENTES
            ====================================== */

            const clientesDaDistribuicao =
                Array.isArray(
                    distribuicao.clientes
                )

                    ? distribuicao.clientes
                        .slice()

                    : [];

            /* =====================================
               MOSTRAR DETALHES
            ====================================== */

            lista.innerHTML = `

                <div
                    class="detalhe-distribuicao"
                >

                    <h1>
                        Missão
                    </h1>


                    <h2>

                        ${distribuicao.distribuidor ||
                "Distribuidor"
                }

                    </h2>


                    <div class="detalhe-item">

                        Veículo:

                        <strong>

                            ${distribuicao.veiculo ||
                "Não registado"
                }

                        </strong>

                    </div>


                    <div class="detalhe-item">

                        Data:

                        <strong>

                            ${distribuicao.data ||
                "Não registada"
                }

                        </strong>

                    </div>


                    <div class="detalhe-item">

                        Início:

                        <strong>

                            ${distribuicao.horaInicio ||
                "Não registado"
                }

                        </strong>

                    </div>


                    ${distribuicao.horaFim

                    ? `

                                <div
                                    class="detalhe-item"
                                >

                                    Fim:

                                    <strong>

                                        ${distribuicao.horaFim}

                                    </strong>

                                </div>

                            `

                    : ""
                }


                    <h3>

                        Pontos de entrega

                    </h3>


                    <div
                        class="clientes-da-distribuicao"
                    >

                        ${clientesDaDistribuicao.length > 0

                    ? clientesDaDistribuicao
                        .map(
                            function (
                                cliente,
                                indice
                            ) {

                                const statusEntrega =
                                    cliente.statusEntrega || "Pendente";

                                return `

    <div
        class="
            cliente-distribuicao
        "
    >

        <strong>

            ${indice + 1}.

            ${cliente.codigo || ""}

            -

            ${cliente.nome || ""}

        </strong>

        <span>
            ${statusEntrega}
        </span>

        ${statusEntrega !== "Concluída"

                                        ? `
        <button
            type="button"
            onclick="
                event.stopPropagation();
                concluirEntrega(
                    '${distribuicao.id}',
                    '${cliente.codigo}'
                );
            "
        >
            ✓ Concluir entrega
        </button>
    `

                                        : ""
                                    }

    </div>

`;
                            }
                        )
                        .join("")

                    : `

                                    <div
                                        class="
                                            cliente-distribuicao
                                        "
                                    >

                                        Nenhum ponto de entrega
                                        registado.

                                    </div>

                                `
                }

                    </div>


                    <div
                        class="detalhe-item"
                        style="
                            margin-top: 10px;
                        "
                    >

                        Status:


                        <span
                            class="
                                estado-distribuicao
                                ${distribuicao.status ===
                    "Em andamento"

                    ? "estado-em-andamento"

                    : ""
                }
                            "
                        >

                            ${distribuicao.status ||
                "Concluída"
                }

                        </span>

                    </div>


                    ${distribuicao.duracao !==
                    undefined

                    ? `

                                <div
                                    class="detalhe-item"
                                >

                                    Duração:

                                    <strong>

                                        ${formatarDuracao(
                        distribuicao.duracao
                    )}

                                    </strong>

                                </div>

                            `

                    : ""
                }


                    <div
                        class="acoes-distribuicao"
                    >

                        ${distribuicao.retornoBase === "Em andamento"

                    ? `
        <button
            type="button"
            id="confirmarChegadaBase"
        >
            🏠 Confirmar chegada à base
        </button>
    `

                    : `
        <button
            id="finalizarDistribuicao"

            ${distribuicao.status === "Concluída"
                        ? "disabled"
                        : ""
                    }
        >

            ${distribuicao.status === "Concluída"
                        ? "Missão concluída"
                        : "Finalizar missão"
                    }

        </button>
    `
                }
                        <button
                            class="
                                btn-voltar-distribuicoes
                            "

                            id="btnVoltarDistribuicao"
                        >

                            Voltar

                        </button>

                    </div>


                </div>

            `;


            /* =====================================
               BOTÃO FINALIZAR
            ====================================== */

            const botaoFinalizar =
                document.getElementById(
                    "finalizarDistribuicao"
                );


            if (
                botaoFinalizar
            ) {

                botaoFinalizar.addEventListener(
                    "click",
                    function () {

                        const agora =
                            new Date();


                        distribuicao.horaFim =
                            agora.toLocaleTimeString(
                                "pt-PT",
                                {
                                    hour:
                                        "2-digit",

                                    minute:
                                        "2-digit"
                                }
                            );


                        distribuicao.fimTimestamp =
                            agora.getTime();

                        if (Array.isArray(distribuicao.clientes)) {

                            distribuicao.clientes.forEach(
                                function (cliente) {

                                    cliente.statusEntrega =
                                        "Concluída";

                                }
                            );

                        }


                        distribuicao.status =
                            "Concluída";

                        distribuicao.retornoBase =
                            "Em andamento";


                        if (
                            distribuicao.inicioTimestamp
                        ) {

                            const duracaoMilissegundos =
                                distribuicao.fimTimestamp -
                                distribuicao.inicioTimestamp;


                            distribuicao.duracao =
                                Math.floor(
                                    duracaoMilissegundos /
                                    1000
                                );

                        }


                        localStorage.setItem(
                            "distribuicoes",

                            JSON.stringify(
                                distribuicoes
                            )
                        );


                        alert(
                            "Missão finalizada com sucesso!"
                        );


                        /*
                         * Depois de finalizar,
                         * mostramos o histórico.
                         */

                        ativarAba(
                            "historico"
                        );


                        /*
                         * Mantém o histórico
                         * sem filtro.
                         */

                        filtroDataHistorico.value =
                            "";


                        mostrarLista(
                            "historico"
                        );

                    }
                );

            }

            /* =====================================
   BOTÃO CONFIRMAR CHEGADA À BASE
====================================== */

            const botaoChegadaBase =
                document.getElementById(
                    "confirmarChegadaBase"
                );

            if (botaoChegadaBase) {

                botaoChegadaBase.addEventListener(
                    "click",
                    function () {

                        const agora =
                            new Date();

                        distribuicao.retornoBase =
                            "Concluído";

                        distribuicao.status =
                            "Concluída";

                        distribuicao.horaChegadaBase =
                            agora.toLocaleTimeString(
                                "pt-PT",
                                {
                                    hour: "2-digit",
                                    minute: "2-digit"
                                }
                            );

                        distribuicao.horaFim =
                            agora.toLocaleTimeString(
                                "pt-PT",
                                {
                                    hour: "2-digit",
                                    minute: "2-digit"
                                }
                            );

                        distribuicao.fimTimestamp =
                            agora.getTime();

                        if (distribuicao.inicioTimestamp) {

                            distribuicao.duracao =
                                Math.floor(
                                    (
                                        distribuicao.fimTimestamp -
                                        distribuicao.inicioTimestamp
                                    ) / 1000
                                );

                        }

                        localStorage.setItem(
                            "distribuicoes",
                            JSON.stringify(distribuicoes)
                        );

                        alert(
                            "Chegada à base confirmada. Missão concluída!"
                        );

                        ativarAba(
                            "historico"
                        );

                        mostrarLista(
                            "historico"
                        );

                    }
                );

            }


            /* =====================================
               BOTÃO VOLTAR
            ====================================== */

            const botaoVoltar =
                document.getElementById(
                    "btnVoltarDistribuicao"
                );


            if (
                botaoVoltar
            ) {

                botaoVoltar.addEventListener(
                    "click",
                    function () {

                        mostrarDistribuicoes();

                    }
                );

            }

        }


        /* =========================================
           ATIVAR ABA
        ========================================= */

        function ativarAba(
            tipo
        ) {

            abaEmAndamento
                .classList
                .remove("ativa");


            abaHistorico
                .classList
                .remove("ativa");


            if (
                tipo ===
                "andamento"
            ) {

                abaEmAndamento
                    .classList
                    .add("ativa");

            }


            if (
                tipo ===
                "historico"
            ) {

                abaHistorico
                    .classList
                    .add("ativa");

            }

        }


        /* =========================================
           MOSTRAR DISTRIBUIÇÕES
        ========================================= */

        function mostrarDistribuicoes() {

            ativarAba(
                "andamento"
            );


            mostrarLista(
                "andamento"
            );

        }


        /* =========================================
           BOTÃO EM ANDAMENTO
        ========================================= */

        abaEmAndamento.addEventListener(
            "click",
            function () {

                ativarAba(
                    "andamento"
                );


                mostrarLista(
                    "andamento"
                );

            }
        );


        /* =========================================
           BOTÃO HISTÓRICO
        ========================================= */

        abaHistorico.addEventListener(
            "click",
            function () {

                ativarAba(
                    "historico"
                );


                /*
                 * Só limpar o filtro quando o utilizador
                 * clicar manualmente na aba Histórico.
                 *
                 * Se a página foi aberta pelo Dashboard
                 * com ?modo=historico&data=..., não devemos
                 * apagar a data recebida pela URL.
                 */

                const parametros =
                    new URLSearchParams(
                        window.location.search
                    );


                const dataURL =
                    parametros.get(
                        "data"
                    );


                if (!dataURL) {

                    filtroDataHistorico.value =
                        "";

                }


                mostrarLista(
                    "historico"
                );

            }
        );


        /* =========================================
           BOTÃO GESTÃO
        ========================================= */

        abaGestao.addEventListener(
            "click",
            function () {

                window.location.href =
                    "gestao-distribuicoes.html";

            }
        );

        const abaNovaMissao =
            document.getElementById("abaNovaMissao");

        abaNovaMissao.addEventListener("click", function (event) {

            event.preventDefault();
            event.stopPropagation();

            window.location.href = "rotas.html";

        });


        /* =========================================
           FILTRO POR DATA
        ========================================= */

        filtroDataHistorico.addEventListener(
            "change",
            function () {

                mostrarLista(
                    "historico"
                );

            }
        );


        /* =========================================
           LIMPAR FILTRO
        ========================================= */

        btnLimparFiltroHistorico.addEventListener(
            "click",
            function () {

                filtroDataHistorico.value =
                    "";


                mostrarLista(
                    "historico"
                );

            }
        );


        /* =========================================
           FORMATAR DURAÇÃO
        ========================================= */

        function formatarDuracao(
            segundos
        ) {

            segundos =
                Number(
                    segundos || 0
                );


            const horas =
                Math.floor(
                    segundos / 3600
                );


            const minutos =
                Math.floor(
                    (segundos % 3600) / 60
                );


            const segundosRestantes =
                segundos % 60;


            if (
                horas > 0
            ) {

                return (
                    horas +
                    "h " +
                    minutos +
                    "min " +
                    segundosRestantes +
                    "s"
                );

            }


            if (
                minutos > 0
            ) {

                return (
                    minutos +
                    "min " +
                    segundosRestantes +
                    "s"
                );

            }


            return (
                segundosRestantes +
                " segundos"
            );

        }


        /* =========================================
           CONVERTER DATA PARA YYYY-MM-DD
        ========================================= */

        function converterDataParaISO(
            dataTexto
        ) {

            if (
                !dataTexto
            ) {

                return "";

            }


            const partes =
                dataTexto.split("/");


            if (
                partes.length !== 3
            ) {

                return "";

            }


            return (
                partes[2] +
                "-" +
                partes[1] +
                "-" +
                partes[0]
            );

        }


        /* =========================================
           INICIALIZAÇÃO A PARTIR DA URL
        ========================================= */

        function inicializarAPartirDaURL() {

            const parametros =
                new URLSearchParams(
                    window.location.search
                );


            const id =
                parametros.get(
                    "id"
                );


            const modo =
                parametros.get(
                    "modo"
                );


            const data =
                parametros.get(
                    "data"
                );


            const mes =
                parametros.get(
                    "mes"
                );


            /* =====================================
               ABRIR DISTRIBUIÇÃO ESPECÍFICA
            ====================================== */

            if (
                id
            ) {

                abrirDistribuicao(
                    id
                );

                return;

            }


            /* =====================================
               ABRIR HISTÓRICO
            ====================================== */

            if (
                modo ===
                "historico"
            ) {

                ativarAba(
                    "historico"
                );


                /*
                 * Se foi enviada uma data
                 * específica pelo Dashboard,
                 * aplicar diretamente.
                 */

                if (
                    data
                ) {

                    filtroDataHistorico.value =
                        data;

                }


                /*
                 * Se foi enviado um mês,
                 * mostramos o histórico desse
                 * mês através de uma filtragem
                 * especial.
                 */

                if (
                    mes
                ) {

                    mostrarHistoricoPorMes(
                        mes
                    );

                    return;

                }


                mostrarLista(
                    "historico",
                    data
                );

                return;

            }


            /* =====================================
               COMPORTAMENTO NORMAL
            ====================================== */

            mostrarLista(
                "andamento"
            );

        }


        /* =========================================
           HISTÓRICO POR MÊS
        ========================================= */

        function mostrarHistoricoPorMes(
            mesSelecionado
        ) {

            lista.innerHTML = "";


            filtroHistorico.style.display =
                "block";


            /*
             * Retiramos o filtro diário
             * porque o Dashboard pediu
             * o histórico mensal.
             */

            filtroDataHistorico.value =
                "";


            const distribuicoes =
                obterDistribuicoes();


            const distribuicoesFiltradas =
                distribuicoes

                    .filter(
                        function (
                            distribuicao
                        ) {

                            if (
                                !distribuicao
                            ) {

                                return false;

                            }


                            if (
                                distribuicao.status !==
                                "Concluída"
                            ) {

                                return false;

                            }


                            const dataISO =
                                converterDataParaISO(
                                    distribuicao.data
                                );


                            return (
                                dataISO.substring(
                                    0,
                                    7
                                ) ===
                                mesSelecionado
                            );

                        }
                    )


                    .sort(
                        function (
                            a,
                            b
                        ) {

                            const dataA =
                                a.fimTimestamp ||
                                a.inicioTimestamp ||
                                0;


                            const dataB =
                                b.fimTimestamp ||
                                b.inicioTimestamp ||
                                0;


                            return (
                                dataB -
                                dataA
                            );

                        }
                    );


            /* =====================================
   TOTAL DE ENTREGAS DO MÊS
====================================== */

            let totalEntregasMes =
                0;


            distribuicoesFiltradas.forEach(
                function (
                    distribuicao
                ) {

                    if (
                        Array.isArray(
                            distribuicao.clientes
                        )
                    ) {

                        totalEntregasMes +=
                            distribuicao.clientes.length;

                    }

                }
            );


            /* =====================================
               TÍTULO
            ====================================== */

            const tituloLista =
                document.getElementById(
                    "tituloListaDistribuicoes"
                );


            if (
                tituloLista
            ) {

                tituloLista.textContent =
                    distribuicoesFiltradas.length +
                    " distribuições concluídas no mês" +
                    " · " +
                    totalEntregasMes +
                    " entregas";

            }


            if (
                distribuicoesFiltradas.length ===
                0
            ) {

                lista.innerHTML = `

                    <p>

                        Nenhuma distribuição
                        concluída neste mês.

                    </p>

                `;

                return;

            }


            distribuicoesFiltradas.forEach(
                function (
                    distribuicao,
                    indice
                ) {

                    const clientes =
                        Array.isArray(
                            distribuicao.clientes
                        )
                            ? distribuicao.clientes
                            : [];


                    lista.innerHTML += `

                        <div
                            class="cartao-distribuicao"

                            onclick="
                                abrirDistribuicao(
                                    ${distribuicao.id}
                                )
                            "
                        >

                            <h2>

                                Distribuição
                                ${indice + 1}

                            </h2>


                            <div
                                class="info-distribuicao"
                            >

                                <p>

                                    Data:

                                    <strong>

                                        ${distribuicao.data || "-"}

                                    </strong>

                                </p>


                                <p>

                                    Distribuidor:

                                    <strong>

                                        ${distribuicao.distribuidor || "-"}

                                    </strong>

                                </p>


                                <p>

                                    Veículo:

                                    <strong>

                                        ${distribuicao.veiculo || "-"}

                                    </strong>

                                </p>


                                <p>

                                    <strong>

                                        ${clientes.length}

                                        clientes

                                    </strong>

                                </p>


                                <div
                                    style="
                                        display:
                                            flex;
                                        gap:
                                            20px;
                                        flex-wrap:
                                            wrap;
                                    "
                                >

                                    ${distribuicao.horaInicio

                            ? `

                                                <p>

                                                    Iniciada:

                                                    <strong>

                                                        ${distribuicao.horaInicio}

                                                    </strong>

                                                </p>

                                            `

                            : ""
                        }


                                    ${distribuicao.horaFim

                            ? `

                                                <p>

                                                    Finalizada:

                                                    <strong>

                                                        ${distribuicao.horaFim}

                                                    </strong>

                                                </p>

                                            `

                            : ""
                        }

                                </div>


                                ${distribuicao.duracao !==
                            undefined

                            ? `

                                            <p>

                                                Duração:

                                                <strong>

                                                    ${formatarDuracao(
                                distribuicao.duracao
                            )}

                                                </strong>

                                            </p>

                                        `

                            : ""
                        }


                                <span
                                    class="
                                        estado-distribuicao
                                    "
                                >

                                    ${distribuicao.status ||
                        "Concluída"
                        }

                                </span>

                            </div>

                        </div>

                    `;

                }
            );

        }


        /* =========================================
           INICIAR
        ========================================= */

        inicializarAPartirDaURL();


    </script>


</body>

</html>
